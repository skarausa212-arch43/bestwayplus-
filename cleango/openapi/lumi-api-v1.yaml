components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    Limit:
      in: query
      name: limit
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Cursor:
      in: query
      name: cursor
      schema: { type: string }
      description: Opaque cursor for stable, high-volume pagination.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
      description: Retryable-write idempotency. Same key + same body returns the original result.

  responses:
    Accepted:
      description: Accepted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OkEnvelope" }
    GenericObject:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: object, additionalProperties: true }
              meta: { $ref: "#/components/schemas/Meta" }
    GenericList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object, additionalProperties: true } }
              pagination: { $ref: "#/components/schemas/Pagination" }
              meta: { $ref: "#/components/schemas/Meta" }
    ProfileResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Profile" }
              meta: { $ref: "#/components/schemas/Meta" }
    PropertyResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Property" }
    ServiceCategoryResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/ServiceCategory" }
    BookingResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Booking" }
              meta: { $ref: "#/components/schemas/Meta" }
    BookingListResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Booking" } }
              pagination: { $ref: "#/components/schemas/Pagination" }
    EstimateResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Estimate" }
    OfferResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/Offer" }
    WalletResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/WalletBalance" }
    SmartHomeResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/SmartHome" }
    ProviderLocationResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/ProviderLocation" }
    FlashPreviewResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/FlashPreview" }
    FlashSearchStatusResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/FlashSearchStatus" }
    UploadSessionResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/UploadSession" }
    PromoValidateResponse:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: "#/components/schemas/PromoValidation" }
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Role or ownership check failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationError:
      description: Payload validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: State conflict / invalid transition
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    PaymentError:
      description: Payment could not be processed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    Meta:
      type: object
      properties:
        requestId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        nextCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
    OkEnvelope:
      type: object
      properties:
        data: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            requestId: { type: string, format: uuid }
    ErrorCode:
      type: string
      enum:
        - AUTH_REQUIRED
        - AUTH_TOKEN_EXPIRED
        - AUTH_INVALID_TOKEN
        - ACCOUNT_PENDING
        - ACCOUNT_SUSPENDED
        - ACCOUNT_BLOCKED
        - ROLE_FORBIDDEN
        - VALIDATION_ERROR
        - MISSING_REQUIRED_FIELD
        - INVALID_FORMAT
        - INVALID_STATE_TRANSITION
        - RESOURCE_NOT_FOUND
        - BOOKING_NOT_FOUND
        - BOOKING_ALREADY_ACCEPTED
        - BOOKING_NOT_SEARCHABLE
        - BOOKING_EXPIRED
        - BOOKING_CANNOT_CANCEL
        - BOOKING_PHOTOS_REQUIRED
        - BOOKING_ALREADY_COMPLETED
        - BOOKING_ACCESS_DENIED
        - PROVIDER_NOT_VERIFIED
        - PROVIDER_OFFLINE
        - PROVIDER_UNAVAILABLE
        - PROVIDER_DOCUMENT_EXPIRED
        - PROVIDER_ALREADY_BUSY
        - PAYMENT_METHOD_REQUIRED
        - PAYMENT_AUTHORIZATION_FAILED
        - PAYMENT_CAPTURE_FAILED
        - PAYMENT_ALREADY_CAPTURED
        - REFUND_NOT_ALLOWED
        - PAYOUT_NOT_AVAILABLE
        - MEDIA_UPLOAD_FAILED
        - MEDIA_INVALID_TYPE
        - MEDIA_TOO_LARGE
        - MEDIA_ACCESS_DENIED
        - PROMO_INVALID
        - PROMO_EXPIRED
        - PROMO_LIMIT_REACHED
        - SUBSCRIPTION_REQUIRED
        - SUBSCRIPTION_INACTIVE
        - IDEMPOTENCY_KEY_REUSED
        - RATE_LIMITED
        - TOO_MANY_SMS_ATTEMPTS
        - TOO_MANY_BOOKING_ATTEMPTS

    BookingStatus:
      type: string
      enum: [draft, estimating, awaiting_payment_method, searching, offered, accepted,
             provider_en_route, provider_arrived, in_progress,
             awaiting_completion_confirmation, completed, cancelled, disputed, refunded, expired]
    BookingMode:
      type: string
      enum: [scheduled, instant, flashclean, recurring, airbnb_automatic, corporate]

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [customer, provider, company_manager, company_staff, admin, support] }
        status: { type: string, enum: [pending, active, suspended, blocked, deleted] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
        locale: { type: string }
        timezone: { type: string }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: string }
        locale: { type: string }
        marketingConsent: { type: boolean }

    ProviderBasic:
      type: object
      properties:
        dateOfBirth: { type: string, format: date }
        pesel: { type: string }
        address: { $ref: "#/components/schemas/Address" }
        languages:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              proficiency: { type: string, enum: [basic, intermediate, advanced, native] }
    ProviderEquipment:
      type: object
      properties:
        hasVehicle: { type: boolean }
        hasProfessionalChemicals: { type: boolean }
        hasVacuum: { type: boolean }
        hasSteamCleaner: { type: boolean }
        hasWindowEquipment: { type: boolean }
        serviceRadiusKm: { type: number }
        emergencyAvailable: { type: boolean }
    DocumentUploadRequest:
      type: object
      required: [documentType, mimeType, sizeBytes]
      properties:
        documentType: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }

    Address:
      type: object
      properties:
        line1: { type: string }
        line2: { type: [string, "null"] }
        city: { type: string }
        postalCode: { type: string }
        countryCode: { type: string, default: PL }

    ServiceCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        iconKey: { type: [string, "null"] }
        supportsInstant: { type: boolean }
        supportsScheduled: { type: boolean }
        supportsRecurring: { type: boolean }
        requiresPhotos: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              type: { type: string, enum: [number, boolean, text, select] }
              required: { type: boolean }

    Property:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        propertyType: { type: string, enum: [apartment, house, office] }
        address: { $ref: "#/components/schemas/Address" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        areaSqm: { type: [number, "null"] }
        roomsCount: { type: [integer, "null"] }
        bathroomsCount: { type: [integer, "null"] }
        hasPets: { type: boolean }
        lumiScore: { type: [integer, "null"] }
        myRole: { type: string, enum: [owner, family, guest] }
    PropertyCreate:
      type: object
      required: [name, propertyType, address]
      properties:
        name: { type: string }
        propertyType: { type: string, enum: [apartment, house, office] }
        address: { $ref: "#/components/schemas/Address" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        areaSqm: { type: number }
        roomsCount: { type: integer }
        bathroomsCount: { type: integer }
        hasElevator: { type: boolean }
        hasParking: { type: boolean }
        hasPets: { type: boolean }
        accessNotes: { type: string }

    MemberInvite:
      type: object
      required: [email, permissions]
      properties:
        email: { type: string, format: email }
        permissions: { $ref: "#/components/schemas/MemberPermissions" }
    MemberPermissions:
      type: object
      properties:
        view: { type: boolean }
        book: { type: boolean }
        pay: { type: boolean }
        manage: { type: boolean }

    MediaUploadRequest:
      type: object
      required: [type, mimeType, sizeBytes]
      properties:
        bookingId: { type: [string, "null"], format: uuid }
        propertyId: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [image, video, document, voice] }
        stage: { type: string, enum: [booking_request, before_service, during_service, after_service, dispute] }
        mimeType: { type: string }
        sizeBytes: { type: integer }
    UploadSession:
      type: object
      properties:
        mediaId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        uploadUrl: { type: string }
        storagePath: { type: string }
        expiresAt: { type: string, format: date-time }

    BookingCreate:
      type: object
      required: [propertyId, serviceCategoryId, mode]
      properties:
        propertyId: { type: string, format: uuid }
        serviceCategoryId: { type: string, format: uuid }
        mode: { $ref: "#/components/schemas/BookingMode" }
        scheduledStart: { type: [string, "null"], format: date-time }
        customerNotes: { type: string }
        answers: { type: object, additionalProperties: true }
        serviceOptions:
          type: array
          items:
            type: object
            properties:
              serviceOptionId: { type: string, format: uuid }
              value: {}
        mediaIds: { type: array, items: { type: string, format: uuid } }
    Booking:
      type: object
      description: Role-shaped. platformFee is never present in customer/provider payloads.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/BookingStatus" }
        mode: { $ref: "#/components/schemas/BookingMode" }
        propertyId: { type: string, format: uuid }
        serviceCategoryId: { type: string, format: uuid }
        scheduledStart: { type: [string, "null"], format: date-time }
        customerTotal: { type: [number, "null"], description: "Present in customer payloads only" }
        providerGross: { type: [number, "null"], description: "Present in provider payloads only" }
        currency: { type: string }
        durationMinutes: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }

    Estimate:
      type: object
      properties:
        status: { type: string, enum: [processing, ready, failed] }
        estimatedDurationMinutes: { type: integer }
        estimatedWorkers: { type: integer }
        difficultyScore: { type: number }
        confidence: { type: number }
        suggestedServices:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              reason: { type: string }
        quote: { $ref: "#/components/schemas/Quote" }
    Quote:
      type: object
      properties:
        quoteId: { type: string, format: uuid }
        customerTotal: { type: number }
        currency: { type: string }
        expiresAt: { type: string, format: date-time }

    Offer:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        service:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
        providerGross: { type: number }
        currency: { type: string }
        estimatedDistanceKm: { type: number }
        estimatedArrivalMinutes: { type: integer }
        estimatedDurationMinutes: { type: integer }
        expiresAt: { type: string, format: date-time }
        requirements: { type: array, items: { type: string } }

    LocationSample:
      type: object
      required: [lat, lng]
      properties:
        bookingId: { type: [string, "null"], format: uuid }
        lat: { type: number }
        lng: { type: number }
        accuracyMeters: { type: number }
        heading: { type: number }
        speedMps: { type: number }
        recordedAt: { type: string, format: date-time }
    ProviderLocation:
      type: object
      properties:
        lat: { type: number }
        lng: { type: number }
        etaMinutes: { type: [integer, "null"] }
        recordedAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [text, image, video, voice, system, location] }
        body: { type: [string, "null"] }
        mediaId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }

    WalletBalance:
      type: object
      properties:
        availableBalance: { type: number }
        pendingBalance: { type: number }
        currency: { type: string }

    ReviewCreate:
      type: object
      required: [qualityRating, punctualityRating, communicationRating, professionalismRating]
      properties:
        qualityRating: { type: integer, minimum: 1, maximum: 5 }
        punctualityRating: { type: integer, minimum: 1, maximum: 5 }
        communicationRating: { type: integer, minimum: 1, maximum: 5 }
        professionalismRating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    SmartHome:
      type: object
      properties:
        lumiScore: { type: integer, minimum: 0, maximum: 100 }
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
    Recommendation:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        priority: { type: string, enum: [low, medium, high] }
        title: { type: string }
        reason: { type: string }
        serviceCategoryId: { type: [string, "null"], format: uuid }

    RecurringRule:
      type: object
      required: [propertyId, serviceCategoryId, frequency]
      properties:
        propertyId: { type: string, format: uuid }
        serviceCategoryId: { type: string, format: uuid }
        frequency: { type: string, enum: [weekly, biweekly, monthly, custom] }
        intervalValue: { type: integer, default: 1 }
        preferredWeekday: { type: integer, minimum: 0, maximum: 6 }
        preferredTime: { type: string }
        preferredProviderId: { type: [string, "null"], format: uuid }

    FlashPreviewRequest:
      type: object
      required: [propertyId, serviceCategoryId]
      properties:
        propertyId: { type: string, format: uuid }
        serviceCategoryId: { type: string, format: uuid }
        answers: { type: object, additionalProperties: true }
        mediaIds: { type: array, items: { type: string, format: uuid } }
    FlashPreview:
      type: object
      properties:
        estimatedArrivalMinutes: { type: integer }
        customerTotal: { type: number }
        currency: { type: string }
        surgeMultiplier: { type: number }
        quoteExpiresAt: { type: string, format: date-time }
    FlashSearchStatus:
      type: object
      properties:
        status: { $ref: "#/components/schemas/BookingStatus" }
        round: { type: integer }
        radiusKm: { type: number }
        candidateCount: { type: integer }
        currentCustomerTotal: { type: number }
        elapsedSeconds: { type: integer }

    WeeklyAvailability:
      type: object
      properties:
        weeklySchedule:
          type: array
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              startTime: { type: string }
              endTime: { type: string }

    PromoValidation:
      type: object
      properties:
        valid: { type: boolean }
        discountAmount: { type: number }
        currency: { type: string }

    AdminReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
