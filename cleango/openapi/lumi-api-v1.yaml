openapi: 3.1.0
info:
  title: LUMI API
  version: "1.0.0"
  description: |
    Public and internal API contract for LUMI — the operating system for your
    home (on-demand home services, cleaning first, Poland).

    Conventions (see 06_API_SPECIFICATION.md):
      - REST/JSON, versioned base path `/api/v1`
      - JWT bearer auth; role- and status-checked server-side
      - camelCase payloads, UTC ISO-8601 timestamps, UUID identifiers
      - Idempotency-Key on retryable writes; cursor pagination; stable error codes
      - Critical writes (pricing, assignment, capture, payout, refund) are
        server-only. Internal commission / fraud scores are never returned.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Provider Onboarding
  - name: Service Catalog
  - name: Properties
  - name: Family Home
  - name: Media
  - name: Bookings
  - name: FlashClean
  - name: Provider Availability
  - name: Dispatch Offers
  - name: Active Booking
  - name: Live Location
  - name: Chat
  - name: Payments
  - name: Wallet
  - name: Reviews
  - name: Disputes
  - name: Subscriptions
  - name: Promo
  - name: Referral
  - name: Smart Home
  - name: Recurring
  - name: Airbnb
  - name: Company
  - name: Corporate
  - name: Notifications
  - name: Support
  - name: Admin
  - name: Webhooks

paths:
  # ---- Identity ----
  /me:
    get:
      tags: [Identity]
      summary: Current profile
      responses:
        "200": { $ref: "#/components/responses/ProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Identity]
      summary: Update safe profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200": { $ref: "#/components/responses/ProfileResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/delete-request:
    post:
      tags: [Identity]
      summary: Create GDPR account deletion request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- Provider Onboarding ----
  /provider/onboarding:
    get:
      tags: [Provider Onboarding]
      summary: Onboarding progress
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /provider/onboarding/basic:
    patch:
      tags: [Provider Onboarding]
      summary: Basic identity details
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderBasic" }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /provider/onboarding/equipment:
    patch:
      tags: [Provider Onboarding]
      summary: Equipment & radius
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderEquipment" }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
  /provider/documents:
    post:
      tags: [Provider Onboarding]
      summary: Create a signed document upload session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentUploadRequest" }
      responses:
        "200": { $ref: "#/components/responses/UploadSessionResponse" }
  /provider/onboarding/submit:
    post:
      tags: [Provider Onboarding]
      summary: Submit verification for admin review
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400": { $ref: "#/components/responses/ValidationError" }

  # ---- Service Catalog ----
  /service-categories:
    get:
      tags: [Service Catalog]
      summary: List active service categories
      parameters:
        - { in: query, name: city, schema: { type: string } }
        - { in: query, name: mode, schema: { $ref: "#/components/schemas/BookingMode" } }
        - { in: query, name: locale, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceCategory" }
                  meta: { $ref: "#/components/schemas/Meta" }
  /service-categories/{id}:
    get:
      tags: [Service Catalog]
      summary: Full category schema (fields, options, modes)
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200": { $ref: "#/components/responses/ServiceCategoryResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Properties ----
  /properties:
    get:
      tags: [Properties]
      summary: Owned and shared properties
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Property" }
                  meta: { $ref: "#/components/schemas/Meta" }
    post:
      tags: [Properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyCreate" }
      responses:
        "201": { $ref: "#/components/responses/PropertyResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /properties/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Properties]
      summary: Get property
      responses:
        "200": { $ref: "#/components/responses/PropertyResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Properties]
      summary: Update property
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyCreate" }
      responses:
        "200": { $ref: "#/components/responses/PropertyResponse" }
    delete:
      tags: [Properties]
      summary: Soft-delete property
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Family Home ----
  /properties/{id}/members:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Family Home]
      summary: List property members
      responses:
        "200": { $ref: "#/components/responses/GenericList" }
  /properties/{id}/members/invite:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Family Home]
      summary: Invite a member with permissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberInvite" }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
        "404": { $ref: "#/components/responses/NotFound" }
  /properties/{id}/members/{memberId}:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { in: path, name: memberId, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Family Home]
      summary: Update member permissions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberPermissions" }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
    delete:
      tags: [Family Home]
      summary: Remove member
      responses:
        "204": { description: Removed }
  /property-invitations/{token}/accept:
    parameters:
      - { in: path, name: token, required: true, schema: { type: string } }
    post:
      tags: [Family Home]
      summary: Accept a property invitation
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }

  # ---- Media ----
  /media/upload-session:
    post:
      tags: [Media]
      summary: Create a signed media upload session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadRequest" }
      responses:
        "200": { $ref: "#/components/responses/UploadSessionResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /media/{id}/complete:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Media]
      summary: Mark upload complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checksum: { type: string }
                width: { type: integer }
                height: { type: integer }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
  /media/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    delete:
      tags: [Media]
      summary: Delete media (before evidence lock only)
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---- Bookings ----
  /bookings:
    get:
      tags: [Bookings]
      summary: List bookings (role-scoped)
      parameters:
        - { in: query, name: status, schema: { $ref: "#/components/schemas/BookingStatus" } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { $ref: "#/components/responses/BookingListResponse" }
    post:
      tags: [Bookings]
      summary: Create a draft booking
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreate" }
      responses:
        "201": { $ref: "#/components/responses/BookingResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bookings/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Bookings]
      summary: Get a role-shaped booking
      description: Customer/provider payloads never include platformFee, fraud scores or other providers' offers.
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Bookings]
      summary: Edit booking (draft/editable only)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreate" }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bookings/{id}/estimate:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Bookings]
      summary: Start AI + pricing estimate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaIds: { type: array, items: { type: string, format: uuid } }
                answers: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Estimate processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      estimateId: { type: string, format: uuid }
                      status: { type: string, enum: [processing, ready, failed] }
    get:
      tags: [Bookings]
      summary: Fetch estimate result
      responses:
        "200": { $ref: "#/components/responses/EstimateResponse" }
  /bookings/{id}/confirm:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      tags: [Bookings]
      summary: Confirm quote, authorize payment, start dispatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, paymentMethodId]
              properties:
                quoteId: { type: string, format: uuid }
                paymentMethodId: { type: string, format: uuid }
                promoCode: { type: string }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "402":
          description: Payment could not be authorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /bookings/{id}/cancel:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Bookings]
      summary: Cancel a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string }
                comment: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { $ref: "#/components/schemas/BookingStatus" }
                      cancellationFee: { type: number }
                      refundStatus: { type: string }
        "409": { $ref: "#/components/responses/Conflict" }
  /bookings/{id}/confirm-completion:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Active Booking]
      summary: Customer confirms completion
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
  /bookings/{id}/report-issue:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Active Booking]
      summary: Customer reports an issue at completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category: { type: string }
                description: { type: string }
                mediaIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }

  # ---- FlashClean ----
  /flashclean/preview:
    post:
      tags: [FlashClean]
      summary: Emergency price/ETA preview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FlashPreviewRequest" }
      responses:
        "200": { $ref: "#/components/responses/FlashPreviewResponse" }
  /flashclean/confirm:
    post:
      tags: [FlashClean]
      summary: Create and dispatch an emergency booking
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreate" }
      responses:
        "201": { $ref: "#/components/responses/BookingResponse" }
  /flashclean/{bookingId}/search-status:
    parameters:
      - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [FlashClean]
      summary: Live dispatch search status
      responses:
        "200": { $ref: "#/components/responses/FlashSearchStatusResponse" }

  # ---- Provider availability & status ----
  /provider/availability:
    get:
      tags: [Provider Availability]
      summary: Get weekly availability
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
    put:
      tags: [Provider Availability]
      summary: Replace weekly availability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WeeklyAvailability" }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
  /provider/status/online:
    post:
      tags: [Provider Availability]
      summary: Go online (requires verification)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location: { $ref: "#/components/schemas/GeoPoint" }
                emergencyAvailable: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /provider/status/offline:
    post:
      tags: [Provider Availability]
      summary: Go offline
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }

  # ---- Dispatch offers ----
  /provider/offers:
    get:
      tags: [Dispatch Offers]
      summary: Current valid offers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Offer" } }
                  meta: { $ref: "#/components/schemas/Meta" }
  /provider/offers/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Dispatch Offers]
      summary: Offer detail (providerGross only — never customer price)
      responses:
        "200": { $ref: "#/components/responses/OfferResponse" }
  /provider/offers/{id}/accept:
    parameters:
      - { $ref: "#/components/parameters/PathId" }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      tags: [Dispatch Offers]
      summary: Accept an offer (atomic — only one provider wins)
      description: |
        Backed by the `accept_booking_offer` transaction. Concurrent acceptances
        serialize; the first wins, later callers receive `BOOKING_ALREADY_ACCEPTED`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentLocation: { $ref: "#/components/schemas/GeoPoint" }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Not available / already accepted / provider busy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              examples:
                alreadyAccepted:
                  value: { error: { code: BOOKING_ALREADY_ACCEPTED, message: "This booking is no longer available.", requestId: "5b1c..." } }
  /provider/offers/{id}/decline:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Dispatch Offers]
      summary: Decline an offer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { reasonCode: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }

  # ---- Active booking workflow ----
  /provider/bookings/{id}/en-route:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Active Booking]
      summary: Mark en-route
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
  /provider/bookings/{id}/arrived:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Active Booking]
      summary: Mark arrived (geofenced)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { location: { $ref: "#/components/schemas/GeoPoint" } }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "409": { $ref: "#/components/responses/Conflict" }
  /provider/bookings/{id}/start:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Active Booking]
      summary: Start service (before photos required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beforeMediaIds]
              properties:
                beforeMediaIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                checklist: { type: object, additionalProperties: true }
                customerPin: { type: string }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "400":
          description: Photos required / invalid transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /provider/bookings/{id}/finish:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Active Booking]
      summary: Finish service (after photos required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [afterMediaIds]
              properties:
                afterMediaIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
                checklist: { type: object, additionalProperties: true }
                providerNotes: { type: string }
      responses:
        "200": { $ref: "#/components/responses/BookingResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  # ---- Live location ----
  /provider/location:
    post:
      tags: [Live Location]
      summary: Push a provider location sample
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationSample" }
      responses:
        "204": { description: Accepted }
        "429": { $ref: "#/components/responses/RateLimited" }
  /bookings/{id}/provider-location:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Live Location]
      summary: Provider location for an active booking (customer only)
      responses:
        "200": { $ref: "#/components/responses/ProviderLocationResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---- Chat ----
  /bookings/{id}/conversation:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Chat]
      summary: Get the booking conversation
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
  /conversations/{id}/messages:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    get:
      tags: [Chat]
      summary: List messages
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
    post:
      tags: [Chat]
      summary: Send a text message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, body]
              properties:
                type: { type: string, enum: [text] }
                body: { type: string }
                replyToId: { type: [string, "null"], format: uuid }
      responses:
        "201": { $ref: "#/components/responses/GenericObject" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /conversations/{id}/messages/media:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Chat]
      summary: Send a media message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, mediaId]
              properties:
                type: { type: string, enum: [image, video, voice, location] }
                mediaId: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/GenericObject" }
  /conversations/{id}/read:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    post:
      tags: [Chat]
      summary: Mark read up to a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { lastReadMessageId: { type: string, format: uuid } }
      responses:
        "204": { description: OK }

  # ---- Payments ----
  /payment-methods:
    get:
      tags: [Payments]
      summary: List saved payment methods
      responses:
        "200": { $ref: "#/components/responses/GenericList" }
  /payment-methods/setup-intent:
    post:
      tags: [Payments]
      summary: Create a Stripe SetupIntent
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
  /payment-methods/{id}:
    parameters: [ { $ref: "#/components/parameters/PathId" } ]
    delete:
      tags: [Payments]
      summary: Remove a payment method
      responses:
        "204": { description: Deleted }
  /payments/{bookingId}/authorize:
    parameters:
      - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      - { $ref: "#/components/parameters/IdempotencyKey" }
    post:
      tags: [Payments]
      summary: Authorize payment (usually via booking confirm)
      responses:
        "200": { $ref: "#/components/responses/GenericObject" }
