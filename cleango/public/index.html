}
/* ---------- «Решить проблему» — support / disputes ---------- */
async function renderIssue(b,ctx){
  const z=$('#issueZone'); if(!z)return;
  // Only participants (customer or the assigned cleaner) raise issues.
  const canRaise=(ctx.isCustomer && b.customerId===state.user.id) || (ctx.isCleaner && b.cleanerId===state.user.id);
  if(!canRaise){z.innerHTML='';return;}
  try{
    const {disputes}=await api('/api/bookings/'+b.id+'/issue');
    const open=disputes.find(d=>d.status==='open');
    const resolved=disputes.find(d=>d.status==='resolved');
    if(open){
      z.innerHTML=`<div class="card pad issue-card" style="margin:14px 0">
        <div class="row" style="gap:10px"><span class="issue-ic amber">${I.bell}</span>
          <div style="flex:1"><b>Обращение на рассмотрении</b><div class="tiny muted" style="margin-top:2px">${esc(open.categoryLabel)} · ${timeAgo(open.createdAt)}</div>
          <div class="tiny" style="margin-top:6px;color:var(--ink-2)">«${esc(open.description)}»</div></div></div></div>`;
      return;
    }
    z.innerHTML=`<button class="btn ghost block" id="issueBtn" style="margin:14px 0">${I.shield||I.bell} Решить проблему по заказу</button>
      ${resolved?`<div class="card pad" style="margin-bottom:14px;background:var(--surface-2)"><div class="tiny"><b>${I.check} Прошлое обращение решено</b>${resolved.resolution?` — ${esc(resolved.resolution)}`:''}</div></div>`:''}`;
    const btn=$('#issueBtn',z); if(btn)btn.onclick=()=>openIssue(b.id);
  }catch(e){ z.innerHTML=''; }
}

function downscale(file,max,q){
  // Read as a data: URL (not a blob: URL) — our CSP allows `img-src 'self' data:`
  // but not blob:, so a blob object URL would be refused and never fire onload.
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Не удалось прочитать файл'));
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let{width:w,height:h}=img;
        if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;}
        const cv=document.createElement('canvas');cv.width=Math.round(w);cv.height=Math.round(h);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',q));
      };
      img.onerror=()=>rej(new Error('Bad image'));
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let chatTimer=null, chatTyping=0;
async function renderChat(b){
  const z=$('#chatZone'); if(!z){if(chatTimer){clearInterval(chatTimer);chatTimer=null;}return;}
  if(!b.cleanerId){z.innerHTML='';if(chatTimer){clearInterval(chatTimer);chatTimer=null;}return;}
  const isCleaner=state.user.role==='cleaner';
  const other=isCleaner?'клиентом':(b.cleaner?b.cleaner.name:'исполнителем');
  // Chat closes for participants once the order is completed/cancelled (admins keep it).
  const closed=['completed','cancelled'].includes(b.status) && state.user.role!=='admin';
  z.innerHTML=`<div class="card" style="overflow:hidden"><div class="chat">
    <div class="chat-head"><b>Чат с ${esc(other)}</b>${closed?'<span class="tiny muted">чат закрыт · заказ завершён</span>':'<span class="tiny muted">по заказу</span>'}</div>
    <div id="locBar"></div>
    <div class="msgs" id="msgs"></div>
    ${closed
      ? `<div class="chat-closed">${I.lock} Чат закрыт — заказ завершён. Переписка доступна только во время заказа.</div>`
      : `<div class="chatbar">
      <div class="attach" id="chatAttach" title="Фото">${I.cam}</div>
      <input class="input" id="chatInput" placeholder="Сообщение…" style="border-radius:12px">
      <button class="btn sm" id="chatSend">${I.send}</button>
    </div>`}
  </div></div>`;
  await loadMessages(b.id);
  if(closed){ if(chatTimer){clearInterval(chatTimer);chatTimer=null;} return; }
  const input=$('#chatInput',z), sendBtn=$('#chatSend',z);
  const doSend=async()=>{
    const text=input.value.trim();if(!text)return;
    try{await api('/api/bookings/'+b.id+'/messages','POST',{text});input.value='';await loadMessages(b.id);}
    catch(e){toast(e.message,true);}   // keep text in the box if blocked/failed
  };
  sendBtn.onclick=doSend;
  input.onkeydown=(e)=>{if(e.key==='Enter')doSend();};
  // On mobile the chat sits at the bottom of a tall order card — keep the input
  // reachable when the on-screen keyboard opens.
  input.addEventListener('focus',()=>setTimeout(()=>input.scrollIntoView({block:'center',behavior:'smooth'}),250));
  // §8 typing ping — throttled to once per 3s while composing.
  input.oninput=()=>{const t=Date.now();if(t-chatTyping>3000){chatTyping=t;api('/api/bookings/'+b.id+'/typing','POST').catch(()=>{});}};
  // §9 image attachment.
  $('#chatAttach',z).onclick=()=>sendChatImage(b.id);
  // §14 short-poll for realtime updates while the chat is open.
  if(chatTimer)clearInterval(chatTimer);
  chatTimer=setInterval(()=>{ if($('#msgs')){loadMessages(b.id);} else {clearInterval(chatTimer);chatTimer=null;} },4000);
}
function sendChatImage(id){
  const inp=el('<input type="file" accept="image/*" style="display:none">');document.body.appendChild(inp);
  inp.onchange=async()=>{const f=inp.files[0];if(!f){inp.remove();return;}
    try{const dataUrl=await downscale(f,800,0.7);await api('/api/bookings/'+id+'/messages','POST',{type:'image',attachments:[dataUrl]});await loadMessages(id);}
    catch(e){toast(e.message||'Не удалось',true);}

}
const TICK={sent:'✓',delivered:'✓✓',read:'✓✓'};
async function loadMessages(id){
  const box=$('#msgs'); if(!box)return;
  try{
    const {messages,typing,location}=await api('/api/bookings/'+id+'/messages');
    // §13 live provider location bar (customer view during active booking).
    const lb=$('#locBar');
    if(lb)lb.innerHTML=location?`<div class="locbar">${I.pin}<span>Исполнитель в пути</span><span class="eta">~${location.etaMinutes} мин</span></div>`:'';
    box.innerHTML=messages.map(m=>{
      if(m.from==='system'||m.type==='system')return `<div class="msg sys">${esc(m.text)}</div>`;
      const me=m.from===state.user.id;
      const img=(m.type==='image'&&m.attachments&&m.attachments[0])?`<img src="${m.attachments[0]}">`:'';
      const body=m.text?esc(m.text):'';
      // §7 delivery ticks on my own outgoing messages.
      const tick=me&&m.delivery?`<span class="tick ${m.delivery==='read'?'read':''}">${TICK[m.delivery]||''}</span>`:'';
      // §11 translation (never overwrites original) — offered on the other party's messages.
      const tr=m.translatedBody?`<div class="tr">${esc(m.translatedBody)}</div>`:'';
      const trBtn=(!me&&m.text&&!m.translatedBody)?`<span class="trbtn" data-tr="${m.id}">Перевести</span>`:'';
      return `<div class="msg ${me?'me':'them'}">${me?'':`<div class="who">${esc(m.name)}</div>`}${body}${img}${tick}${tr}${trBtn}</div>`;
    }).join('') + ((typing&&typing.length)?`<div class="typing">${esc(typing[0].name)} печатает<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`:'');
    box.scrollTop=box.scrollHeight;
    box.querySelectorAll('.trbtn').forEach(btn=>btn.onclick=async()=>{
      try{await api('/api/bookings/'+id+'/messages/'+btn.dataset.tr+'/translate','POST',{target:'en'});await loadMessages(id);}catch(e){toast(e.message,true);}
    });
    // §7 mark read once I've viewed the thread.
    api('/api/bookings/'+id+'/messages/read','POST').catch(()=>{});
    loadNotifBadge&&loadNotifBadge();
  }catch{}
}

async function loadAdminFlags(){
  const z=$('#flagsBody'); if(!z)return;
  try{
    const {flags}=await api('/api/admin/flags');
    const byPhase={};
    flags.forEach(f=>{(byPhase[f.phase]=byPhase[f.phase]||[]).push(f);});
    z.innerHTML=`<div class="card pad">${Object.keys(byPhase).sort().map(ph=>`
      <div style="margin-bottom:14px"><div class="tiny muted" style="font-weight:700;margin-bottom:8px">Фаза ${ph}</div>
      ${byPhase[ph].map(f=>`<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:14px">${f.label} ${f.enabled?'<span class="badge green" style="margin-left:6px">вкл</span>':'<span class="badge grey" style="margin-left:6px">выкл</span>'}</span>
        <button class="btn ghost sm" data-flag="${f.key}" data-on="${f.enabled?1:0}">${f.enabled?'Выключить':'Включить'}</button>
      </div>`).join('')}</div>`).join('')}</div>`;
    z.querySelectorAll('[data-flag]').forEach(btn=>btn.onclick=async()=>{
      try{await api('/api/admin/flags/'+btn.dataset.flag,'PATCH',{enabled:btn.dataset.on!=='1'});
        toast('Флаг обновлён');loadAdminFlags();
      }catch(e){toast(e.message,true);}
    });
  }catch(e){z.innerHTML='';}
}
function metricRow(label,val){return `<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted tiny">${label}</span><b>${val}</b></div>`;}
function funnelHtml(funnel){
  const max=Math.max(1,...funnel.map(f=>f.count));
  return funnel.map(f=>`<div style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${f.stage}</span><b>${f.count}</b></div>
    <div style="height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden"><div style="height:100%;width:${Math.round(f.count/max*100)}%;background:linear-gradient(90deg,var(--primary),var(--primary-600))"></div></div>
  </div>`).join('');
}

/* ---------- Shared UI ---------- */
function emptyState(title,sub){return el(`<div class="empty">${I.jobs}<h3 style="color:var(--ink-2)">${title}</h3><p class="tiny">${sub}</p></div>`);}
let modalEl=null;
function showModal(html,wide){const n=el(`<div class="modal ${wide?'':''}" style="${wide?'max-width:560px':''}">${html}</div>`);showModalNode(n);}
function showModalNode(node){
  closeModal();
  const bg=el(`<div class="modal-bg"></div>`);
  bg.appendChild(node);
  bg.onclick=(e)=>{if(e.target===bg)closeModal();};
  document.body.appendChild(bg);
  modalEl=bg;
  requestAnimationFrame(()=>bg.classList.add('show'));
}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- Boot ---------- */
async function boot(){
  initTheme();
  // Social sign-in hands the session token back via the URL fragment.
  if(location.hash.startsWith('#token=')){
    const tk=decodeURIComponent(location.hash.slice(7));
    if(tk){ state.token=tk; localStorage.setItem('cg_token',tk); }
    try{history.replaceState({},'',location.pathname);}catch{}
  }
  const _authErr=(new URLSearchParams(location.search)).get('autherror');
  if(_authErr){ try{history.replaceState({},'',location.pathname);}catch{} }
  await loadCatalog();   // cities/categories are public — needed for the signup form too
  // A password-reset link must always land on the reset form, even if a stale
  // session token is present — drop it so renderAuth() shows the reset flow.
  if((new URLSearchParams(location.search)).has('reset')){ state.token=null; state.user=null; }
  if(state.token){
    try{
      const {user}=await api('/api/me');
      state.user=user;
      state.view=user.role==='admin'?'admin':user.role==='cleaner'?'jobs':user.role==='company'?'company':'home';
      if(user.role==='customer') await loadProperties();
    }catch{ state.token=null;localStorage.removeItem('cg_token'); }
  }
  render();
  i18nStart();   // translate the mounted DOM into the active language + keep watching
  if(_authErr){ toast(t(_authErr==='email'?'Не удалось получить подтверждённый email от провайдера.':_authErr==='suspended'?'Этот аккаунт заблокирован.':'Не удалось выполнить вход через провайдера. Попробуйте ещё раз.'),true); }
}
boot();
