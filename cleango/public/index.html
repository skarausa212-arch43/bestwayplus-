/* Design tokens — exact values from 09_UI_DESIGN_SYSTEM.md (single source in design/tokens.css). */
:root{
  /* colour — light theme · official LUMI brand palette (brand guidelines) */
  --primary:#22C55E; --primary-600:#059669; --primary-050:#E7F9EF;   /* #22C55E / #059669 */
  --accent:#059669; --accent-600:#047857; --accent-050:#DCF3E8;      /* emerald counterpoint */
  --success:#059669; --info:#3B82F6;
  --ink:#0F172A; --ink-2:#64748B; --ink-3:#94A3B8;                   /* navy + slate scale */
  --bg:#F7FAF9; --surface:#FFFFFF; --surface-2:#F3F4F6;              /* #F3F4F6 neutral */
  --line:#E6EBEA; --line-strong:#D4DDDA;
  --danger:#E5484D; --warn:#F2A93B; --star:#FFB020;
  --flash:#10B981;                                   /* FlashClean emerald */
  --grad-hero:linear-gradient(135deg,#34D77F 0%,#22C55E 45%,#059669 100%); /* brand green */
  --grad-accent:linear-gradient(120deg,#059669,#22C55E);
  --glow:34,197,94;                                  /* primary rgb for glows */
  /* radii (§9) */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-xxl:28px;
  --radius:16px; --radius-sm:12px; --radius-lg:28px;
  /* elevation (§10) */
  --shadow:0 2px 8px rgba(17,22,19,.06);
  --shadow-lg:0 16px 40px rgba(17,22,19,.14);
  /* motion (§39) */
  --dur-fast:120ms; --dur-std:220ms; --dur-slow:360ms; --dur-hero:480ms;
  --ease:cubic-bezier(.2,.7,.3,1);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sp:8px;
}
:root[data-theme="dark"]{
  --primary:#34D77F; --primary-600:#22C55E; --primary-050:#0C2A1B;
  --accent:#22C55E; --accent-600:#059669; --accent-050:#0B2A1D;
  --success:#34D77F; --info:#60A5FA;
  --ink:#E8EEF4; --ink-2:#93A2B4; --ink-3:#64748B;
  --bg:#0B1220; --surface:#131C2B; --surface-2:#0F1826;             /* navy #0F172A family */
  --line:#233042; --line-strong:#33465C;
  --danger:#F06A6E; --warn:#F5B94C;
  --glow:52,215,127;
  /* dark uses tonal elevation + borders more than shadows (§10) */
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.4);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- App shell ---------- */
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:saturate(180%) blur(20px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:12px 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand .logo{width:34px;height:34px;flex:none}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{
  padding:8px 14px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:14.5px;
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--primary);color:#fff}
.nav button.active svg{color:#fff}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2)}
.iconbtn:hover{color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.main{flex:1;padding:24px 20px 80px}

/* ---------- Bottom nav (mobile) ---------- */
.tabbar{display:none}
@media(max-width:760px){
  .nav{display:none}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;
  }
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;padding:4px}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.active{color:var(--primary)}
  .main{padding:16px 14px 96px}
  .topbar{padding:12px 14px}
}

/* ---------- Cards & primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.hint{color:var(--ink-3);font-size:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;font-weight:700;font-size:15.5px;
  padding:14px 20px;border-radius:14px;transition:.15s;box-shadow:0 6px 18px rgba(var(--glow),.32);
}
.btn:hover{background:var(--primary-600);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger);box-shadow:0 6px 18px rgba(240,68,56,.28)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge svg{width:14px;height:14px;flex:none}
.badge.green{background:var(--primary-050);color:var(--primary-600)}
.badge.blue{background:#E8F0FE;color:#1A73E8}
.badge.amber{background:#FEF3E2;color:#B25E09}
.badge.grey{background:var(--surface-2);color:var(--ink-2)}
.badge.red{background:#FEECEB;color:#C4342A}
:root[data-theme="dark"] .badge.blue{background:#12233F;color:#7DA9F5}
:root[data-theme="dark"] .badge.amber{background:#2E2410;color:#E9A94B}
:root[data-theme="dark"] .badge.red{background:#2E1512;color:#F08A82}
label.field{display:block;margin-bottom:14px}
label.field span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input,select.input,textarea.input{
  width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface);transition:.15s;outline:none;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-050)}
textarea.input{resize:vertical;min-height:80px}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--primary-050),transparent),var(--bg)}
.auth{width:100%;max-width:420px}
.auth .card{padding:28px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Hero / home ---------- */
.hero{
  border-radius:var(--radius-lg);padding:32px;color:#fff;position:relative;overflow:hidden;
  background:var(--grad-hero);
  box-shadow:0 24px 60px rgba(var(--glow),.34);
}
.hero h1{font-size:30px;line-height:1.1;max-width:520px}
.hero p{opacity:.92;margin-top:10px;max-width:460px;font-size:15px}
.hero .sparkle{position:absolute;right:-30px;top:-30px;width:220px;height:220px;opacity:.28}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.svc{padding:18px;cursor:pointer;transition:.15s;border:1.5px solid var(--line)}
.svc:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.svc .ico{width:46px;height:46px;border-radius:13px;background:var(--primary-050);display:grid;place-items:center;color:var(--primary-600);margin-bottom:12px}
.svc h4{font-size:15.5px}
.svc .from{color:var(--ink-3);font-size:13px;margin-top:3px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;letter-spacing:-.03em}

/* ---------- Booking wizard ---------- */
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps .s{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps .s.done{background:var(--primary)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.opt{padding:16px;border:1.5px solid var(--line);border-radius:15px;cursor:pointer;transition:.15s;text-align:center}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-050)}
.opt .ico{width:40px;height:40px;margin:0 auto 8px;color:var(--primary-600)}
.opt h4{font-size:14.5px}
.opt small{color:var(--ink-3)}
.stepper{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:13px;padding:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface);font-size:22px;font-weight:600;box-shadow:var(--shadow);display:grid;place-items:center}
.stepper b{flex:1;text-align:center;font-size:18px}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.extra{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s;font-size:14px;font-weight:600}
.extra.sel{border-color:var(--primary);background:var(--primary-050)}
.extra .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.extra.sel .cb{background:var(--primary);border-color:var(--primary);color:#fff}
/* à-la-carte extras (booking step 1) */
.ex-top{margin-bottom:14px}
.ex-total{position:sticky;top:8px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(135deg,#0F2A20,#0B3A32);color:#fff;border-radius:16px;padding:14px 18px;margin-bottom:18px;
  box-shadow:0 14px 30px -16px rgba(var(--glow),.6)}
.ex-total .muted{color:rgba(255,255,255,.65)!important}
.ex-total-v{font-size:24px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.ex-time{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.82);text-align:right}
.ex-time svg{width:15px;height:15px}
.ex-cat{margin-bottom:14px}
.ex-cat-h{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:6px 2px 8px}
.ex-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
.ex-cat .ex-row:last-child{border-bottom:none}
.ex-info{width:24px;height:24px;flex:none;border-radius:50%;background:var(--surface-2);color:var(--ink-3);font-weight:800;font-size:13px;display:grid;place-items:center}
.ex-info:hover{background:var(--primary-050);color:var(--primary-600)}
.ex-name{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.3}
.ex-desc{max-height:0;overflow:hidden;opacity:0;transition:max-height .25s,opacity .2s,margin .2s;font-size:12.5px;font-weight:500;color:var(--ink-2);line-height:1.45}
.ex-row.open .ex-desc{max-height:80px;opacity:1;margin-top:5px}
.ex-ctrl{flex:none}
.ex-pill{display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 16px;border-radius:11px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;box-shadow:0 6px 14px -6px rgba(var(--glow),.6);transition:transform .12s,filter .12s}
.ex-pill:hover{transform:translateY(-1px)}
.ex-pill.on{background:var(--primary-600)}
.ex-pill svg{width:15px;height:15px}
.ex-row.sel .ex-name{color:var(--primary-600)}
.ex-step{display:flex;align-items:center;gap:2px;background:var(--primary-050);border-radius:12px;padding:4px}
.ex-step button{width:34px;height:34px;border-radius:9px;background:var(--surface);color:var(--primary-600);font-size:20px;font-weight:700;box-shadow:var(--shadow);display:grid;place-items:center}
.ex-step b{min-width:44px;text-align:center;font-size:15px;font-weight:800;color:var(--primary-600);display:inline-flex;gap:3px;align-items:baseline;justify-content:center}
.ex-step b span{font-size:11px;font-weight:600;opacity:.8}

/* estimate */
.est{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1.5px solid var(--line)}
.est .big{font-size:40px;font-weight:800;letter-spacing:-.03em}
.est .rng{color:var(--ink-3);font-size:13.5px}
.brk{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.brk span:first-child{color:var(--ink-2)}
.aiband{display:flex;gap:10px;align-items:center;background:var(--primary-050);border-radius:13px;padding:12px 14px;color:var(--primary-600);font-weight:600;font-size:13.5px}
/* Default size for inline icons rendered as raw SVG inside text/controls */
.btn svg,.chip svg,.badge svg,.aiband svg,.section-title svg,.bk .muted svg,.hero .badge svg,.est svg{width:17px;height:17px;flex:none}
.aiband svg{width:20px;height:20px}
.modal .row svg,.est svg,.stat b svg{width:17px;height:17px;flex:none}
/* Trailing chevrons that sit as direct flex children (would otherwise stretch) */
.bk > svg{width:22px;height:22px;flex:none;color:var(--ink-3)}
.card.pad > svg{width:22px;height:22px;flex:none}

/* ---------- Booking list & detail ---------- */
.bk{padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
.bk:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.bk .thumb{width:52px;height:52px;border-radius:14px;background:var(--primary-050);display:grid;place-items:center;color:var(--primary-600);flex:none}
.bk .meta{flex:1;min-width:0}
.bk .meta h4{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .price{text-align:right;font-weight:800;font-size:16px}
.timeline{position:relative;padding-left:26px}
.timeline .ev{position:relative;padding-bottom:18px}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-050)}
.timeline .ev::after{content:"";position:absolute;left:-17px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.timeline .ev:last-child::after{display:none}
.timeline .ev.pending::before{background:var(--line);box-shadow:0 0 0 4px var(--surface-2)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.uploadbox{border:2px dashed var(--line);border-radius:15px;padding:20px;text-align:center;cursor:pointer;transition:.15s;color:var(--ink-2)}
.uploadbox:hover{border-color:var(--primary);color:var(--primary-600)}

/* chat */
.chat{display:flex;flex-direction:column;height:420px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-3);font-size:12.5px;font-weight:600}
.msg .who{font-size:11px;opacity:.7;margin-bottom:2px;font-weight:700}
.msg img{display:block;max-width:200px;border-radius:10px;margin-top:2px}
.msg .tick{font-size:11px;opacity:.85;margin-left:6px;font-weight:700;letter-spacing:-1px}
.msg .tick.read{color:#7cc0ff}
.msg .tr{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:13px;opacity:.9}
.msg .trbtn{font-size:11px;font-weight:700;color:var(--primary-600);cursor:pointer;margin-top:4px;display:inline-block}
.msg.me .trbtn{color:rgba(255,255,255,.9)}
.typing{align-self:flex-start;font-size:12.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:5px;padding:2px 4px}
.typing .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:tblink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes tblink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.locbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--primary-050);color:var(--primary-600);font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line)}
.locbar .eta{margin-left:auto;background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px}
.chat-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.chat-head b{font-size:14px}
.chat-closed{display:flex;align-items:center;gap:8px;padding:14px;border-top:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);font-size:13px;font-weight:600}
.chat-closed svg{width:16px;height:16px;flex:none}
/* «Решить проблему» issue cards + category chips */
.issue-card{border:1.5px solid var(--warn)}
.issue-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.issue-ic.amber{background:#FEF3E2;color:#B25E09}
.issue-ic svg{width:19px;height:19px}
.issue-cats{display:flex;flex-wrap:wrap;gap:8px}
.issue-cats .chip{cursor:pointer;border:1.5px solid var(--line);background:var(--surface)}
.issue-cats .chip.sel{border-color:var(--primary);background:var(--primary-050);color:var(--primary-600)}
/* receipt / чек */
.rc{max-width:420px;margin:0 auto}
.rc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.rc-brand{display:flex;align-items:center;gap:8px;font-weight:850;font-size:18px}
.rc-brand svg.logo{width:30px;height:30px}
.rc-no{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.03em}
.rc-title{font-size:20px;font-weight:850;letter-spacing:-.02em;margin-bottom:8px}
.rc-meta>div{line-height:1.5}
.rc-meta>div:first-child{font-weight:700;font-size:15px}
.rc-sep{height:0;border-top:1.5px dashed var(--line-strong);margin:12px 0}
.rc-items .rc-line:first-child span{font-weight:700;color:var(--ink)}
.rc-line{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:14px;color:var(--ink-2)}
.rc-line span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-strong{font-size:20px;font-weight:850;color:var(--primary-600)}
.rc-note{display:flex;gap:7px;align-items:flex-start;margin-top:14px;font-size:11.5px;line-height:1.45;color:var(--ink-3);background:var(--surface-2);padding:10px 12px;border-radius:10px}
.rc-note svg{width:14px;height:14px;flex:none;margin-top:1px}
.rc-foot{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:14px}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatbar .attach{display:grid;place-items:center;width:40px;flex:none;background:var(--surface-2);border-radius:12px;cursor:pointer}

/* stars */
.stars{display:inline-flex;gap:3px;color:var(--star)}
.stars svg{width:18px;height:18px}
.starpick span{display:inline-grid;place-items:center}
.starpick svg{width:28px;height:28px;cursor:pointer;color:var(--line);flex:none}
.starpick span.on svg{color:var(--star)}

/* admin table */
.urole-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.urole{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}
.urole:hover{border-color:var(--ink-3)}
.urole span{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);font-size:12px;font-weight:800}
.urole.active{background:var(--primary-600);border-color:var(--primary-600);color:#fff}
.urole.active span{background:rgba(255,255,255,.24);color:#fff}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.kpi b{font-size:28px;letter-spacing:-.03em;display:block}
.kpi .lab{color:var(--ink-2);font-size:13px;margin-top:2px}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);z-index:200;
  background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-weight:600;font-size:14px;
  box-shadow:var(--shadow-lg);transition:.35s cubic-bezier(.2,.9,.3,1);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#fff}
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(11,18,32,.5);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:460px;transform:translateY(20px) scale(.98);transition:.2s}
.modal-bg.show .modal{transform:none}

.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty svg{width:60px;height:60px;margin-bottom:14px;opacity:.5}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fadein{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-size:20px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 rgba(var(--glow),.55);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(var(--glow),0)}100%{box-shadow:0 0 0 0 rgba(var(--glow),0)}}

/* ===================== ANIMATIONS & BRAND ===================== */
:root{--gold:#E9C46A;--gold-2:#C9A24B;--gold-3:#B8862F;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* staggered entrance for lists/cards */
.reveal{opacity:0;animation:revealUp .55s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes revealUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.view-enter{animation:viewIn .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* animated brand hero */
.hero{background-size:180% 180%;animation:heroShift 12s ease infinite}
@keyframes heroShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero .sparkle{animation:floatY 6s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
.hero h1{animation:revealUp .6s both}
.hero p{animation:revealUp .6s .08s both}
.hero .btn,.hero .badge{animation:revealUp .6s .16s both}
.logo{filter:drop-shadow(0 2px 8px rgba(20,200,113,.4))}
.brand .logo{animation:logoPop .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes logoPop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.logo .spk{transform-origin:center;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.75;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}

/* buttons: shine + press */
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:none}
.btn:hover::after{animation:shine .8s ease}
@keyframes shine{to{transform:translateX(120%)}}
.btn:active{transform:scale(.97)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}

/* cards hover pop already exist; add sheen on service cards */
.svc{transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s}
.svc .ico{transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.svc:hover .ico{transform:translateY(-2px) scale(1.08) rotate(-4deg)}
.bk,.opt,.extra{transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s,border-color .16s,background .16s}
.opt.sel{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.extra.sel .cb{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.badge.green,.chip{transition:transform .15s}
.tabbar button.active svg{animation:tabPop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tabPop{0%{transform:scale(.8) translateY(2px)}100%{transform:none}}

/* score ring draw */
.score-ring{position:relative}
.score-ring .ring-num{animation:revealUp .5s .2s both}

/* status dots (in progress) */
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:dotb 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

/* modal spring */
.modal-bg.show .modal{animation:modalIn .32s cubic-bezier(.2,1.2,.35,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}

/* toast */
.toast{animation:none}
.toast.show{animation:toastIn .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes toastIn{from{transform:translateX(-50%) translateY(120px)}to{transform:translateX(-50%) translateY(0)}}

/* colorful service icons (brand icon set) */
.svc .ico.c-cleaning{background:linear-gradient(135deg,#D8F6E7,#BEEFD5);color:#0EA85E}
.svc .ico.c-windows{background:linear-gradient(135deg,#E1EEFF,#CFE2FF);color:#2C7BE5}
.svc .ico.c-sofa{background:linear-gradient(135deg,#FFE3F1,#FCD3E8);color:#DB4C9B}
.svc .ico.c-laundry{background:linear-gradient(135deg,#DDF7F0,#C7F0E6);color:#12B5A0}
.svc .ico.c-ironing{background:linear-gradient(135deg,#FFEDD9,#FFDFBF);color:#E7822B}
.svc .ico.c-plumbing{background:linear-gradient(135deg,#DBF3FF,#C4EBFF);color:#1AA5D8}
.svc .ico.c-electrical{background:linear-gradient(135deg,#FFF4D6,#FFE9AE);color:#D9A400}
.svc .ico.c-assembly{background:linear-gradient(135deg,#ECE6FF,#DCD1FF);color:#7A5AF0}
.svc .ico.c-garden{background:linear-gradient(135deg,#E4F7D9,#D0F0BE);color:#4F9E2E}
.svc .ico.c-painting{background:linear-gradient(135deg,#EBE1FF,#E7D6FF);color:#8A50E0}
:root[data-theme="dark"] .svc .ico{filter:saturate(1.1) brightness(1.05)}

/* notifications */
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;cursor:pointer;transition:background .15s}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:var(--primary-050)}
.notif .ni{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.notif .ni.operational{background:var(--primary-050);color:var(--primary-600)}
.notif .ni.account{background:#E8F0FE;color:#1A73E8}
.notif .ni.smart_home{background:#F0EAFF;color:#7A5AF0}
.notif .ni.marketing{background:#FEF3E2;color:#B25E09}
.notif .ni svg{width:19px;height:19px}

/* ═══════════════ GLOW-UP · coral × turquoise redesign ═══════════════ */
/* selection + scrollbar */
::selection{background:rgba(var(--glow),.22)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--primary),var(--accent));border-radius:8px}

/* ambient aurora behind the whole app */
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:0;pointer-events:none;
  background:radial-gradient(50% 60% at 18% 0%,rgba(20,200,113,.15),transparent 70%),
             radial-gradient(45% 55% at 92% 8%,rgba(14,168,142,.15),transparent 70%);
  filter:blur(8px);animation:aurora 18s ease-in-out infinite alternate}
@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(2%,1.5%,0) scale(1.08)}100%{transform:translate3d(-2%,0.5%,0) scale(1.04)}}
.app{position:relative;z-index:1}

/* gradient buttons + richer shine */
.btn{background:linear-gradient(120deg,#18D07A,#0EA85E);box-shadow:0 10px 24px -6px rgba(var(--glow),.55),0 2px 6px rgba(var(--glow),.3)}
.btn:hover{background:linear-gradient(120deg,#14C871,#0EA85E);transform:translateY(-2px);box-shadow:0 16px 30px -8px rgba(var(--glow),.62)}
.btn.ghost{background:var(--surface-2);box-shadow:none}
.btn.ghost:hover{background:var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(120deg,#F4595E,#E5484D)}

/* gradient nav pill + tab accent */
.nav button.active{background:linear-gradient(120deg,#0EA85E,#14C871);box-shadow:0 8px 18px -6px rgba(var(--glow),.6);animation:pillPop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pillPop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.nav button:not(.active):hover{transform:translateY(-1px)}
.tabbar button.active{color:var(--primary)}

/* gradient avatar + icon buttons */
.avatar{background:linear-gradient(135deg,#2FE08C,#0EA85E);box-shadow:0 6px 16px -4px rgba(var(--glow),.5)}
.iconbtn{transition:transform .16s,background .16s,color .16s}
.iconbtn:hover{transform:translateY(-2px) rotate(-6deg);background:var(--primary-050);color:var(--primary-600)}

/* turquoise = success / positive throughout */
.badge.green{background:var(--accent-050);color:var(--accent-600)}
.pulse{background:var(--accent);box-shadow:0 0 0 0 rgba(18,196,190,.55);animation:pulse2 1.6s infinite}
@keyframes pulse2{70%{box-shadow:0 0 0 12px rgba(18,196,190,0)}100%{box-shadow:0 0 0 0 rgba(18,196,190,0)}}
.notif .ni.operational{background:var(--accent-050);color:var(--accent-600)}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-050)}

/* interactive cards: lift + colored glow + top sheen */
.card{transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .25s,border-color .2s}
.svc,.bk,.opt,.extra,.card.svc{position:relative;overflow:hidden}
.svc:hover,.card.bk:hover{border-color:transparent;transform:translateY(-5px);box-shadow:0 22px 44px -18px rgba(var(--glow),.5),0 0 0 1.5px rgba(var(--glow),.35)}
.svc::before,.bk::before{content:"";position:absolute;top:0;left:-60%;width:55%;height:100%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-18deg);opacity:0;transition:opacity .2s}
.svc:hover::before{opacity:1;animation:sweep .7s ease}
@keyframes sweep{from{left:-60%}to{left:130%}}
.svc .ico{box-shadow:0 6px 14px -6px rgba(0,0,0,.15)}

/* gradient text + hero flourishes */
.grad-text{background:linear-gradient(100deg,#0EA85E,#12C4BE);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero{box-shadow:0 28px 66px -22px rgba(var(--glow),.5)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,214,206,.55),transparent 70%);filter:blur(6px);animation:floatY 8s ease-in-out infinite reverse}
.hero .stat b{font-variant-numeric:tabular-nums}

/* stat numbers pop in with gradient */
.section-title{position:relative}
.section-title::after{content:"";flex:1;height:2px;border-radius:2px;margin-left:6px;
  background:linear-gradient(90deg,var(--line),transparent);opacity:.8}

/* segmented control slide */
.seg button.active{box-shadow:0 4px 12px -4px rgba(var(--glow),.4)}
.opt.sel,.extra.sel{border-color:var(--primary);background:var(--primary-050);box-shadow:0 8px 20px -10px rgba(var(--glow),.5)}
.opt.sel .ico{color:var(--primary-600)}

/* chips get a hover tint */
.chip{transition:transform .15s,background .15s,color .15s}
.chip:hover{background:var(--primary-050);color:var(--primary-600);transform:translateY(-1px)}

/* FlashClean badge glows turquoise-electric */
.badge.flash,.hero .badge{backdrop-filter:blur(4px)}

/* skeleton shimmer */
.sk{background:linear-gradient(90deg,var(--surface-2),#eefaf3,var(--surface-2));background-size:200% 100%}
:root[data-theme="dark"] .sk{background:linear-gradient(90deg,var(--surface-2),#1b2a22,var(--surface-2));background-size:200% 100%}

/* dark-mode success/operational tints */

/* ═══════════ HOME CONSOLE HERO (generative aurora) ═══════════ */
.hero.console{background:linear-gradient(140deg,#13201F 0%,#0C2E31 55%,#12201A 100%);
  animation:none;background-size:auto;min-height:280px;padding:34px 38px;
  display:flex;align-items:center;gap:24px;color:#fff;
  box-shadow:0 30px 70px -26px rgba(var(--glow),.5)}
.hero.console::before{display:none}
.hero-fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.92}
.hero-veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(102deg,rgba(6,12,13,.82) 0%,rgba(6,12,13,.5) 40%,rgba(6,12,13,.05) 72%,transparent 100%),
             radial-gradient(120% 90% at 100% 0%,transparent 55%,rgba(6,12,13,.35))}
.hero-body{position:relative;z-index:2;flex:1;min-width:0}
.hero-eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.02em;
  color:rgba(255,255,255,.82);margin-bottom:14px;font-variant-numeric:tabular-nums}
.hero-eyebrow .dim{color:rgba(255,255,255,.5)}
.hero-eyebrow .live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 0 rgba(47,214,206,.6);animation:pulse2 1.8s infinite}
.hero-h1{font-size:38px;line-height:1.03;letter-spacing:-.03em;font-weight:850;text-wrap:balance;margin:0}
.hero-h1 .grad-text{background:linear-gradient(100deg,#37E59A,#14C871 40%,#3FDCC9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-status{margin-top:12px;font-size:16px;color:rgba(255,255,255,.78);font-weight:500}
.hero-chips{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.gpill{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;
  color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);
  transition:transform .16s cubic-bezier(.2,.8,.3,1),background .16s,box-shadow .16s}
.gpill svg{width:17px;height:17px}
.gpill:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}
.gpill.hot{background:linear-gradient(120deg,#18D07A,#0EA85E);border-color:transparent;box-shadow:0 10px 24px -8px rgba(var(--glow),.7)}
.gpill.hot:hover{box-shadow:0 16px 30px -8px rgba(var(--glow),.8)}
/* right-side living orb */
.hero-orb{position:relative;z-index:2;width:186px;height:186px;flex:none;display:grid;place-items:center}
.hero-orb .orb-ring,.hero-orb .orb-conic{position:absolute;border-radius:50%;inset:0;margin:auto}
.orb-ring{border:1.5px solid rgba(255,255,255,.14)}
.orb-ring.r1{width:186px;height:186px;animation:orbPulse 3.4s ease-in-out infinite}
.orb-ring.r2{width:132px;height:132px;border-color:rgba(63,220,201,.4);animation:orbPulse 3.4s ease-in-out infinite .7s}
.orb-conic{width:170px;height:170px;border:none;
  background:conic-gradient(from 0deg,transparent,rgba(20,200,113,.9),rgba(47,214,206,.9),transparent 65%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:orbSpin 7s linear infinite}
.orb-core{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(120% 120% at 30% 25%,rgba(255,255,255,.16),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);box-shadow:inset 0 0 22px rgba(47,214,206,.25)}
.orb-core svg{width:44px;height:44px;color:#fff;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.orb-tag{position:absolute;bottom:-6px;right:-4px;background:rgba(10,16,17,.72);border:1px solid rgba(255,255,255,.16);
  border-radius:12px;padding:6px 11px;display:flex;flex-direction:column;line-height:1;backdrop-filter:blur(8px)}
.orb-tag b{font-size:18px;font-weight:850}.orb-tag{font-size:11px;color:rgba(255,255,255,.65);font-weight:600}
@keyframes orbPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:.5}}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@media(max-width:760px){
  .hero.console{flex-direction:column;align-items:flex-start;padding:26px 22px;min-height:0}
  .hero-h1{font-size:30px}
  .hero-orb{display:none}
}

/* ═══════════════ AUTH · premium split screen ═══════════════ */
.auth-split{min-height:100vh;display:grid;grid-template-columns:1.02fr .98fr}
.auth-brand{position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;padding:56px min(6vw,72px);

#authFX{position:absolute;inset:0;width:100%;height:100%;opacity:.92;z-index:0}
.auth-brand-veil{position:absolute;inset:0;z-index:1;pointer-events:none;

.auth-lede{margin-top:18px;font-size:17px;line-height:1.55;color:rgba(255,255,255,.8);max-width:40ch}
.auth-feats{margin-top:28px;display:flex;flex-direction:column;gap:13px}
.auth-feats div{display:flex;align-items:center;gap:12px;font-size:15.5px;font-weight:600;color:rgba(255,255,255,.94)}
.auth-feats .fk{width:26px;height:26px;border-radius:9px;background:rgba(47,214,206,.22);color:#67e9e0;display:grid;place-items:center;flex:none}
.auth-feats .fk svg{width:15px;height:15px}
.auth-cities{margin-top:34px;font-size:12.5px;letter-spacing:.08em;color:rgba(255,255,255,.5)}
/* form side */
.auth-form-side{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:var(--bg);position:relative}
.auth-theme{position:absolute;top:22px;right:22px}
.auth-topctl{position:absolute;top:22px;right:22px;display:flex;gap:8px;align-items:center;z-index:6}
.auth-topctl .auth-theme{position:static;top:auto;right:auto}
.auth-card{width:100%;max-width:396px}
.auth-mobilemark{display:none}
.auth-head{margin-bottom:20px}
.auth-head h2{font-size:27px;letter-spacing:-.02em}
.auth-head p{margin-top:5px;font-size:14.5px}
.auth-card .seg{margin-bottom:20px}
.auth-legal{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.auth-legal a{color:var(--ink-3);font-size:12.5px;font-weight:600}
.auth-legal a:hover{color:var(--primary-600)}
/* cleaner KYC block on the signup form */
.kyc-block{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;background:var(--surface-2)}
.kyc-title{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.kyc-uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kyc-up{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1.5px dashed var(--line-strong);border-radius:13px;background:var(--surface);transition:.15s;text-align:center}
.kyc-up:hover{border-color:var(--primary);background:var(--primary-050)}
.kyc-up span{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.2}
.kyc-up-ic{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3);background-size:cover;background-position:center}
.kyc-up-ic.has{color:#fff;box-shadow:0 0 0 2px var(--primary)}
.kyc-up-ic.has svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.kyc-up-ic svg{width:22px;height:22px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.chk input{width:19px;height:19px;accent-color:var(--primary);flex:none}
.equip-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.equip-list .chip{background:var(--primary-050);color:var(--primary-600);cursor:default}
.kyc-hint{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.4;color:var(--ink-3);margin-top:4px}
.kyc-hint svg{width:14px;height:14px;flex:none;margin-top:1px}
/* admin profile modal sections */
.admin-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.admin-sec-h{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.admin-doc{width:100%;max-height:360px;object-fit:contain;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
/* booking date & time picker */
.sched{margin-bottom:16px}
.sched input[type=date]{cursor:pointer}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:700;color:var(--ink);transition:.14s}
.slot:hover:not(.off){border-color:var(--primary);color:var(--primary-600)}
.slot.sel{border-color:var(--primary);background:var(--primary);color:#fff;box-shadow:0 6px 14px -6px rgba(var(--glow),.6)}
.slot.off{opacity:.4;cursor:not-allowed;text-decoration:line-through}
/* request photos (customer attaches job-scope photos) */
.req-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.req-thumb{position:relative;aspect-ratio:1;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--line)}
.req-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(15,23,42,.7);color:#fff;display:grid;place-items:center}
.req-del svg{width:12px;height:12px}
.req-add{aspect-ratio:1;border:1.5px dashed var(--line-strong);border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:11.5px;font-weight:600}
.req-add:hover{border-color:var(--primary);color:var(--primary-600)}
.req-add svg{width:20px;height:20px}
/* request-photo gallery in the booking detail */
.req-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.req-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.sched-ok{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--primary-600)}
.sched-ok svg{width:15px;height:15px}
/* windows calculator price */
.win-price{display:flex;flex-direction:column;gap:2px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.win-price b{font-size:26px;font-weight:850;color:var(--primary-600);letter-spacing:-.02em}
/* live tracking map + FlashClean SLA */
.trk-map{width:100%;height:180px;border-radius:14px;border:1px solid var(--line);display:block}
.trk-eta{text-align:right;line-height:1.1}
.trk-eta b{font-size:20px;font-weight:850;color:var(--primary-600);display:block}
.trk-eta span{font-size:11px;color:var(--ink-3)}
.flash-slim{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--primary-600)}
.flash-slim svg{width:15px;height:15px}
.flash-card{background:linear-gradient(135deg,#0F2A20,#0B3A32);color:#fff}
.flash-card .flash-ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.flash-card .flash-ic svg{width:20px;height:20px}
.flash-count{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums;color:#7DF3C0}
.flash-count.over{color:#FF8A8A}
.flash-sla{display:flex;align-items:center;gap:8px;background:var(--primary-050);color:var(--primary-600);font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:12px;margin-bottom:12px}
.flash-sla svg{width:17px;height:17px}
/* admin block-duration picker */
.blk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.blk-grid button{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;color:var(--ink)}
.blk-grid button small{font-size:10px;color:var(--ink-3);font-weight:600}
.blk-grid button:hover{border-color:var(--danger);color:var(--danger)}
/* animated logo badge */
.logo-badge{flex:none;animation:bob 6s ease-in-out infinite}
.logo-badge svg{width:74px;height:74px;overflow:visible;filter:drop-shadow(0 16px 32px rgba(20,200,113,.45))}
.brand-lockup .logo-badge svg{width:64px;height:64px}
.lb-house{stroke-dasharray:240;stroke-dashoffset:240;animation:lbdraw 1s .2s cubic-bezier(.6,0,.2,1) forwards}
.lb-door{stroke-dasharray:44;stroke-dashoffset:44;animation:lbdraw .5s 1s ease forwards}
@keyframes lbdraw{to{stroke-dashoffset:0}}
.lb-spark{transform-box:fill-box;transform-origin:center;opacity:0;animation:lbspark .6s 1.15s cubic-bezier(.2,1.6,.4,1) forwards,twk 2.8s 2s ease-in-out infinite}
@keyframes lbspark{from{opacity:0;transform:scale(.2) rotate(-45deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.auth-mhero{display:none}

.userchip:hover{background:var(--surface-2)}
.userchip .avatar{width:38px;height:38px}
.userchip .uc-txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.userchip .uc-txt b{font-size:14px}.userchip .uc-txt>span{font-size:12px;color:var(--primary-600);font-weight:600}
.mobile-brand{display:none}
.dash .main{padding:26px}
/* home dashboard grid: hero full width, then main + right rail */
.home-cols{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
.home-aside{display:flex;flex-direction:column;gap:18px;position:sticky;top:84px}
.reco-card{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.reco-card:last-child{border-bottom:none}
.reco-card .avatar{width:44px;height:44px;flex:none}
.reco-meta{flex:1;min-width:0}
.reco-meta h4{font-size:14.5px;display:flex;align-items:center;gap:4px}
.reco-meta .rt{font-size:12.5px;color:var(--ink-2);margin:2px 0}
.reco-free{color:var(--accent-600);font-size:12px;font-weight:700}
/* Здоровье дома — прогресс-бары LUMI Score */
.hh-score{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums}
.hh-row{margin-bottom:11px}.hh-row:last-of-type{margin-bottom:2px}
.hh-track{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.hh-fill{height:100%;border-radius:6px;transition:width .9s cubic-bezier(.2,.7,.3,1)}
/* Напоминания */
.rem-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rem-row:last-child{border-bottom:none}
.rem-dot{width:9px;height:9px;border-radius:50%;flex:none}
.rem-dot.over{background:var(--danger);box-shadow:0 0 0 4px color-mix(in srgb,var(--danger) 18%,transparent)}
.rem-dot.soon{background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 18%,transparent)}
@media(max-width:1120px){.home-cols{grid-template-columns:1fr}.home-aside{position:static;flex-direction:row;flex-wrap:wrap}.home-aside>*{flex:1;min-width:280px}}
@media(max-width:960px){
  .app.dash{grid-template-columns:1fr;max-width:100%}
  .sidebar{display:none}
  .mobile-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;margin-right:auto}
  .dash .main{padding:16px 14px 96px}
  .dash .topbar{padding:12px 16px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;padding:4px}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.active{color:var(--primary)}
  .home-cols{grid-template-columns:1fr}.home-aside{position:static}
}
/* ─── mobile: a calmer, simpler layout ─── */
@media(max-width:640px){
  body::before{display:none}                    /* drop ambient aurora glow */
  .hero.console{padding:22px 18px;min-height:0;box-shadow:0 16px 34px -20px rgba(var(--glow),.5)}
  .hero-h1{font-size:26px}
  .hero-eyebrow .dim{display:none}              /* keep the eyebrow to one line */
  .hero-chips .gpill span{font-size:13px}
  #concChips{display:none}                       /* hide example prompts, keep the input */
  .home-aside{flex-direction:column;gap:14px}
  .home-aside>*{min-width:0}
  #recoList .reco-card:nth-of-type(n+4){display:none}   /* show top 3 on phones */
  .section-title{font-size:16px}
  .card.pad{padding:16px}
}
/* language switcher */
.langbtn{display:inline-flex;align-items:center;gap:5px;width:auto;padding:0 10px}
.langbtn b{font-size:11px;font-weight:800;letter-spacing:.04em}
.lang-menu{position:fixed;z-index:120;min-width:190px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;box-shadow:0 18px 44px rgba(2,10,20,.22);padding:8px;display:flex;flex-direction:column;gap:2px}
.lang-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  padding:10px 12px;border-radius:11px;background:none;border:0;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.lang-opt:hover{background:var(--surface-2)}
.lang-opt.active{color:var(--primary);background:var(--primary-050)}
.lang-opt svg{width:17px;height:17px}
.linklike{background:none;border:0;color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;padding:4px}
.linklike:hover{text-decoration:underline}
.oauth-sep{display:flex;align-items:center;gap:12px;margin:20px 0 16px;color:var(--ink-3);font-size:12.5px;font-weight:600}
.oauth-sep::before,.oauth-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.oauth-btns{display:flex;flex-direction:column;gap:10px}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:13px;
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);font-size:14.5px;font-weight:700;
  text-decoration:none;transition:.15s;cursor:pointer}
.oauth-btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.oauth-btn svg{width:19px;height:19px;flex:none}
.oauth-btn.apple{background:#000;border-color:#000;color:#fff}
.oauth-btn.apple:hover{background:#111;border-color:#111}
:root[data-theme="dark"] .oauth-btn.apple{background:#fff;border-color:#fff;color:#000}

let _unitCache={};
function unitPass(text){
  const m=UNIT_MAP[state.lang]; if(!m)return text;
  let c=_unitCache[state.lang];
  if(!c){ const toks=Object.keys(m).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    c=_unitCache[state.lang]={re:new RegExp('(?<![\\p{L}])('+toks.join('|')+')(?![\\p{L}])','gu'),map:m}; }
  return text.replace(c.re,(x)=>c.map[x]!=null?c.map[x]:x);
}
// Translate the already-rendered DOM under `root` into the active language.
// Idempotent: keys are Russian, so a second pass finds nothing to change.
function i18nApply(root){
  if(!root||state.lang==='ru')return;
  const d=TR[state.lang]; if(!d)return;
  const NF=NodeFilter;
  const w=document.createTreeWalker(root,NF.SHOW_TEXT,{acceptNode(n){
    const p=n.parentNode; if(!p)return NF.FILTER_REJECT;
    const tg=p.nodeName; if(tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA')return NF.FILTER_REJECT;
    if(p.closest&&p.closest('[data-noi18n]'))return NF.FILTER_REJECT;   // e.g. language switcher (native names)
    return n.nodeValue && n.nodeValue.trim()?NF.FILTER_ACCEPT:NF.FILTER_REJECT;
  }});
  const nodes=[]; let n; while(n=w.nextNode())nodes.push(n);
  nodes.forEach(nd=>{ const k=nd.nodeValue.trim(); const h=d[k];
    if(h!=null&&h!==k){ nd.nodeValue=nd.nodeValue.replace(k,h); return; }
    if(/[А-Яа-яЁё]/.test(nd.nodeValue)){ const u=unitPass(nd.nodeValue); if(u!==nd.nodeValue) nd.nodeValue=u; }
  });
  if(root.querySelectorAll) root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>{
    ['placeholder','title','aria-label'].forEach(a=>{ if(!e.hasAttribute(a))return; const v=e.getAttribute(a).trim(); const h=d[v]; if(h!=null&&h!==v)e.setAttribute(a,h); });
  });
}
let _i18nObs=null;
function i18nStart(){
  document.documentElement.lang=state.lang;
  i18nApply(document.body);
  if(_i18nObs)return;
  const OPT={childList:true,subtree:true};
  let scheduled=false;
  _i18nObs=new MutationObserver(()=>{
    if(state.lang==='ru'||scheduled)return;
    scheduled=true;
    requestAnimationFrame(()=>{ scheduled=false; _i18nObs.disconnect(); try{i18nApply(document.body);}finally{_i18nObs.observe(document.body,OPT);} });
  });
  _i18nObs.observe(document.body,OPT);
}
function setLang(l){
  if(l!=='ru' && !TR[l])return;
  state.lang=l; localStorage.setItem('lumi_lang',l); document.documentElement.lang=l;
  if(state.user)render(); else renderAuth();
}
function openLangMenu(anchor){
  document.querySelectorAll('.lang-menu').forEach(m=>m.remove());
  const menu=el(`<div class="lang-menu" data-noi18n></div>`);
  LANGS.forEach(([code,label])=>{
    const b=el(`<button class="lang-opt${code===state.lang?' active':''}"><span>${label}</span>${code===state.lang?I.check:''}</button>`);
    b.onclick=()=>{ menu.remove(); if(code!==state.lang) setLang(code); };
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const r=anchor.getBoundingClientRect();
  menu.style.top=(r.bottom+8)+'px';
  menu.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  const off=(e)=>{ if(!menu.contains(e.target)&&!anchor.contains(e.target)){ menu.remove(); document.removeEventListener('mousedown',off);} };
  setTimeout(()=>document.addEventListener('mousedown',off),0);
}

/* ---------- Animation helpers ---------- */
function stagger(container){ if(!container)return; container.querySelectorAll(':scope > *').forEach((el,i)=>{el.classList.add('reveal');el.style.setProperty('--i',i);}); }
function rippleFx(e){ const b=e.currentTarget; const r=document.createElement('span'); const d=Math.max(b.offsetWidth,b.offsetHeight); const rect=b.getBoundingClientRect(); r.className='ripple'; r.style.width=r.style.height=d+'px'; r.style.left=(e.clientX-rect.left-d/2)+'px'; r.style.top=(e.clientY-rect.top-d/2)+'px'; b.appendChild(r); setTimeout(()=>r.remove(),600); }
document.addEventListener('click',(e)=>{const b=e.target.closest('.btn');if(b&&!b.disabled)rippleFx.call(null,{currentTarget:b,clientX:e.clientX,clientY:e.clientY});},true);
function confetti(){ const cols=['#E9C46A','#14C871','#2C7BE5','#DB4C9B','#7A5AF0','#12B5A0']; const wrap=el('<div class="confetti"></div>'); for(let i=0;i<80;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'vw'; p.style.background=cols[i%cols.length]; p.style.animationDuration=(1.6+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.3)+'s'; p.style.transform='rotate('+(Math.random()*360)+'deg)'; wrap.appendChild(p);} document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),3400); }
function countUp(node,to,dur=900){ if(!node)return; const start=performance.now(); const from=0; function tick(t){ const k=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-k,3); node.textContent=Math.round(from+(to-from)*e); if(k<1)requestAnimationFrame(tick);} requestAnimationFrame(tick); }
function animateRing(node,to,col){ if(!node)return; const start=performance.now(),dur=1000; function tick(t){ const k=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-k,3); const deg=Math.round(to*3.6*e); node.style.background=`conic-gradient(${col} ${deg}deg, var(--surface-2) 0)`; if(k<1)requestAnimationFrame(tick);} requestAnimationFrame(tick); }

function plural(n,one,few,many){const m=n%10,h=n%100;return h>=11&&h<=14?many:m===1?one:m>=2&&m<=4?few:many;}
function timeAgo(ts){const s=(Date.now()-ts)/1000;if(s<60)return'только что';if(s<3600){const m=Math.floor(s/60);return m+' '+plural(m,'мин','мин','мин')+' назад';}if(s<86400){const h=Math.floor(s/3600);return h+' '+plural(h,'час','часа','часов')+' назад';}const d=Math.floor(s/86400);return d+' '+plural(d,'день','дня','дней')+' назад';}
function fmtTime(ts){return new Date(ts).toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}

async function api(path,method='GET',body){
  const h={'Content-Type':'application/json'};
  if(state.token) h['Authorization']='Bearer '+state.token;
  const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'Something went wrong');
  return data;
}

      try{

/* ---------- Notifications ---------- */
async function loadNotifBadge(){
  try{
    const {unreadCount}=await api('/api/notifications');
    const badge=$('#bellBadge');
    if(badge){ badge.textContent=unreadCount>9?'9+':unreadCount; badge.style.display=unreadCount?'grid':'none'; }
  }catch{}
}
const NOTIF_ICON={operational:I.book,account:I.check,smart_home:I.smart,marketing:I.spark};
function notifDeepLink(link){
  closeModal();
  const m=/^lumi:\/\/(.+)$/.exec(link||''); if(!m)return;
  const [seg,arg]=m[1].split('/');
  if(seg==='booking'&&arg){openBooking(arg);}
  else if(seg==='smart-home'){if(arg)state.activeProperty=arg;state.view='smart';render();}
  else if(seg==='provider'){/* offer */ const id=link.split('/').pop(); openBooking(id);}
  else if(seg==='wallet'){state.view='wallet';render();}
  else if(seg==='premium'){state.view='premium';render();}
  else if(seg==='profile'){openProfile();}
  else {state.view='home';render();}
}
async function openNotifications(){
  showModal(`<div class="card pad" style="max-height:80vh;overflow-y:auto"><div class="sk" style="height:120px"></div></div>`);
  try{
    const {notifications:list}=await api('/api/notifications');
    const box=$('.modal .card');
    if(!list.length){box.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Уведомления</h3></div>${emptyState('Пока пусто','Здесь появятся события по вашим заказам.').outerHTML}`;return;}
    // group by day
    const groups={};
    list.forEach(n=>{const d=new Date(n.createdAt);const key=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});(groups[key]=groups[key]||[]).push(n);});
    box.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h3>Уведомления</h3><button class="btn ghost sm" id="readAll">Прочитать все</button></div>
      ${Object.entries(groups).map(([day,ns])=>`<div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 8px">${day}</div>
        ${ns.map(n=>`<div class="notif ${n.read?'':'unread'}" data-link="${n.deepLink}" data-id="${n.id}">
          <div class="ni ${n.category}">${NOTIF_ICON[n.category]||I.bell}</div>
          <div style="flex:1;min-width:0"><b style="font-size:14.5px">${n.title}</b><div class="muted tiny" style="margin-top:2px">${n.body}</div><div class="hint tiny" style="margin-top:3px">${timeAgo(n.createdAt)}</div></div>
          ${n.read?'':'<span class="pulse" style="align-self:center"></span>'}
        </div>`).join('')}`).join('')}`;
    box.querySelectorAll('.notif').forEach(el=>el.onclick=async()=>{
      try{await api('/api/notifications/'+el.dataset.id+'/read','POST',{});}catch{}
      notifDeepLink(el.dataset.link);
    });
    $('#readAll',box).onclick=async()=>{try{await api('/api/notifications/read-all','POST',{});openNotifications();loadNotifBadge();}catch(e){toast(e.message,true);}};
  }catch(e){toast(e.message,true);closeModal();}
}
function openNotifPrefs(){

  const inner=el(`<div class="card pad" style="max-height:80vh;overflow-y:auto"><h3 style="margin-bottom:4px">Настройки уведомлений</h3><p class="muted tiny" style="margin-bottom:16px">Критичные уведомления о безопасности и заказах отключить нельзя.</p><div id="prefRows"><div class="sk" style="height:120px"></div></div></div>`);

      try{await api('/api/notification-preferences','PATCH',{[inp.dataset.k]:inp.checked});toast('Сохранено');}

// Generative aurora for the home console hero — soft coral/turquoise metaballs
// drifting on canvas. Unique every load, self-stops when the view changes,
// and honours prefers-reduced-motion (renders one static frame).
function heroAurora(cv){
  if(!cv||!cv.getContext) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ctx=cv.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  let W=1,H=1;
  function resize(){ if(!cv.isConnected)return; W=cv.width=Math.max(1,Math.round(cv.clientWidth*dpr)); H=cv.height=Math.max(1,Math.round(cv.clientHeight*dpr)); }
  resize();
  const cols=[[20,200,113],[14,168,142],[55,229,154],[63,220,201],[11,179,154]];
  const blobs=Array.from({length:5},(_,i)=>({
    x:Math.random()*W,y:Math.random()*H,
    vx:(Math.random()*2-1)*0.22*dpr,vy:(Math.random()*2-1)*0.22*dpr,
    r:(0.40+Math.random()*0.34)*Math.min(W,H),c:cols[i%cols.length]
  }));
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='screen';
    for(const b of blobs){
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      g.addColorStop(0,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},.5)`);
      g.addColorStop(1,`rgba(${b.c[0]},${b.c[1]},${b.c[2]},0)`);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.2832);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
  }
  function step(){
    if(!cv.isConnected)return;
    for(const b of blobs){
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<-b.r*0.5||b.x>W+b.r*0.5)b.vx*=-1;
      if(b.y<-b.r*0.5||b.y>H+b.r*0.5)b.vy*=-1;
    }
    draw();requestAnimationFrame(step);
  }
  window.addEventListener('resize',resize,{passive:true});
  draw();
  if(!reduce)requestAnimationFrame(step);
}

/* ---------- LUMI Score ---------- */
function scoreColor(v){return v>=85?'var(--primary)':v>=70?'#3B9BE3':v>=50?'var(--warn)':'var(--danger)';}
function starRow(n){return `<span class="stars" style="color:var(--star)">${Array.from({length:5}).map((_,i)=>`<span style="${i<n?'':'opacity:.22'}">${I.star}</span>`).join('')}</span>`;}
function recTextRu(r,TASK_RU){
  const label=TASK_RU[r.label]||r.label;
  const over=/(\d+)\s+days overdue/.exec(r.text);
  if(over){const n=+over[1];return `«${label}» просрочено на ${n} ${plural(n,'день','дня','дней')} — закажите, чтобы дом оставался свежим.`;}
  const due=/due in (\d+)\s+day/.exec(r.text);
  if(due){const n=+due[1];return `«${label}» нужно через ${n} ${plural(n,'день','дня','дней')}.`;}
  return label;
}
const GRADE_RU={Excellent:'Отлично',Great:'Хорошо',Fair:'Нормально','Needs care':'Требует ухода'};
const DIM_RU={Cleanliness:'Чистота','Air & freshness':'Воздух и свежесть',Windows:'Окна',Mattresses:'Матрасы',Upholstery:'Мебель',Garden:'Сад'};
function lumiScoreCard(score,pid){
  if(!score)return '';
  const col=scoreColor(score.overall);
  return `<div class="card pad reveal" style="margin-bottom:20px">
    <div class="row" style="gap:20px;align-items:center;flex-wrap:wrap">
      <div class="score-ring" id="scoreRing" data-score="${score.overall}" data-col="${col}" style="width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(${col} 0deg,var(--surface-2) 0)">
        <div style="width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center">
          <div><div class="ring-num" id="scoreNum" style="font-size:30px;font-weight:800;letter-spacing:-.03em;color:${col};line-height:1">0</div><div class="tiny muted" style="font-weight:700">LUMI Score</div></div>
        </div>
      </div>
      <div style="flex:1;min-width:220px">
        <div class="row" style="gap:8px;margin-bottom:4px"><h3>Здоровье дома</h3><span class="badge ${score.overall>=70?'green':score.overall>=50?'amber':'red'}">${GRADE_RU[score.grade]||score.grade}</span></div>
        <p class="muted tiny" style="margin-bottom:12px;line-height:1.5">Живой рейтинг вашего дома по уборке, воздуху, окнам, мебели и не только. LUMI держит его высоким.</p>
        ${score.focus?`<button class="btn sm" data-rec="${score.focus.book}">${I.spark} Поднять рейтинг — заказать «${(DIM_RU[score.focus.label]||score.focus.label).toLowerCase()}»</button>`:`<span class="badge green">${I.check}Ваш дом в отличной форме</span>`}
      </div>
    </div>
    <div class="divider"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
      ${score.dims.map(d=>`<div class="row" style="justify-content:space-between"><span class="tiny" style="font-weight:600">${DIM_RU[d.label]||d.label}</span>${starRow(d.stars)}</div>`).join('')}
    </div>
  </div>`;
}

function passportSearch(q,timeline){
  const t=(q||'').toLowerCase();
  if(!t.trim())return 'Задайте вопрос об истории дома.';
  const totalMatch=/потрат|сколько|стоим|расход/.test(t);
  if(totalMatch){const sum=timeline.reduce((s,e)=>s+e.price,0);return `Всего на обслуживание этого дома потрачено <b>${money(sum)}</b> за ${timeline.length} ${plural(timeline.length,'услугу','услуги','услуг')}.`;}
  const keymap=[['генеральн','deep'],['глубок','deep'],['обычн','standard'],['стандарт','standard'],['диван','deep'],['матрас','deep'],['после ремонт','moveout'],['ремонт','moveout'],['переезд','moveout'],['офис','office']];
  let svc=null; for(const [k,s] of keymap){ if(t.includes(k)){svc=s;break;} }
  const items=svc?timeline.filter(e=>e.service===svc):timeline;
  if(!items.length)return svc?`По этой услуге пока нет записей в истории.`:`Ничего не найдено. Попробуйте: «когда мыли окна?».`;
  const last=items[0];
  const list=items.slice(0,4).map(e=>`${fmtDate(e.at)} — ${svcLabelRu(e.serviceLabel)}${e.provider?` (${e.provider})`:''} · ${money(e.price)}`).join('<br>');
  return `Последняя запись: <b>${svcLabelRu(last.serviceLabel)}</b> — ${fmtDate(last.at)}.<br><br>${list}`;
}
function openSaleReport(P){

function newDraft(service,propertyId){
  const prop=propertyId?state.properties.find(p=>p.id===propertyId):(state.properties[0]||null);
  return {service:service||'standard',propertyId:prop?prop.id:null,rooms:prop?prop.rooms:2,baths:prop?prop.baths:1,area:prop?prop.area:0,windows:5,windowSide:'inside',floor:1,windowAccess:'normal',extras:[],urgency:'scheduled',date:'',time:'',scheduledFor:null,address:prop?prop.address:'',city:prop?prop.city:(state.user.city||'Warsaw'),notes:'',photos:[],step:0,estimate:null};
}
function startBooking(service,propertyId,overrides){
  state.draft=Object.assign(newDraft(service,propertyId),overrides||{});
  state.view='book';render();
}
/* ---------- à-la-carte extras helpers (booking step 1) ---------- */
function extQty(key){const e=(state.draft.extras||[]).find(x=>x.key===key);return e?(e.qty||1):0;}
function setExt(key,qty){
  const d=state.draft;let arr=(d.extras||[]).filter(x=>x.key!==key);
  if(qty>0)arr.push({key,qty});d.extras=arr;
}
function renderExCtrl(box,key,e){
  if(!box)return;
  const q=extQty(key);
  if(e.type==='percent'){
    box.innerHTML=`<button class="ex-pill ${q?'on':''}">${q?I.check:''}+40%</button>`;
    box.firstChild.onclick=()=>{setExt(key,q?0:1);updateExRow(key);refreshExTotal();};
  }else if(e.type==='qty'){
    if(q>0){
      box.innerHTML=`<div class="ex-step"><button data-d="-1">−</button><b>${q}<span>${e.unit||''}</span></b><button data-d="1">+</button></div>`;
      box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
        const nq=Math.max(0,Math.min(e.max||20,q+ +b.dataset.d));setExt(key,nq);updateExRow(key);refreshExTotal();
      });
    }else{
      box.innerHTML=`<button class="ex-pill">+${e.price} zł</button>`;
      box.firstChild.onclick=()=>{setExt(key,1);updateExRow(key);refreshExTotal();};
    }
  }else{ // flat
    box.innerHTML=`<button class="ex-pill ${q?'on':''}">${q?I.check:''}+${e.price} zł</button>`;
    box.firstChild.onclick=()=>{setExt(key,q?0:1);updateExRow(key);refreshExTotal();};
  }
}
function updateExRow(key){
  const row=document.querySelector(`.ex-row[data-k="${key}"]`);if(!row)return;
  const e=(state.catalog?.extras||{})[key];if(!e)return;
  row.classList.toggle('sel',extQty(key)>0);
  renderExCtrl($('.ex-ctrl',row),key,e);
}

    // For a windows order show ONLY window-relevant extras (остекление, балкон) —
    // the cleaning add-ons don't belong here, and the per-window wash is already
    // covered by the calculator.
    const isWin=d.service==='windows';
    const skip=isWin?['windows','windows_out']:[];
    const groups={};
    Object.entries(ex).forEach(([key,e])=>{
      if(skip.includes(key))return;
      if(isWin && e.cat!=='windows')return;   // hide cleaning add-ons for a windows order
      (groups[e.cat]=groups[e.cat]||[]).push([key,e]);
    });
    Object.keys(groups).forEach(cat=>{
      const sec=el(`<div class="ex-cat"><div class="ex-cat-h">${cats[cat]||cat}</div></div>`);
      groups[cat].forEach(([key,e])=>{
        const row=el(`<div class="ex-row" data-k="${key}">
          <button class="ex-info" title="Подробнее" aria-label="Подробнее">?</button>

          <div class="ex-ctrl"></div>

        $('.ex-info',row).onclick=(ev)=>{ev.stopPropagation();row.classList.toggle('open');};
        renderExCtrl($('.ex-ctrl',row),key,e);

      });
      list.appendChild(sec);
    });
    refreshExTotal();
  }
  else if(d.step===2){ // when + where
    body.innerHTML=`<h2 style="margin-bottom:4px">Когда и где?</h2><p class="muted" style="margin-bottom:20px">Подберём ближайшего исполнителя.</p>
      <div class="card pad">
        <label class="field"><span>Срочность</span></label>
        <div class="opt-grid" id="urg" style="margin-bottom:16px">
          ${urgOpt('scheduled','По расписанию',I.clock,'Выбрать время')}
          ${urgOpt('today','Сегодня',I.clock,'+15%')}
          ${urgOpt('flash','FlashClean',I.flash,'Срочно · +40%')}
        </div>
        <div id="schedZone">${d.urgency==='flash'?'':renderSchedule(d)}</div>
        <label class="field"><span>Адрес</span><input class="input" id="addr" value="${d.address}" placeholder="Улица, дом, квартира"></label>
        <label class="field"><span>Город</span><input class="input" id="city" value="${d.city}"></label>
        <label class="field"><span>Комментарий исполнителю — необязательно</span><textarea class="input" id="notes" placeholder="Код от двери, животные, на что обратить внимание…">${d.notes}</textarea></label>
        <label class="field" style="margin-bottom:6px"><span>Фото объекта — чтобы исполнитель видел объём (до 6)</span></label>
        <div class="req-photos" id="reqPhotos"></div>
      </div>`;
    renderReqPhotos(body);
    body.querySelectorAll('#urg .opt').forEach(o=>o.onclick=()=>{
      d.urgency=o.dataset.u;
      if(d.urgency==='today')d.date=todayISO();
      if(d.urgency==='flash'){d.date='';d.time='';d.scheduledFor=null;}
      viewBook();
    });
    wireSchedule(body,d);
    const bind=(id,k)=>{const e=$('#'+id,body);e.oninput=()=>d[k]=e.value;};
    bind('addr','address');bind('city','city');bind('notes','notes');
  }
  else if(d.step===3){ // AI estimate + confirm
    body.innerHTML=`<h2 style="margin-bottom:4px">AI-оценка стоимости</h2><p class="muted" style="margin-bottom:20px">Честная цена, рассчитана мгновенно.</p>
      <div id="estBox"><div class="card pad"><div class="sk" style="height:120px"></div></div></div>`;
    computeEstimate(body);
  }

  // nav buttons
  const nav=el(`<div class="row" style="margin-top:22px;gap:12px">
    ${d.step>0?`<button class="btn ghost" id="back">Назад</button>`:''}
    <div class="spacer" style="flex:1"></div>
    ${d.step<3?`<button class="btn" id="next">Далее ${I.arrow}</button>`:`<button class="btn" id="confirm">Подтвердить заказ ${I.check}</button>`}
  </div>`);
  c.appendChild(nav);
  const back=$('#back',nav); if(back)back.onclick=()=>{d.step--;viewBook();};
  const next=$('#next',nav); if(next)next.onclick=()=>{
    if(d.step===2){
      if(d.urgency!=='flash' && (!d.date||!d.time)){toast('Выберите дату и время',true);return;}
      if(!d.address.trim()){toast('Введите адрес',true);return;}
    }
    d.step++;viewBook();
  };
  const conf=$('#confirm',nav); if(conf)conf.onclick=confirmBooking;

  shell(c);
}

function renderReqPhotos(scope){

/* ---- date & time picker (booking step 2) ---- */
function todayISO(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;}
function bookingSlots(){return ['08:00','10:00','12:00','14:00','16:00','18:00','20:00'];}
function schedISO(d){ if(!d.date||!d.time)return null; const dt=new Date(`${d.date}T${d.time}:00`); return isNaN(dt)?null:dt.toISOString(); }
function renderSchedule(d){
  const today=todayISO();
  const date=d.date||'';
  const now=new Date();
  const isToday=date===today;
  return `<div class="sched">
    <label class="field"><span>${d.urgency==='today'?'Дата (сегодня)':'Дата визита'}</span>
      <input type="date" class="input" id="schedDate" value="${date}" min="${today}" ${d.urgency==='today'?`max="${today}"`:''}></label>
    <label class="field" style="margin-bottom:8px"><span>Время визита</span></label>
    <div class="slot-grid" id="slotGrid">${bookingSlots().map(s=>{
      const past=isToday && parseInt(s,10)<=now.getHours();
      return `<button type="button" class="slot ${d.time===s?'sel':''} ${past?'off':''}" data-t="${s}" ${past?'disabled':''}>${s}</button>`;
    }).join('')}</div>
    ${!date||!d.time?`<p class="hint" style="margin-top:8px">Выберите удобные дату и время визита.</p>`:`<p class="sched-ok" style="margin-top:8px">${I.check} Визит: ${fmtSchedule(d)}</p>`}
  </div>`;
}
function fmtSchedule(d){ const iso=schedISO(d); if(!iso)return ''; const dt=new Date(iso);
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})+', '+d.time; }
function wireSchedule(scope,d){
  const sd=$('#schedDate',scope); if(sd)sd.onchange=()=>{ d.date=sd.value; d.scheduledFor=schedISO(d);
    const z=$('#schedZone',scope); if(z){ z.innerHTML=renderSchedule(d); wireSchedule(scope,d); } };
  scope.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{ if(b.disabled)return; d.time=b.dataset.t; d.scheduledFor=schedISO(d);
    const z=$('#schedZone',scope); if(z){ z.innerHTML=renderSchedule(d); wireSchedule(scope,d); } });
}

function timelineHtml(b){

  if(b.status==='cancelled'){
    return b.timeline.map(t=>`<div class="ev"><b>${labels[t.status]||t.status}</b><div class="tiny muted">${fmtTime(t.at)}</div></div>`).join('');
  }
  return order.map(s=>{

    return `<div class="ev ${pend?'pending':''}"><b style="${pend?'color:var(--ink-3)':''}">${labels[s]}</b>${ev?`<div class="tiny muted">${fmtTime(ev.at)}</div>`:''}</div>`;
  }).join('');
}

function startCountdown(node,until){
  if(!node)return;
  function tick(){
    if(!node.isConnected)return;
    const ms=until-Date.now();
    if(ms<=0){node.textContent='0:00';node.classList.add('over');return;}
    const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);
    node.textContent=`${m}:${String(s).padStart(2,'0')}`;
    setTimeout(tick,1000);
  }
  tick();
}
function drawTrackingMap(cv,b){
  if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');
  const dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){ const w=cv.clientWidth||320; cv.width=w*dpr; cv.height=180*dpr; }
  size();
  const t=b.track, from=t.from, to=t.to;
  const eta=(b.etaMinutes||15), start=b.enrouteAt||Date.now();
  const etaNode=$('#trkEta');
  function P(pt){ return { x:pt.x*cv.width, y:pt.y*cv.height }; }
  function frame(){
    if(!cv.isConnected)return;
    const W=cv.width,H=cv.height;
    // progress along the route from elapsed time
    const prog=Math.max(0,Math.min(1,(Date.now()-start)/(eta*60000)));
    ctx.clearRect(0,0,W,H);
    // map backdrop
    ctx.fillStyle=isDark()?'#0F1826':'#EAF3EE'; ctx.fillRect(0,0,W,H);
    // faint street grid
    ctx.strokeStyle=isDark()?'rgba(255,255,255,.05)':'rgba(15,23,42,.06)'; ctx.lineWidth=1*dpr;
    for(let x=0;x<W;x+=34*dpr){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=34*dpr){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const a=P(from),c=P(to);
    // route line (traveled solid, remaining dashed)
    const cur={x:a.x+(c.x-a.x)*prog,y:a.y+(c.y-a.y)*prog};
    ctx.lineCap='round';
    ctx.strokeStyle=isDark()?'rgba(255,255,255,.18)':'rgba(15,23,42,.16)'; ctx.lineWidth=5*dpr;
    ctx.setLineDash([2*dpr,7*dpr]); ctx.beginPath();ctx.moveTo(cur.x,cur.y);ctx.lineTo(c.x,c.y);ctx.stroke();
    ctx.setLineDash([]); ctx.strokeStyle=getCSS('--primary'); ctx.lineWidth=5*dpr;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(cur.x,cur.y);ctx.stroke();
    // destination pin
    ctx.fillStyle=getCSS('--danger'); ctx.beginPath();ctx.arc(c.x,c.y,7*dpr,0,6.2832);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c.x,c.y,3*dpr,0,6.2832);ctx.fill();
    // moving marker (car)
    ctx.save();ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=8*dpr;
    ctx.fillStyle=getCSS('--primary');ctx.beginPath();ctx.arc(cur.x,cur.y,11*dpr,0,6.2832);ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';ctx.font=`${13*dpr}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🚗',cur.x,cur.y);
    // ETA text
    const rem=Math.max(0,Math.ceil((eta*60000-(Date.now()-start))/60000));
    if(etaNode&&etaNode.isConnected)etaNode.textContent=prog>=1?'на месте':`${rem} мин`;
    if(prog<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.addEventListener('resize',()=>{size();},{once:true});
}

  }

    html+=`<button class="btn ghost block" id="cancelBtn" style="margin-top:12px">Отменить заказ</button>`;
  }

    if(r.assigned){confetti();toast('Заказ ваш!');}else{toast('Отклик отправлен — ждём выбора клиента');}
    renderBookingDetail(b.id);
  }catch(e){toast(e.message,true);}});
  bind('enrouteBtn',async()=>{try{await api('/api/bookings/'+b.id+'/enroute','POST');toast('Клиент видит, что вы в пути');renderBookingDetail(b.id);}catch(e){toast(e.message,true);}});
  bind('startBtn',()=>transition(b.id,'in_progress'));

  bind('cancelBtn',()=>transition(b.id,'cancelled'));
