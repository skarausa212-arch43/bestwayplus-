<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14C871" />
<title>LUMI — The operating system for your home</title>
<style>
:root{
  --primary:#14C871; --primary-600:#0FB365; --primary-050:#E7FBF1;
  --ink:#0B1220; --ink-2:#5A6472; --ink-3:#8A94A3;
  --bg:#F6F8FA; --surface:#FFFFFF; --surface-2:#F1F4F7;
  --line:#E7ECF1; --danger:#F04438; --warn:#F79009; --star:#FFB020;
  --radius:20px; --radius-sm:14px; --radius-lg:28px;
  --shadow:0 1px 2px rgba(11,18,32,.04), 0 12px 32px rgba(11,18,32,.06);
  --shadow-lg:0 20px 60px rgba(11,18,32,.14);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sp:8px;
}
:root[data-theme="dark"]{
  --ink:#F4F7FA; --ink-2:#A7B0BD; --ink-3:#7A8494;
  --bg:#0A0E14; --surface:#141A22; --surface-2:#1C242E;
  --line:#242E3A; --primary-050:#0E2A1E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.4);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- App shell ---------- */
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:saturate(180%) blur(20px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:12px 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand .logo{width:34px;height:34px;flex:none}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{
  padding:8px 14px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:14.5px;
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--primary);color:#fff}
.nav button.active svg{color:#fff}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2)}
.iconbtn:hover{color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.main{flex:1;padding:24px 20px 80px}

/* ---------- Bottom nav (mobile) ---------- */
.tabbar{display:none}
@media(max-width:760px){
  .nav{display:none}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;
  }
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;padding:4px}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.active{color:var(--primary)}
  .main{padding:16px 14px 96px}
  .topbar{padding:12px 14px}
}

/* ---------- Cards & primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.hint{color:var(--ink-3);font-size:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;font-weight:700;font-size:15.5px;
  padding:14px 20px;border-radius:14px;transition:.15s;box-shadow:0 6px 18px rgba(20,200,113,.28);
}
.btn:hover{background:var(--primary-600);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger);box-shadow:0 6px 18px rgba(240,68,56,.28)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.green{background:var(--primary-050);color:var(--primary-600)}
.badge.blue{background:#E8F0FE;color:#1A73E8}
.badge.amber{background:#FEF3E2;color:#B25E09}
.badge.grey{background:var(--surface-2);color:var(--ink-2)}
.badge.red{background:#FEECEB;color:#C4342A}
:root[data-theme="dark"] .badge.blue{background:#12233F;color:#7DA9F5}
:root[data-theme="dark"] .badge.amber{background:#2E2410;color:#E9A94B}
:root[data-theme="dark"] .badge.red{background:#2E1512;color:#F08A82}
label.field{display:block;margin-bottom:14px}
label.field span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input,select.input,textarea.input{
  width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface);transition:.15s;outline:none;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-050)}
textarea.input{resize:vertical;min-height:80px}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--primary-050),transparent),var(--bg)}
.auth{width:100%;max-width:420px}
.auth .card{padding:28px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Hero / home ---------- */
.hero{
  border-radius:var(--radius-lg);padding:32px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#12B268,#14C871 55%,#3BE39A);
  box-shadow:0 24px 60px rgba(20,200,113,.35);
}
.hero h1{font-size:30px;line-height:1.1;max-width:520px}
.hero p{opacity:.92;margin-top:10px;max-width:460px;font-size:15px}
.hero .sparkle{position:absolute;right:-30px;top:-30px;width:220px;height:220px;opacity:.28}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.svc{padding:18px;cursor:pointer;transition:.15s;border:1.5px solid var(--line)}
.svc:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.svc .ico{width:46px;height:46px;border-radius:13px;background:var(--primary-050);display:grid;place-items:center;color:var(--primary-600);margin-bottom:12px}
.svc h4{font-size:15.5px}
.svc .from{color:var(--ink-3);font-size:13px;margin-top:3px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;letter-spacing:-.03em}

/* ---------- Booking wizard ---------- */
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps .s{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps .s.done{background:var(--primary)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.opt{padding:16px;border:1.5px solid var(--line);border-radius:15px;cursor:pointer;transition:.15s;text-align:center}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-050)}
.opt .ico{width:40px;height:40px;margin:0 auto 8px;color:var(--primary-600)}
.opt h4{font-size:14.5px}
.opt small{color:var(--ink-3)}
.stepper{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:13px;padding:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface);font-size:22px;font-weight:600;box-shadow:var(--shadow);display:grid;place-items:center}
.stepper b{flex:1;text-align:center;font-size:18px}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.extra{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s;font-size:14px;font-weight:600}
.extra.sel{border-color:var(--primary);background:var(--primary-050)}
.extra .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.extra.sel .cb{background:var(--primary);border-color:var(--primary);color:#fff}

/* estimate */
.est{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1.5px solid var(--line)}
.est .big{font-size:40px;font-weight:800;letter-spacing:-.03em}
.est .rng{color:var(--ink-3);font-size:13.5px}
.brk{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.brk span:first-child{color:var(--ink-2)}
.aiband{display:flex;gap:10px;align-items:center;background:var(--primary-050);border-radius:13px;padding:12px 14px;color:var(--primary-600);font-weight:600;font-size:13.5px}
/* Default size for inline icons rendered as raw SVG inside text/controls */
.btn svg,.chip svg,.badge svg,.aiband svg,.section-title svg,.bk .muted svg,.hero .badge svg,.est svg{width:17px;height:17px;flex:none}
.aiband svg{width:20px;height:20px}
.modal .row svg,.est svg,.stat b svg{width:17px;height:17px;flex:none}
/* Trailing chevrons that sit as direct flex children (would otherwise stretch) */
.bk > svg{width:22px;height:22px;flex:none;color:var(--ink-3)}
.card.pad > svg{width:22px;height:22px;flex:none}

/* ---------- Booking list & detail ---------- */
.bk{padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
.bk:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.bk .thumb{width:52px;height:52px;border-radius:14px;background:var(--primary-050);display:grid;place-items:center;color:var(--primary-600);flex:none}
.bk .meta{flex:1;min-width:0}
.bk .meta h4{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .price{text-align:right;font-weight:800;font-size:16px}
.timeline{position:relative;padding-left:26px}
.timeline .ev{position:relative;padding-bottom:18px}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-050)}
.timeline .ev::after{content:"";position:absolute;left:-17px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.timeline .ev:last-child::after{display:none}
.timeline .ev.pending::before{background:var(--line);box-shadow:0 0 0 4px var(--surface-2)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.uploadbox{border:2px dashed var(--line);border-radius:15px;padding:20px;text-align:center;cursor:pointer;transition:.15s;color:var(--ink-2)}
.uploadbox:hover{border-color:var(--primary);color:var(--primary-600)}

/* chat */
.chat{display:flex;flex-direction:column;height:420px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-3);font-size:12.5px;font-weight:600}
.msg .who{font-size:11px;opacity:.7;margin-bottom:2px;font-weight:700}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

/* stars */
.stars{display:inline-flex;gap:3px;color:var(--star)}
.stars svg{width:18px;height:18px}
.starpick span{display:inline-grid;place-items:center}
.starpick svg{width:28px;height:28px;cursor:pointer;color:var(--line);flex:none}
.starpick span.on svg{color:var(--star)}

/* admin table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.kpi b{font-size:28px;letter-spacing:-.03em;display:block}
.kpi .lab{color:var(--ink-2);font-size:13px;margin-top:2px}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);z-index:200;
  background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-weight:600;font-size:14px;
  box-shadow:var(--shadow-lg);transition:.35s cubic-bezier(.2,.9,.3,1);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#fff}
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(11,18,32,.5);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:460px;transform:translateY(20px) scale(.98);transition:.2s}
.modal-bg.show .modal{transform:none}

.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty svg{width:60px;height:60px;margin-bottom:14px;opacity:.5}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fadein{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-size:20px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 rgba(20,200,113,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(20,200,113,0)}100%{box-shadow:0 0 0 0 rgba(20,200,113,0)}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   CleanGo SPA — vanilla JS, no build step, no dependencies.
   ========================================================================= */
const API = '';
let state = {
  token: localStorage.getItem('cg_token') || null,
  user: null,
  view: 'home',
  catalog: null,
  categories: null,
  cities: [],
  properties: [],
  draft: null,          // booking wizard draft
  activeBooking: null,
  activeProperty: null, // property id for Smart Home
};

/* ---------- Icons (inline SVG) ---------- */
const I = {
  logo:`<svg class="logo" viewBox="0 0 40 40" fill="none"><rect width="40" height="40" rx="11" fill="url(#lg)"/><path d="M11 21.5 20 13l9 8.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 20v7.5h13V20" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M25.5 11.5l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9.9-2Z" fill="#fff"/><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop stop-color="#12B268"/><stop offset="1" stop-color="#3BE39A"/></linearGradient></defs></svg>`,
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
  book:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>`,
  jobs:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a1 1 0 00-1 1v11a1 1 0 001 1h16a1 1 0 001-1V8a1 1 0 00-1-1Z"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>`,
  wallet:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12h2"/><path d="M3 10h18"/></svg>`,
  admin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7l8-4Z"/><path d="M9 12l2 2 4-4"/></svg>`,
  chat:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10Z"/></svg>`,
  bell:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>`,
  sun:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>`,
  moon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8Z"/></svg>`,
  spark:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>`,
  ai:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M9 3v4M15 3v4M9 13h.01M15 13h.01M9 16h6"/></svg>`,
  star:`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.8 6 20.6l1.4-6.8L2.3 9.1l6.9-.8L12 2Z"/></svg>`,
  clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  pin:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>`,
  cam:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 011 1v9a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>`,

/* ---------- Utilities ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const el = (html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild};
const money = (n)=>`${Math.round(n)} zł`;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2600);}
function timeAgo(ts){const s=(Date.now()-ts)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function fmtTime(ts){return new Date(ts).toLocaleString(undefined,{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});}

async function api(path,method='GET',body){
  const h={'Content-Type':'application/json'};
  if(state.token) h['Authorization']='Bearer '+state.token;
  const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'Something went wrong');
  return data;
}

/* ---------- Theme ---------- */
function initTheme(){
  const saved=localStorage.getItem('cg_theme');
  const dark=saved?saved==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
}
function toggleTheme(){
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  localStorage.setItem('cg_theme',d?'light':'dark');
  render();
}
const isDark=()=>document.documentElement.dataset.theme==='dark';

function renderAuth(){
  let mode='login', role='customer';
  const root=$('#root');
  root.innerHTML='';
  const wrap=el(`<div class="auth-wrap"><div class="auth fadein"></div></div>`);
  const box=$('.auth',wrap);
  function draw(){
    box.innerHTML=`
      <div style="text-align:center;margin-bottom:22px">
        <div style="display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:26px;letter-spacing:-.03em">
          ${I.logo}<span>LUMI</span>
        </div>
        <p class="muted" style="margin-top:8px;font-size:14.5px">The operating system for your home.</p>
      </div>
      <div class="card pad">
        <div class="seg">
          <button data-m="login" class="${mode==='login'?'active':''}">Log in</button>
          <button data-m="register" class="${mode==='register'?'active':''}">Sign up</button>
        </div>
        <form id="authForm">
          ${mode==='register'?`
          <label class="field"><span>I want to</span>
            <div class="seg" style="margin:0">
              <button type="button" data-r="customer" class="${role==='customer'?'active':''}">Book services</button>
              <button type="button" data-r="cleaner" class="${role==='cleaner'?'active':''}">Work as provider</button>
            </div>
          </label>
          <label class="field"><span>Full name</span><input class="input" name="name" placeholder="Anna Nowak" required></label>
          <label class="field"><span>City</span><select class="input" name="city">${state.cities.map(c=>`<option>${c}</option>`).join('')||'<option>Warsaw</option>'}</select></label>`:''}
          <label class="field"><span>Email</span><input class="input" type="email" name="email" placeholder="you@example.com" required></label>
          <label class="field"><span>Password</span><input class="input" type="password" name="password" placeholder="••••••••" minlength="6" required></label>
          <button class="btn block" type="submit">${mode==='login'?'Log in':'Create account'} ${I.arrow}</button>
        </form>
        <div class="divider"></div>
        <p class="hint" style="text-align:center">Demo: <b>anna@example.com</b> (LUMI+) · <b>piotr@example.com</b> · <b>admin@cleango.app</b> — password <b>cleango123</b></p>
      </div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;draw();});
    $('#authForm',box).onsubmit=async(e)=>{
      e.preventDefault();
      const f=new FormData(e.target);
      const btn=e.target.querySelector('button[type=submit]');
      btn.disabled=true;btn.textContent='Please wait…';
      try{
        const payload=Object.fromEntries(f);
        if(mode==='register')payload.role=role;
        const res=await api(mode==='login'?'/api/login':'/api/register','POST',payload);
        state.token=res.token;state.user=res.user;
        localStorage.setItem('cg_token',res.token);
        state.view=res.user.role==='admin'?'admin':res.user.role==='cleaner'?'jobs':'home';
        await loadCatalog();
        if(res.user.role==='customer') await loadProperties();
        render();
        toast(`Welcome, ${res.user.name.split(' ')[0]}!`);
      }catch(err){toast(err.message,true);btn.disabled=false;draw();}
    };
  }
  draw();
  root.appendChild(wrap);
}

function navItems(){

  return [['home','Home',I.home],['properties','Homes',I.building],['book','Book',I.book],['bookings','Bookings',I.jobs],['wallet','Wallet',I.wallet]];
}
function shell(content){
  const u=state.user;

function propertyCard(p){

    </div>
    ${I.arrow}
  </div>`);
  row.onclick=()=>{state.activeProperty=p.id;state.view='smart';render();};
  return row;
}
async function runConcierge(conc){
  const input=$('#concInput',conc), out=$('#concOut',conc);
  const text=input.value.trim(); if(!text){input.focus();return;}
  out.innerHTML=`<div class="sk" style="height:70px"></div>`;
  try{
    const {suggestion:s}=await api('/api/concierge','POST',{text});
    const urg={scheduled:'Scheduled',today:'Today',flash:'FlashClean · ASAP'}[s.urgency];
    out.innerHTML=`<div class="card pad" style="background:var(--surface-2)">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <b style="font-size:16px">${s.title}</b><span class="badge ${s.urgency==='flash'?'amber':'green'}">${urg}</span>
      </div>
      <p class="muted tiny" style="margin-bottom:10px;line-height:1.5">${s.reason}</p>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">${s.bullets.map(b=>`<span class="chip">${I.check}${b}</span>`).join('')}</div>
      <button class="btn block" id="concBook">Book this in one tap ${I.arrow}</button>
    </div>`;
    $('#concBook',out).onclick=()=>{
      const d=newDraft(s.service);
      d.extras=s.extras;d.urgency=s.urgency;d.step=3;   // jump straight to the AI estimate
      state.draft=d;state.view='book';render();
    };
  }catch(e){out.innerHTML=`<div class="muted tiny">${e.message}</div>`;}
}

async function loadRecent(c){

/* ---------- LUMI Score ---------- */
function scoreColor(v){return v>=85?'var(--primary)':v>=70?'#3B9BE3':v>=50?'var(--warn)':'var(--danger)';}
function starRow(n){return `<span class="stars" style="color:var(--star)">${Array.from({length:5}).map((_,i)=>`<span style="${i<n?'':'opacity:.22'}">${I.star}</span>`).join('')}</span>`;}
function lumiScoreCard(score,pid){
  if(!score)return '';
  const col=scoreColor(score.overall);
  const deg=Math.round(score.overall*3.6);
  return `<div class="card pad" style="margin-bottom:20px">
    <div class="row" style="gap:20px;align-items:center;flex-wrap:wrap">
      <div style="width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(${col} ${deg}deg,var(--surface-2) 0)">
        <div style="width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center">
          <div><div style="font-size:30px;font-weight:800;letter-spacing:-.03em;color:${col};line-height:1">${score.overall}</div><div class="tiny muted" style="font-weight:700">LUMI Score</div></div>
        </div>
      </div>
      <div style="flex:1;min-width:220px">
        <div class="row" style="gap:8px;margin-bottom:4px"><h3>Home health</h3><span class="badge ${score.overall>=70?'green':score.overall>=50?'amber':'red'}">${score.grade}</span></div>
        <p class="muted tiny" style="margin-bottom:12px;line-height:1.5">A living rating of your home across cleaning, air, windows, upholstery and more. LUMI keeps it climbing.</p>
        ${score.focus?`<button class="btn sm" data-rec="${score.focus.book}">${I.spark} Raise your score — book ${score.focus.label.toLowerCase()}</button>`:`<span class="badge green">${I.check}Your home is in great shape</span>`}
      </div>
    </div>
    <div class="divider"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
      ${score.dims.map(d=>`<div class="row" style="justify-content:space-between"><span class="tiny" style="font-weight:600">${d.label}</span>${starRow(d.stars)}</div>`).join('')}
    </div>
  </div>`;
}

/* ---------- BOOKING WIZARD ---------- */
function newDraft(service,propertyId){
  const prop=propertyId?state.properties.find(p=>p.id===propertyId):(state.properties[0]||null);
  return {service:service||'standard',propertyId:prop?prop.id:null,rooms:prop?prop.rooms:2,baths:prop?prop.baths:1,area:prop?prop.area:0,extras:[],urgency:'scheduled',address:prop?prop.address:'',city:prop?prop.city:(state.user.city||'Warsaw'),notes:'',step:0,estimate:null};
}
function startBooking(service,propertyId,overrides){
  state.draft=Object.assign(newDraft(service,propertyId),overrides||{});
  state.view='book';render();
}
function viewBook(){
  if(!state.draft) state.draft=newDraft('standard');
  const d=state.draft;
  const c=el(`<div style="max-width:640px;margin:0 auto"></div>`);
  const steps=4;
  c.appendChild(el(`<div class="steps">${Array.from({length:steps}).map((_,i)=>`<div class="s ${i<=d.step?'done':''}"></div>`).join('')}</div>`));

  const body=el(`<div class="fadein"></div>`);
  c.appendChild(body);

  if(d.step===0){ // property + service + size
    const cat=state.catalog?.services||{};
    const props=state.properties||[];
    body.innerHTML=`<h2 style="margin-bottom:4px">What needs cleaning?</h2><p class="muted" style="margin-bottom:20px">Pick a home, a service and the size.</p>
      ${props.length?`<label class="field"><span>Home</span><select class="input" id="propSel">
        ${props.map(p=>`<option value="${p.id}" ${d.propertyId===p.id?'selected':''}>${p.label} · ${p.city}</option>`).join('')}
        <option value="" ${d.propertyId?'':'selected'}>Other address…</option>
      </select></label>`:''}
      <div class="opt-grid" id="svcOpts" style="margin:14px 0 22px"></div>
      <div class="card pad">
        <label class="field"><span>Bedrooms / rooms</span></label>
        <div class="stepper" data-k="rooms"><button data-d="-1">−</button><b>${d.rooms}</b><button data-d="1">+</button></div>
        <div style="height:14px"></div>
        <label class="field"><span>Bathrooms</span></label>
        <div class="stepper" data-k="baths"><button data-d="-1">−</button><b>${d.baths}</b><button data-d="1">+</button></div>
        <div style="height:14px"></div>
        <label class="field"><span>Approx. area (m²) — optional</span><input class="input" type="number" min="0" max="600" value="${d.area||''}" id="area" placeholder="e.g. 60"></label>
      </div>`;
    const propSel=$('#propSel',body);
    if(propSel)propSel.onchange=()=>{
      const p=props.find(x=>x.id===propSel.value);
      if(p){d.propertyId=p.id;d.rooms=p.rooms;d.baths=p.baths;d.area=p.area;d.address=p.address;d.city=p.city;}
      else{d.propertyId=null;}
      viewBook();
    };
    const so=$('#svcOpts',body);
    Object.entries(cat).forEach(([key,s])=>{
      const o=el(`<div class="opt ${d.service===key?'sel':''}"><div class="ico">${SVC_ICON[key]||I.broom}</div><h4>${s.label.replace(' Cleaning','')}</h4><small>from ${money(s.base)}</small></div>`);
      o.onclick=()=>{d.service=key;viewBook();};
      so.appendChild(o);
    });
    body.querySelectorAll('.stepper').forEach(st=>{
      const k=st.dataset.k;
      st.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
        d[k]=Math.max(k==='baths'?0:1,Math.min(12,d[k]+Number(btn.dataset.d)));viewBook();
      });
    });
    const area=$('#area',body); if(area) area.oninput=()=>{d.area=Number(area.value)||0;};
  }
  else if(d.step===1){ // extras
    const ex=state.catalog?.extras||{};
    body.innerHTML=`<h2 style="margin-bottom:4px">Add extras</h2><p class="muted" style="margin-bottom:20px">Optional deep-clean add-ons.</p><div class="extra-grid" id="exg"></div>`;
    const g=$('#exg',body);
    Object.entries(ex).forEach(([key,e])=>{
      const sel=d.extras.includes(key);
      const it=el(`<div class="extra ${sel?'sel':''}"><div class="cb">${sel?I.check:''}</div><div style="flex:1">${e.label}</div><span class="muted tiny">+${e.price}</span></div>`);
      it.onclick=()=>{d.extras=sel?d.extras.filter(x=>x!==key):[...d.extras,key];viewBook();};
      g.appendChild(it);
    });
  }
  else if(d.step===2){ // when + where
    body.innerHTML=`<h2 style="margin-bottom:4px">When & where?</h2><p class="muted" style="margin-bottom:20px">We'll match you with a nearby cleaner.</p>
      <div class="card pad">
        <label class="field"><span>Urgency</span></label>
        <div class="opt-grid" id="urg" style="margin-bottom:16px">
          ${urgOpt('scheduled','Scheduled',I.clock,'Pick a time')}
          ${urgOpt('today','Today',I.clock,'+15% fee')}
          ${urgOpt('flash','FlashClean',I.flash,'ASAP · +40%')}
        </div>
        <label class="field"><span>Address</span><input class="input" id="addr" value="${d.address}" placeholder="Street, building, apt"></label>
        <label class="field"><span>City</span><input class="input" id="city" value="${d.city}"></label>
        <label class="field"><span>Notes for the cleaner — optional</span><textarea class="input" id="notes" placeholder="Access code, pets, focus areas…">${d.notes}</textarea></label>
      </div>`;
    body.querySelectorAll('#urg .opt').forEach(o=>o.onclick=()=>{d.urgency=o.dataset.u;viewBook();});
    const bind=(id,k)=>{const e=$('#'+id,body);e.oninput=()=>d[k]=e.value;};
    bind('addr','address');bind('city','city');bind('notes','notes');
  }
  else if(d.step===3){ // AI estimate + confirm
    body.innerHTML=`<h2 style="margin-bottom:4px">Your AI estimate</h2><p class="muted" style="margin-bottom:20px">Fair price, calculated instantly.</p>
      <div id="estBox"><div class="card pad"><div class="sk" style="height:120px"></div></div></div>`;
    computeEstimate(body);
  }

  // nav buttons
  const nav=el(`<div class="row" style="margin-top:22px;gap:12px">
    ${d.step>0?`<button class="btn ghost" id="back">Back</button>`:''}
    <div class="spacer" style="flex:1"></div>
    ${d.step<3?`<button class="btn" id="next">Continue ${I.arrow}</button>`:`<button class="btn" id="confirm">Confirm booking ${I.check}</button>`}
  </div>`);
  c.appendChild(nav);
  const back=$('#back',nav); if(back)back.onclick=()=>{d.step--;viewBook();};
  const next=$('#next',nav); if(next)next.onclick=()=>{
    if(d.step===2 && !d.address.trim()){toast('Please enter an address',true);return;}
    d.step++;viewBook();
  };
  const conf=$('#confirm',nav); if(conf)conf.onclick=confirmBooking;

  shell(c);
}
function urgOpt(v,t,ico,sub){const d=state.draft;return `<div class="opt ${d.urgency===v?'sel':''}" data-u="${v}"><div class="ico">${ico}</div><h4>${t}</h4><small>${sub}</small></div>`;}

  const d=state.draft;

    const b=estimate.breakdown;
    $('#estBox',body).innerHTML=`

        <div class="aiband" style="margin-top:16px;justify-content:center">${I.ai}<span>AI estimate · ~${estimate.durationHours}h · ${b.surge>0?`+${b.surge}% live demand`:'standard demand'}</span></div>
      </div>
      <div class="card pad">
        <div class="brk"><span>Base service</span><b>${money(b.base)}</b></div>
        <div class="brk"><span>Rooms</span><b>${money(b.rooms)}</b></div>
        ${b.baths?`<div class="brk"><span>Bathrooms</span><b>${money(b.baths)}</b></div>`:''}
        ${b.area?`<div class="brk"><span>Area</span><b>${money(b.area)}</b></div>`:''}
        ${b.extras?`<div class="brk"><span>Extras (${d.extras.length})</span><b>${money(b.extras)}</b></div>`:''}
        ${b.urgencyMult>1?`<div class="brk"><span>Urgency</span><b>×${b.urgencyMult}</b></div>`:''}
        <div class="divider"></div>
        <div class="brk" style="font-size:17px"><span style="color:var(--ink);font-weight:700">Total</span><b style="color:var(--primary-600)">${money(estimate.total)}</b></div>
      </div>
      <div class="row" style="margin-top:14px;gap:10px;flex-wrap:wrap">

function uploadPhoto(id,phase){
  const inp=el('<input type="file" accept="image/*" capture="environment" style="display:none">');
  document.body.appendChild(inp);
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file){inp.remove();return;}
    try{
      const dataUrl=await downscale(file,900,0.7);
      await api('/api/bookings/'+id+'/photos','POST',{phase,photo:dataUrl});
      toast('Photo uploaded');renderBookingDetail(id);
    }catch(e){toast(e.message||'Upload failed',true);}
    inp.remove();
  };
  inp.click();
}
function downscale(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bad image'));};
    img.src=url;
  });
}

      state.user=user;
      state.view=user.role==='admin'?'admin':user.role==='cleaner'?'jobs':'home';
      if(user.role==='customer') await loadProperties();
    }catch{ state.token=null;localStorage.removeItem('cg_token'); }
  }
  render();
}
boot();
</script>
</body>
</html>
