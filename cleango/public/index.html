<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0E14" />
<title>LUMI — операционная система для вашего дома</title>
<style>
/* Design tokens — exact values from 09_UI_DESIGN_SYSTEM.md (single source in design/tokens.css). */
:root{
  /* colour — light theme */
  --primary:#14C871; --primary-600:#0EA85E; --primary-050:#E8F9F0;
  --success:#16A765; --info:#3B82F6;
  --ink:#111613; --ink-2:#5C665F; --ink-3:#8B948E;
  --bg:#F8FAF9; --surface:#FFFFFF; --surface-2:#EFF3F1;
  --line:#E5EAE7; --line-strong:#CDD4D0;
  --danger:#E5484D; --warn:#F2A93B; --star:#FFB020;
  --flash:#B9FF66;                                   /* FlashClean electric accent */
  --grad-hero:linear-gradient(135deg,#14C871,#56E39F); /* hero/premium/AI only */
  /* radii (§9) */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-xxl:28px;
  --radius:16px; --radius-sm:12px; --radius-lg:28px;
  /* elevation (§10) */
  --shadow:0 2px 8px rgba(17,22,19,.06);
  --shadow-lg:0 16px 40px rgba(17,22,19,.14);
  /* motion (§39) */
  --dur-fast:120ms; --dur-std:220ms; --dur-slow:360ms; --dur-hero:480ms;
  --ease:cubic-bezier(.2,.7,.3,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sp:8px;
}
:root[data-theme="dark"]{
  --primary:#28D985; --primary-600:#20BD72; --primary-050:#173B2A;
  --success:#34D399; --info:#60A5FA;
  --ink:#F4F7F5; --ink-2:#AAB4AE; --ink-3:#7B857F;
  --bg:#0C100E; --surface:#181F1B; --surface-2:#121714;
  --line:#26302A; --line-strong:#37433C;
  --danger:#F06A6E; --warn:#F5B94C;
  /* dark uses tonal elevation + borders more than shadows (§10) */
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.4);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;font-weight:700}
p{margin:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- App shell ---------- */
.app{max-width:1180px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;backdrop-filter:saturate(180%) blur(20px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:12px 20px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand .logo{width:34px;height:34px;flex:none}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{
  padding:8px 14px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:14.5px;
  display:flex;align-items:center;gap:7px;transition:.15s;
}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--primary);color:#fff}
.nav button.active svg{color:#fff}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2)}
.iconbtn:hover{color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px}
.main{flex:1;padding:24px 20px 80px}

/* ---------- Bottom nav (mobile) ---------- */
.tabbar{display:none}
@media(max-width:760px){
  .nav{display:none}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(20px);
    border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-around;
  }
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;padding:4px}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button.active{color:var(--primary)}
  .main{padding:16px 14px 96px}
  .topbar{padding:12px 14px}
}

/* ---------- Cards & primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.hint{color:var(--ink-3);font-size:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;font-weight:700;font-size:15.5px;
  padding:14px 20px;border-radius:14px;transition:.15s;box-shadow:0 6px 18px rgba(20,200,113,.28);
}
.btn:hover{background:var(--primary-600);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--danger);box-shadow:0 6px 18px rgba(240,68,56,.28)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700}
.badge.green{background:var(--primary-050);color:var(--primary-600)}
.badge.blue{background:#E8F0FE;color:#1A73E8}
.badge.amber{background:#FEF3E2;color:#B25E09}
.badge.grey{background:var(--surface-2);color:var(--ink-2)}
.badge.red{background:#FEECEB;color:#C4342A}
:root[data-theme="dark"] .badge.blue{background:#12233F;color:#7DA9F5}
:root[data-theme="dark"] .badge.amber{background:#2E2410;color:#E9A94B}
:root[data-theme="dark"] .badge.red{background:#2E1512;color:#F08A82}
label.field{display:block;margin-bottom:14px}
label.field span{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input,select.input,textarea.input{
  width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface);transition:.15s;outline:none;
}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-050)}
textarea.input{resize:vertical;min-height:80px}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1200px 600px at 80% -10%,var(--primary-050),transparent),var(--bg)}
.auth{width:100%;max-width:420px}
.auth .card{padding:28px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;margin-bottom:18px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--ink-2);font-size:14px}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- Hero / home ---------- */
.hero{
  border-radius:var(--radius-lg);padding:32px;color:#fff;position:relative;overflow:hidden;
  background:var(--grad-hero);
  box-shadow:0 24px 60px rgba(20,200,113,.35);
}
.hero h1{font-size:30px;line-height:1.1;max-width:520px}
.hero p{opacity:.92;margin-top:10px;max-width:460px;font-size:15px}
.hero .sparkle{position:absolute;right:-30px;top:-30px;width:220px;height:220px;opacity:.28}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.svc{padding:18px;cursor:pointer;transition:.15s;border:1.5px solid var(--line)}
.svc:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.svc .ico{width:46px;height:46px;border-radius:13px;background:var(--primary-050);display:grid;place-items:center;color:var(--primary-600);margin-bottom:12px}
.svc h4{font-size:15.5px}
.svc .from{color:var(--ink-3);font-size:13px;margin-top:3px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;letter-spacing:-.03em}

/* ---------- Booking wizard ---------- */
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps .s{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps .s.done{background:var(--primary)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.opt{padding:16px;border:1.5px solid var(--line);border-radius:15px;cursor:pointer;transition:.15s;text-align:center}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-050)}
.opt .ico{width:40px;height:40px;margin:0 auto 8px;color:var(--primary-600)}
.opt h4{font-size:14.5px}
.opt small{color:var(--ink-3)}
.stepper{display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:13px;padding:6px}
.stepper button{width:40px;height:40px;border-radius:10px;background:var(--surface);font-size:22px;font-weight:600;box-shadow:var(--shadow);display:grid;place-items:center}
.stepper b{flex:1;text-align:center;font-size:18px}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.extra{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s;font-size:14px;font-weight:600}
.extra.sel{border-color:var(--primary);background:var(--primary-050)}
.extra .cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.extra.sel .cb{background:var(--primary);border-color:var(--primary);color:#fff}

/* estimate */
.est{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1.5px solid var(--line)}
.est .big{font-size:40px;font-weight:800;letter-spacing:-.03em}
.est .rng{color:var(--ink-3);font-size:13.5px}
.brk{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.brk span:first-child{color:var(--ink-2)}
.aiband{display:flex;gap:10px;align-items:center;background:var(--primary-050);border-radius:13px;padding:12px 14px;color:var(--primary-600);font-weight:600;font-size:13.5px}
/* Default size for inline icons rendered as raw SVG inside text/controls */
.btn svg,.chip svg,.badge svg,.aiband svg,.section-title svg,.bk .muted svg,.hero .badge svg,.est svg{width:17px;height:17px;flex:none}
.aiband svg{width:20px;height:20px}
.modal .row svg,.est svg,.stat b svg{width:17px;height:17px;flex:none}
/* Trailing chevrons that sit as direct flex children (would otherwise stretch) */
.bk > svg{width:22px;height:22px;flex:none;color:var(--ink-3)}
.card.pad > svg{width:22px;height:22px;flex:none}

/* ---------- Booking list & detail ---------- */
.bk{padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
.bk:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.bk .thumb{width:52px;height:52px;border-radius:14px;background:var(--primary-050);display:grid;place-items:center;color:var(--primary-600);flex:none}
.bk .meta{flex:1;min-width:0}
.bk .meta h4{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .price{text-align:right;font-weight:800;font-size:16px}
.timeline{position:relative;padding-left:26px}
.timeline .ev{position:relative;padding-bottom:18px}
.timeline .ev::before{content:"";position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-050)}
.timeline .ev::after{content:"";position:absolute;left:-17px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.timeline .ev:last-child::after{display:none}
.timeline .ev.pending::before{background:var(--line);box-shadow:0 0 0 4px var(--surface-2)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.uploadbox{border:2px dashed var(--line);border-radius:15px;padding:20px;text-align:center;cursor:pointer;transition:.15s;color:var(--ink-2)}
.uploadbox:hover{border-color:var(--primary);color:var(--primary-600)}

/* chat */
.chat{display:flex;flex-direction:column;height:420px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.4}
.msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-3);font-size:12.5px;font-weight:600}
.msg .who{font-size:11px;opacity:.7;margin-bottom:2px;font-weight:700}
.msg img{display:block;max-width:200px;border-radius:10px;margin-top:2px}
.msg .tick{font-size:11px;opacity:.85;margin-left:6px;font-weight:700;letter-spacing:-1px}
.msg .tick.read{color:#7cc0ff}
.msg .tr{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:13px;opacity:.9}
.msg .trbtn{font-size:11px;font-weight:700;color:var(--primary-600);cursor:pointer;margin-top:4px;display:inline-block}
.msg.me .trbtn{color:rgba(255,255,255,.9)}
.typing{align-self:flex-start;font-size:12.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:5px;padding:2px 4px}
.typing .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-3);animation:tblink 1.2s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes tblink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.locbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--primary-050);color:var(--primary-600);font-weight:700;font-size:13.5px;border-bottom:1px solid var(--line)}
.locbar .eta{margin-left:auto;background:var(--primary);color:#fff;padding:3px 10px;border-radius:20px;font-size:12px}
.chatbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chatbar .attach{display:grid;place-items:center;width:40px;flex:none;background:var(--surface-2);border-radius:12px;cursor:pointer}

/* stars */
.stars{display:inline-flex;gap:3px;color:var(--star)}
.stars svg{width:18px;height:18px}
.starpick span{display:inline-grid;place-items:center}
.starpick svg{width:28px;height:28px;cursor:pointer;color:var(--line);flex:none}
.starpick span.on svg{color:var(--star)}

/* admin table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.kpi b{font-size:28px;letter-spacing:-.03em;display:block}
.kpi .lab{color:var(--ink-2);font-size:13px;margin-top:2px}
.kpi .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(120px);z-index:200;
  background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-weight:600;font-size:14px;
  box-shadow:var(--shadow-lg);transition:.35s cubic-bezier(.2,.9,.3,1);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger);color:#fff}
.modal-bg{position:fixed;inset:0;z-index:150;background:rgba(11,18,32,.5);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:460px;transform:translateY(20px) scale(.98);transition:.2s}
.modal-bg.show .modal{transform:none}

.empty{text-align:center;padding:48px 20px;color:var(--ink-3)}
.empty svg{width:60px;height:60px;margin-bottom:14px;opacity:.5}
.sk{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.fadein{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-size:20px;margin:4px 0 16px;display:flex;align-items:center;gap:10px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 rgba(20,200,113,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px rgba(20,200,113,0)}100%{box-shadow:0 0 0 0 rgba(20,200,113,0)}}

/* ===================== ANIMATIONS & BRAND ===================== */
:root{--gold:#E9C46A;--gold-2:#C9A24B;--gold-3:#B8862F;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* staggered entrance for lists/cards */
.reveal{opacity:0;animation:revealUp .55s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes revealUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.view-enter{animation:viewIn .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* animated brand hero */
.hero{background-size:180% 180%;animation:heroShift 12s ease infinite}
@keyframes heroShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.hero .sparkle{animation:floatY 6s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(8deg)}}
.hero h1{animation:revealUp .6s both}
.hero p{animation:revealUp .6s .08s both}
.hero .btn,.hero .badge{animation:revealUp .6s .16s both}
.logo{filter:drop-shadow(0 2px 8px rgba(201,162,75,.35))}
.brand .logo{animation:logoPop .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes logoPop{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:none}}
.logo .spk{transform-origin:center;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.75;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}

/* buttons: shine + press */
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:none}
.btn:hover::after{animation:shine .8s ease}
@keyframes shine{to{transform:translateX(120%)}}
.btn:active{transform:scale(.97)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}

/* cards hover pop already exist; add sheen on service cards */
.svc{transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,border-color .18s}
.svc .ico{transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.svc:hover .ico{transform:translateY(-2px) scale(1.08) rotate(-4deg)}
.bk,.opt,.extra{transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s,border-color .16s,background .16s}
.opt.sel{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.extra.sel .cb{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.badge.green,.chip{transition:transform .15s}
.tabbar button.active svg{animation:tabPop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes tabPop{0%{transform:scale(.8) translateY(2px)}100%{transform:none}}

/* score ring draw */
.score-ring{position:relative}
.score-ring .ring-num{animation:revealUp .5s .2s both}

/* status dots (in progress) */
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:dotb 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dotb{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

/* modal spring */
.modal-bg.show .modal{animation:modalIn .32s cubic-bezier(.2,1.2,.35,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}

/* toast */
.toast{animation:none}
.toast.show{animation:toastIn .4s cubic-bezier(.2,1.3,.4,1)}
@keyframes toastIn{from{transform:translateX(-50%) translateY(120px)}to{transform:translateX(-50%) translateY(0)}}

/* colorful service icons (brand icon set) */
.svc .ico.c-cleaning{background:linear-gradient(135deg,#D9FBEE,#B7F5DF);color:#0F9E6E}
.svc .ico.c-windows{background:linear-gradient(135deg,#E1EEFF,#CFE2FF);color:#2C7BE5}
.svc .ico.c-sofa{background:linear-gradient(135deg,#FFE3F1,#FCD3E8);color:#DB4C9B}
.svc .ico.c-laundry{background:linear-gradient(135deg,#DDF7F0,#C7F0E6);color:#12B5A0}
.svc .ico.c-ironing{background:linear-gradient(135deg,#FFEDD9,#FFDFBF);color:#E7822B}
.svc .ico.c-plumbing{background:linear-gradient(135deg,#DBF3FF,#C4EBFF);color:#1AA5D8}
.svc .ico.c-electrical{background:linear-gradient(135deg,#FFF4D6,#FFE9AE);color:#D9A400}
.svc .ico.c-assembly{background:linear-gradient(135deg,#ECE6FF,#DCD1FF);color:#7A5AF0}
.svc .ico.c-garden{background:linear-gradient(135deg,#E4F7D9,#D0F0BE);color:#4F9E2E}
.svc .ico.c-painting{background:linear-gradient(135deg,#EBE1FF,#E7D6FF);color:#8A50E0}
:root[data-theme="dark"] .svc .ico{filter:saturate(1.1) brightness(1.05)}

/* notifications */
.notif-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);animation:pop .3s cubic-bezier(.2,1.5,.4,1)}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;cursor:pointer;transition:background .15s}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:var(--primary-050)}
.notif .ni{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.notif .ni.operational{background:var(--primary-050);color:var(--primary-600)}
.notif .ni.account{background:#E8F0FE;color:#1A73E8}
.notif .ni.smart_home{background:#F0EAFF;color:#7A5AF0}
.notif .ni.marketing{background:#FEF3E2;color:#B25E09}
.notif .ni svg{width:19px;height:19px}
</style>

/* ---------- Animation helpers ---------- */
function stagger(container){ if(!container)return; container.querySelectorAll(':scope > *').forEach((el,i)=>{el.classList.add('reveal');el.style.setProperty('--i',i);}); }
function rippleFx(e){ const b=e.currentTarget; const r=document.createElement('span'); const d=Math.max(b.offsetWidth,b.offsetHeight); const rect=b.getBoundingClientRect(); r.className='ripple'; r.style.width=r.style.height=d+'px'; r.style.left=(e.clientX-rect.left-d/2)+'px'; r.style.top=(e.clientY-rect.top-d/2)+'px'; b.appendChild(r); setTimeout(()=>r.remove(),600); }
document.addEventListener('click',(e)=>{const b=e.target.closest('.btn');if(b&&!b.disabled)rippleFx.call(null,{currentTarget:b,clientX:e.clientX,clientY:e.clientY});},true);
function confetti(){ const cols=['#E9C46A','#14C871','#2C7BE5','#DB4C9B','#7A5AF0','#12B5A0']; const wrap=el('<div class="confetti"></div>'); for(let i=0;i<80;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'vw'; p.style.background=cols[i%cols.length]; p.style.animationDuration=(1.6+Math.random()*1.6)+'s'; p.style.animationDelay=(Math.random()*.3)+'s'; p.style.transform='rotate('+(Math.random()*360)+'deg)'; wrap.appendChild(p);} document.body.appendChild(wrap); setTimeout(()=>wrap.remove(),3400); }
function countUp(node,to,dur=900){ if(!node)return; const start=performance.now(); const from=0; function tick(t){ const k=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-k,3); node.textContent=Math.round(from+(to-from)*e); if(k<1)requestAnimationFrame(tick);} requestAnimationFrame(tick); }
function animateRing(node,to,col){ if(!node)return; const start=performance.now(),dur=1000; function tick(t){ const k=Math.min(1,(t-start)/dur); const e=1-Math.pow(1-k,3); const deg=Math.round(to*3.6*e); node.style.background=`conic-gradient(${col} ${deg}deg, var(--surface-2) 0)`; if(k<1)requestAnimationFrame(tick);} requestAnimationFrame(tick); }

/* ---------- Utilities ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const el = (html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild};
const money = (n)=>`${Math.round(n)} zł`;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast show'+(err?' err':'');setTimeout(()=>t.className='toast',2600);}
function plural(n,one,few,many){const m=n%10,h=n%100;return h>=11&&h<=14?many:m===1?one:m>=2&&m<=4?few:many;}
function timeAgo(ts){const s=(Date.now()-ts)/1000;if(s<60)return'только что';if(s<3600){const m=Math.floor(s/60);return m+' '+plural(m,'мин','мин','мин')+' назад';}if(s<86400){const h=Math.floor(s/3600);return h+' '+plural(h,'час','часа','часов')+' назад';}const d=Math.floor(s/86400);return d+' '+plural(d,'день','дня','дней')+' назад';}
function fmtTime(ts){return new Date(ts).toLocaleString('ru-RU',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});}
function fmtDate(ts){return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function roomsWord(n){return n+' '+plural(n,'комната','комнаты','комнат');}
function bathsWord(n){return n+' '+plural(n,'санузел','санузла','санузлов');}

async function api(path,method='GET',body){
  const h={'Content-Type':'application/json'};
  if(state.token) h['Authorization']='Bearer '+state.token;
  const r=await fetch(API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||'Something went wrong');
  return data;
}

/* ---------- Theme ---------- */
function initTheme(){
  const saved=localStorage.getItem('cg_theme');
  const dark=saved?saved==='dark':window.matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
}
function toggleTheme(){
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  localStorage.setItem('cg_theme',d?'light':'dark');
  render();
}
const isDark=()=>document.documentElement.dataset.theme==='dark';

        <form id="authForm">

          <label class="field"><span>Я хочу</span>
            <div class="seg" style="margin:0">
              <button type="button" data-r="customer" class="${role==='customer'?'active':''}">Заказывать услуги</button>
              <button type="button" data-r="cleaner" class="${role==='cleaner'?'active':''}">Работать исполнителем</button>
            </div>
          </label>
          <label class="field"><span>Имя и фамилия</span><input class="input" name="name" placeholder="Анна Ковальская" required></label>
          <label class="field"><span>Город</span><select class="input" name="city">${state.cities.map(c=>`<option>${c}</option>`).join('')||'<option>Warsaw</option>'}</select></label>`:''}
          <label class="field"><span>Email</span><input class="input" type="email" name="email" placeholder="you@example.com" required></label>
          <label class="field"><span>Пароль</span><input class="input" type="password" name="password" placeholder="минимум 12 символов" minlength="${mode==='register'?12:1}" required>${mode==='register'?'<span class="hint" style="margin-top:6px;display:block">Не меньше 12 символов. Можно фразу — так надёжнее.</span>':''}</label>
          <button class="btn block" type="submit">${mode==='login'?'Войти':'Создать аккаунт'} ${I.arrow}</button>
        </form>
        <div class="divider"></div>
        <p class="hint" style="text-align:center">Демо: <b>anna@example.com</b> (LUMI+) · <b>piotr@example.com</b> · <b>admin@cleango.app</b> — пароль <b>cleango123</b></p>
      </div>`;
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;draw();});
    $('#authForm',box).onsubmit=async(e)=>{
      e.preventDefault();
      const f=new FormData(e.target);
      const btn=e.target.querySelector('button[type=submit]');
      btn.disabled=true;btn.textContent='Подождите…';
      try{
        const payload=Object.fromEntries(f);
        if(mode==='register')payload.role=role;
        const res=await api(mode==='login'?'/api/login':'/api/register','POST',payload);
        state.token=res.token;state.user=res.user;
        localStorage.setItem('cg_token',res.token);
        state.view=res.user.role==='admin'?'admin':res.user.role==='cleaner'?'jobs':'home';
        await loadCatalog();
        if(res.user.role==='customer') await loadProperties();
        render();
        toast(`Добро пожаловать, ${res.user.name.split(' ')[0]}!`);
      }catch(err){toast(err.message,true);btn.disabled=false;draw();}
    };
  }
  draw();
  root.appendChild(wrap);
}

/* ---------- Notifications ---------- */
async function loadNotifBadge(){
  try{
    const {unreadCount}=await api('/api/notifications');
    const badge=$('#bellBadge');
    if(badge){ badge.textContent=unreadCount>9?'9+':unreadCount; badge.style.display=unreadCount?'grid':'none'; }
  }catch{}
}
const NOTIF_ICON={operational:I.book,account:I.check,smart_home:I.smart,marketing:I.spark};
function notifDeepLink(link){
  closeModal();
  const m=/^lumi:\/\/(.+)$/.exec(link||''); if(!m)return;
  const [seg,arg]=m[1].split('/');
  if(seg==='booking'&&arg){openBooking(arg);}
  else if(seg==='smart-home'){if(arg)state.activeProperty=arg;state.view='smart';render();}
  else if(seg==='provider'){/* offer */ const id=link.split('/').pop(); openBooking(id);}
  else if(seg==='wallet'){state.view='wallet';render();}
  else if(seg==='premium'){state.view='premium';render();}
  else if(seg==='profile'){openProfile();}
  else {state.view='home';render();}
}
async function openNotifications(){
  showModal(`<div class="card pad" style="max-height:80vh;overflow-y:auto"><div class="sk" style="height:120px"></div></div>`);
  try{
    const {notifications:list}=await api('/api/notifications');
    const box=$('.modal .card');
    if(!list.length){box.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><h3>Уведомления</h3></div>${emptyState('Пока пусто','Здесь появятся события по вашим заказам.').outerHTML}`;return;}
    // group by day
    const groups={};
    list.forEach(n=>{const d=new Date(n.createdAt);const key=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});(groups[key]=groups[key]||[]).push(n);});
    box.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:14px"><h3>Уведомления</h3><button class="btn ghost sm" id="readAll">Прочитать все</button></div>
      ${Object.entries(groups).map(([day,ns])=>`<div class="tiny muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 8px">${day}</div>
        ${ns.map(n=>`<div class="notif ${n.read?'':'unread'}" data-link="${n.deepLink}" data-id="${n.id}">
          <div class="ni ${n.category}">${NOTIF_ICON[n.category]||I.bell}</div>
          <div style="flex:1;min-width:0"><b style="font-size:14.5px">${n.title}</b><div class="muted tiny" style="margin-top:2px">${n.body}</div><div class="hint tiny" style="margin-top:3px">${timeAgo(n.createdAt)}</div></div>
          ${n.read?'':'<span class="pulse" style="align-self:center"></span>'}
        </div>`).join('')}`).join('')}`;
    box.querySelectorAll('.notif').forEach(el=>el.onclick=async()=>{
      try{await api('/api/notifications/'+el.dataset.id+'/read','POST',{});}catch{}
      notifDeepLink(el.dataset.link);
    });
    $('#readAll',box).onclick=async()=>{try{await api('/api/notifications/read-all','POST',{});openNotifications();loadNotifBadge();}catch(e){toast(e.message,true);}};
  }catch(e){toast(e.message,true);closeModal();}
}
function openNotifPrefs(){

async function runConcierge(conc){

  out.innerHTML=`<div class="sk" style="height:70px"></div>`;
  try{
    const {suggestion:s}=await api('/api/concierge','POST',{text});
    const urg={scheduled:'По расписанию',today:'Сегодня',flash:'FlashClean · срочно'}[s.urgency];
    out.innerHTML=`<div class="card pad reveal" style="background:var(--surface-2)">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <b style="font-size:16px">${s.title}</b><span class="badge ${s.urgency==='flash'?'amber':'green'}">${urg}</span>
      </div>
      <p class="muted tiny" style="margin-bottom:10px;line-height:1.5">${s.reason}</p>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:14px">${s.bullets.map(b=>`<span class="chip">${I.check}${SVC_LABEL_RU[b]||EXTRA_RU[b]||b}</span>`).join('')}</div>
      <button class="btn block" id="concBook">Заказать в один тап ${I.arrow}</button>
    </div>`;
    $('#concBook',out).onclick=()=>{
      const d=newDraft(s.service);
      d.extras=s.extras;d.urgency=s.urgency;d.step=3;   // jump straight to the AI estimate
      state.draft=d;state.view='book';render();
    };
  }catch(e){out.innerHTML=`<div class="muted tiny">${e.message}</div>`;}

/* ---------- LUMI Score ---------- */
function scoreColor(v){return v>=85?'var(--primary)':v>=70?'#3B9BE3':v>=50?'var(--warn)':'var(--danger)';}
function starRow(n){return `<span class="stars" style="color:var(--star)">${Array.from({length:5}).map((_,i)=>`<span style="${i<n?'':'opacity:.22'}">${I.star}</span>`).join('')}</span>`;}
function recTextRu(r,TASK_RU){
  const label=TASK_RU[r.label]||r.label;
  const over=/(\d+)\s+days overdue/.exec(r.text);
  if(over){const n=+over[1];return `«${label}» просрочено на ${n} ${plural(n,'день','дня','дней')} — закажите, чтобы дом оставался свежим.`;}
  const due=/due in (\d+)\s+day/.exec(r.text);
  if(due){const n=+due[1];return `«${label}» нужно через ${n} ${plural(n,'день','дня','дней')}.`;}
  return label;
}
const GRADE_RU={Excellent:'Отлично',Great:'Хорошо',Fair:'Нормально','Needs care':'Требует ухода'};
const DIM_RU={Cleanliness:'Чистота','Air & freshness':'Воздух и свежесть',Windows:'Окна',Mattresses:'Матрасы',Upholstery:'Мебель',Garden:'Сад'};
function lumiScoreCard(score,pid){
  if(!score)return '';
  const col=scoreColor(score.overall);
  return `<div class="card pad reveal" style="margin-bottom:20px">
    <div class="row" style="gap:20px;align-items:center;flex-wrap:wrap">
      <div class="score-ring" id="scoreRing" data-score="${score.overall}" data-col="${col}" style="width:112px;height:112px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(${col} 0deg,var(--surface-2) 0)">
        <div style="width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center">
          <div><div class="ring-num" id="scoreNum" style="font-size:30px;font-weight:800;letter-spacing:-.03em;color:${col};line-height:1">0</div><div class="tiny muted" style="font-weight:700">LUMI Score</div></div>
        </div>
      </div>
      <div style="flex:1;min-width:220px">
        <div class="row" style="gap:8px;margin-bottom:4px"><h3>Здоровье дома</h3><span class="badge ${score.overall>=70?'green':score.overall>=50?'amber':'red'}">${GRADE_RU[score.grade]||score.grade}</span></div>
        <p class="muted tiny" style="margin-bottom:12px;line-height:1.5">Живой рейтинг вашего дома по уборке, воздуху, окнам, мебели и не только. LUMI держит его высоким.</p>
        ${score.focus?`<button class="btn sm" data-rec="${score.focus.book}">${I.spark} Поднять рейтинг — заказать «${(DIM_RU[score.focus.label]||score.focus.label).toLowerCase()}»</button>`:`<span class="badge green">${I.check}Ваш дом в отличной форме</span>`}
      </div>
    </div>
    <div class="divider"></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px">
      ${score.dims.map(d=>`<div class="row" style="justify-content:space-between"><span class="tiny" style="font-weight:600">${DIM_RU[d.label]||d.label}</span>${starRow(d.stars)}</div>`).join('')}
    </div>
  </div>`;
}

function passportSearch(q,timeline){
  const t=(q||'').toLowerCase();
  if(!t.trim())return 'Задайте вопрос об истории дома.';
  const totalMatch=/потрат|сколько|стоим|расход/.test(t);
  if(totalMatch){const sum=timeline.reduce((s,e)=>s+e.price,0);return `Всего на обслуживание этого дома потрачено <b>${money(sum)}</b> за ${timeline.length} ${plural(timeline.length,'услугу','услуги','услуг')}.`;}
  const keymap=[['окн','windows'],['окон','windows'],['окна','windows'],['генеральн','deep'],['глубок','deep'],['обычн','standard'],['стандарт','standard'],['диван','deep'],['матрас','deep'],['переезд','moveout'],['офис','office']];
  let svc=null; for(const [k,s] of keymap){ if(t.includes(k)){svc=s;break;} }
  const items=svc?timeline.filter(e=>e.service===svc):timeline;
  if(!items.length)return svc?`По этой услуге пока нет записей в истории.`:`Ничего не найдено. Попробуйте: «когда мыли окна?».`;
  const last=items[0];
  const list=items.slice(0,4).map(e=>`${fmtDate(e.at)} — ${svcLabelRu(e.serviceLabel)}${e.provider?` (${e.provider})`:''} · ${money(e.price)}`).join('<br>');
  return `Последняя запись: <b>${svcLabelRu(last.serviceLabel)}</b> — ${fmtDate(last.at)}.<br><br>${list}`;
}
function openSaleReport(P){
  const p=P.property;
  const lines=P.timeline.slice(0,8).map(e=>`• ${fmtDate(e.at)} — ${svcLabelRu(e.serviceLabel)} (${money(e.price)})`).join('\n');
  const inner=el(`<div class="card pad">

      <b>Последние работы:</b><br>${lines.replace(/\n/g,'<br>')||'—'}
      <br><br><span class="muted tiny">Каждая запись подтверждена фото «до/после» на платформе LUMI.</span>
    </div>

  $('#copyRep',inner).onclick=()=>{

/* ---------- BOOKING WIZARD ---------- */
function newDraft(service,propertyId){
  const prop=propertyId?state.properties.find(p=>p.id===propertyId):(state.properties[0]||null);
  return {service:service||'standard',propertyId:prop?prop.id:null,rooms:prop?prop.rooms:2,baths:prop?prop.baths:1,area:prop?prop.area:0,extras:[],urgency:'scheduled',address:prop?prop.address:'',city:prop?prop.city:(state.user.city||'Warsaw'),notes:'',step:0,estimate:null};
}
function startBooking(service,propertyId,overrides){
  state.draft=Object.assign(newDraft(service,propertyId),overrides||{});
  state.view='book';render();
}
function viewBook(){
  if(!state.draft) state.draft=newDraft('standard');
  const d=state.draft;
  const c=el(`<div style="max-width:640px;margin:0 auto"></div>`);
  const steps=4;
  c.appendChild(el(`<div class="steps">${Array.from({length:steps}).map((_,i)=>`<div class="s ${i<=d.step?'done':''}"></div>`).join('')}</div>`));

  const body=el(`<div class="fadein"></div>`);
  c.appendChild(body);

  if(d.step===0){ // property + service + size
    const cat=state.catalog?.services||{};
    const props=state.properties||[];
    body.innerHTML=`<h2 style="margin-bottom:4px">Что нужно убрать?</h2><p class="muted" style="margin-bottom:20px">Выберите дом, услугу и размер.</p>
      ${props.length?`<label class="field"><span>Дом</span><select class="input" id="propSel">
        ${props.map(p=>`<option value="${p.id}" ${d.propertyId===p.id?'selected':''}>${p.label} · ${p.city}</option>`).join('')}
        <option value="" ${d.propertyId?'':'selected'}>Другой адрес…</option>
      </select></label>`:''}
      <div class="opt-grid" id="svcOpts" style="margin:14px 0 22px"></div>
      <div class="card pad">
        <label class="field"><span>Комнаты</span></label>
        <div class="stepper" data-k="rooms"><button data-d="-1">−</button><b>${d.rooms}</b><button data-d="1">+</button></div>
        <div style="height:14px"></div>
        <label class="field"><span>Санузлы</span></label>
        <div class="stepper" data-k="baths"><button data-d="-1">−</button><b>${d.baths}</b><button data-d="1">+</button></div>
        <div style="height:14px"></div>
        <label class="field"><span>Примерная площадь (м²) — необязательно</span><input class="input" type="number" min="0" max="600" value="${d.area||''}" id="area" placeholder="напр. 60"></label>
      </div>`;
    const propSel=$('#propSel',body);
    if(propSel)propSel.onchange=()=>{
      const p=props.find(x=>x.id===propSel.value);
      if(p){d.propertyId=p.id;d.rooms=p.rooms;d.baths=p.baths;d.area=p.area;d.address=p.address;d.city=p.city;}
      else{d.propertyId=null;}
      viewBook();
    };
    const so=$('#svcOpts',body);
    Object.entries(cat).forEach(([key,s])=>{
      const o=el(`<div class="opt ${d.service===key?'sel':''}"><div class="ico">${SVC_ICON[key]||I.broom}</div><h4>${SVC_SHORT_RU[key]||s.label}</h4><small>от ${money(s.base)}</small></div>`);
      o.onclick=()=>{d.service=key;viewBook();};
      so.appendChild(o);
    });
    body.querySelectorAll('.stepper').forEach(st=>{
      const k=st.dataset.k;
      st.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
        d[k]=Math.max(k==='baths'?0:1,Math.min(12,d[k]+Number(btn.dataset.d)));viewBook();
      });
    });
    const area=$('#area',body); if(area) area.oninput=()=>{d.area=Number(area.value)||0;};
  }
  else if(d.step===1){ // extras
    const ex=state.catalog?.extras||{};
    body.innerHTML=`<h2 style="margin-bottom:4px">Дополнительно</h2><p class="muted" style="margin-bottom:20px">Дополнительные опции — по желанию.</p><div class="extra-grid" id="exg"></div>`;
    const g=$('#exg',body);
    Object.entries(ex).forEach(([key,e])=>{
      const sel=d.extras.includes(key);
      const it=el(`<div class="extra ${sel?'sel':''}"><div class="cb">${sel?I.check:''}</div><div style="flex:1">${EXTRA_RU[e.label]||e.label}</div><span class="muted tiny">+${e.price}</span></div>`);
      it.onclick=()=>{d.extras=sel?d.extras.filter(x=>x!==key):[...d.extras,key];viewBook();};
      g.appendChild(it);
    });
  }
  else if(d.step===2){ // when + where
    body.innerHTML=`<h2 style="margin-bottom:4px">Когда и где?</h2><p class="muted" style="margin-bottom:20px">Подберём ближайшего исполнителя.</p>
      <div class="card pad">
        <label class="field"><span>Срочность</span></label>
        <div class="opt-grid" id="urg" style="margin-bottom:16px">
          ${urgOpt('scheduled','По расписанию',I.clock,'Выбрать время')}
          ${urgOpt('today','Сегодня',I.clock,'+15%')}
          ${urgOpt('flash','FlashClean',I.flash,'Срочно · +40%')}
        </div>
        <label class="field"><span>Адрес</span><input class="input" id="addr" value="${d.address}" placeholder="Улица, дом, квартира"></label>
        <label class="field"><span>Город</span><input class="input" id="city" value="${d.city}"></label>
        <label class="field"><span>Комментарий исполнителю — необязательно</span><textarea class="input" id="notes" placeholder="Код от двери, животные, на что обратить внимание…">${d.notes}</textarea></label>
      </div>`;
    body.querySelectorAll('#urg .opt').forEach(o=>o.onclick=()=>{d.urgency=o.dataset.u;viewBook();});
    const bind=(id,k)=>{const e=$('#'+id,body);e.oninput=()=>d[k]=e.value;};
    bind('addr','address');bind('city','city');bind('notes','notes');
  }
  else if(d.step===3){ // AI estimate + confirm
    body.innerHTML=`<h2 style="margin-bottom:4px">AI-оценка стоимости</h2><p class="muted" style="margin-bottom:20px">Честная цена, рассчитана мгновенно.</p>
      <div id="estBox"><div class="card pad"><div class="sk" style="height:120px"></div></div></div>`;
    computeEstimate(body);
  }

  // nav buttons
  const nav=el(`<div class="row" style="margin-top:22px;gap:12px">
    ${d.step>0?`<button class="btn ghost" id="back">Назад</button>`:''}
    <div class="spacer" style="flex:1"></div>
    ${d.step<3?`<button class="btn" id="next">Далее ${I.arrow}</button>`:`<button class="btn" id="confirm">Подтвердить заказ ${I.check}</button>`}
  </div>`);
  c.appendChild(nav);
  const back=$('#back',nav); if(back)back.onclick=()=>{d.step--;viewBook();};
  const next=$('#next',nav); if(next)next.onclick=()=>{
    if(d.step===2 && !d.address.trim()){toast('Введите адрес',true);return;}
    d.step++;viewBook();
  };
  const conf=$('#confirm',nav); if(conf)conf.onclick=confirmBooking;

  shell(c);
}

function timelineHtml(b){
  const order=['searching','accepted','in_progress','completed'];
  const done=b.timeline.map(t=>t.status);
  const labels={searching:'Поиск исполнителя',accepted:'Исполнитель назначен',in_progress:'Уборка идёт',completed:'Завершено и оплачено',cancelled:'Отменён'};
  if(b.status==='cancelled'){
    return b.timeline.map(t=>`<div class="ev"><b>${labels[t.status]||t.status}</b><div class="tiny muted">${fmtTime(t.at)}</div></div>`).join('');
  }
  return order.map(s=>{
    const ev=b.timeline.find(t=>t.status===s);
    const pend=!ev;
    return `<div class="ev ${pend?'pending':''}"><b style="${pend?'color:var(--ink-3)':''}">${labels[s]}</b>${ev?`<div class="tiny muted">${fmtTime(ev.at)}</div>`:''}</div>`;
  }).join('');
}

  const has=b.photosBefore.length||b.photosAfter.length;
  if(!has && state.user.role!=='cleaner'){z.innerHTML='';return;}
  z.innerHTML=`<div class="card pad" style="margin-bottom:14px">
    <h4 style="margin-bottom:12px">До / После</h4>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px">
      <div><div class="tiny muted" style="margin-bottom:6px;font-weight:700">ДО</div><div class="photos" id="pb">${b.photosBefore.map(p=>`<img src="${p.url}">`).join('')||'<div class="hint">—</div>'}</div></div>
      <div><div class="tiny muted" style="margin-bottom:6px;font-weight:700">ПОСЛЕ</div><div class="photos" id="pa">${b.photosAfter.map(p=>`<img src="${p.url}">`).join('')||'<div class="hint">—</div>'}</div></div>
    </div>

}
function renderActions(b,ctx){
  const z=$('#actionZone'); if(!z)return;
  const {isCleaner,isCustomer,assignedToMe,canAccept}=ctx;
  let html='';
  if(canAccept){
    html=`<button class="btn block" id="acceptBtn">Принять заказ · +${money(b.payout)} ${I.check}</button>`;
  } else if(assignedToMe && b.status==='accepted'){
    html=`<div class="uploadbox" id="upBefore">${I.cam}<div style="margin-top:8px;font-weight:600">Загрузить фото «до»${b.photosBefore.length?` (${b.photosBefore.length})`:''}</div></div>
      <button class="btn block" id="startBtn" style="margin-top:12px" ${b.photosBefore.length?'':'disabled'}>Начать уборку ${I.arrow}</button>`;
  } else if(assignedToMe && b.status==='in_progress'){
    html=`<div class="uploadbox" id="upAfter">${I.cam}<div style="margin-top:8px;font-weight:600">Загрузить фото «после»${b.photosAfter.length?` (${b.photosAfter.length})`:''}</div></div>
      <button class="btn block" id="completeBtn" style="margin-top:12px" ${b.photosAfter.length?'':'disabled'}>Завершить и получить оплату ${I.check}</button>`;
  } else if(isCustomer && b.status==='completed' && !b.reviewed){
    html=`<button class="btn block" id="reviewBtn">Оценить исполнителя ${I.star}</button>`;
  } else if(isCustomer && b.status==='completed' && b.reviewed){
    html=`<div class="aiband" style="justify-content:center">${I.check}<span>Спасибо за отзыв!</span></div>`;
  }
  if(isCustomer && ['searching','accepted'].includes(b.status)){
    html+=`<button class="btn ghost block" id="cancelBtn" style="margin-top:12px">Отменить заказ</button>`;
  }
  z.innerHTML=html;
  const bind=(id,fn)=>{const e=$('#'+id);if(e)e.onclick=fn;};
  bind('acceptBtn',async()=>{try{await api('/api/bookings/'+b.id+'/accept','POST');confetti();toast('Заказ принят!');renderBookingDetail(b.id);}catch(e){toast(e.message,true);}});
  bind('startBtn',()=>transition(b.id,'in_progress'));
  bind('completeBtn',()=>transition(b.id,'completed'));
  bind('cancelBtn',()=>transition(b.id,'cancelled'));
  bind('reviewBtn',()=>openReview(b.id));
  const up=(id,phase)=>{const e=$('#'+id);if(e)e.onclick=()=>uploadPhoto(b.id,phase);};
  up('upBefore','before');up('upAfter','after');
}
async function transition(id,status){
  try{await api('/api/bookings/'+id+'/status','POST',{status});
    if(status==='completed')confetti();
    toast(status==='completed'?'Завершено — оплата отправлена!':status==='cancelled'?'Заказ отменён':'Уборка начата');
    if(status==='completed'&&state.user.role==='cleaner'){const {user}=await api('/api/me');state.user=user;}
    renderBookingDetail(id);
  }catch(e){toast(e.message,true);}
}
function uploadPhoto(id,phase){
  const inp=el('<input type="file" accept="image/*" capture="environment" style="display:none">');
  document.body.appendChild(inp);
  inp.onchange=async()=>{
    const file=inp.files[0]; if(!file){inp.remove();return;}
    try{
      const dataUrl=await downscale(file,900,0.7);
      await api('/api/bookings/'+id+'/photos','POST',{phase,photo:dataUrl});
      toast('Фото загружено');renderBookingDetail(id);
    }catch(e){toast(e.message||'Не удалось загрузить',true);}
    inp.remove();
  };
  inp.click();
}
function downscale(file,max,q){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>h&&w>max){h=h*max/w;w=max;} else if(h>max){w=w*max/h;h=max;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Bad image'));};
    img.src=url;
  });
}
function openReview(id){
  const dims={quality:5,speed:5,communication:5,professionalism:5};
  const labels={quality:'Качество',speed:'Скорость',communication:'Общение',professionalism:'Профессионализм'};
  const inner=el(`<div class="card pad">
    <h3 style="margin-bottom:6px;text-align:center">Оцените исполнителя</h3><p class="muted tiny" style="margin-bottom:18px;text-align:center">Оцените каждый аспект — это держит качество LUMI высоким.</p>
    <div id="dimRows"></div>
    <textarea class="input" id="rvText" placeholder="Пара слов (необязательно)" style="margin:14px 0"></textarea>
    <button class="btn block" id="submitRv">Отправить отзыв</button>
  </div>`);
  showModalNode(inner);
  const rows=$('#dimRows',inner);
  function draw(){
    rows.innerHTML=Object.keys(dims).map(k=>`<div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span style="font-size:14.5px;font-weight:600">${labels[k]}</span>
      <div class="starpick" data-dim="${k}" style="display:inline-flex;gap:2px">${Array.from({length:5}).map((_,i)=>`<span data-s="${i+1}" class="${i<dims[k]?'on':''}" style="cursor:pointer">${I.star}</span>`).join('')}</div>
    </div>`).join('');
    rows.querySelectorAll('.starpick').forEach(sp=>{
      const k=sp.dataset.dim;
      sp.querySelectorAll('span').forEach(s=>s.onclick=()=>{dims[k]=Number(s.dataset.s);draw();});
    });
  }
  draw();
  $('#submitRv',inner).onclick=async()=>{
    try{await api('/api/bookings/'+id+'/review','POST',{...dims,text:$('#rvText',inner).value});
      confetti();toast('Спасибо за отзыв!');closeModal();
      if(state.view==='bookings')viewBookings();
    }catch(e){toast(e.message,true);}
  };
}

/* ---------- CHAT & REALTIME (16_CHAT_REALTIME.md) ---------- */
let chatTimer=null, chatTyping=0;
async function renderChat(b){
  const z=$('#chatZone'); if(!z){if(chatTimer){clearInterval(chatTimer);chatTimer=null;}return;}
  if(!b.cleanerId){z.innerHTML='';if(chatTimer){clearInterval(chatTimer);chatTimer=null;}return;}
  const isCleaner=state.user.role==='cleaner';
  z.innerHTML=`<div class="card" style="overflow:hidden"><div class="chat">
    <div id="locBar"></div>
    <div class="msgs" id="msgs"></div>
    <div class="chatbar">
      <div class="attach" id="chatAttach" title="Фото">${I.cam}</div>
      <input class="input" id="chatInput" placeholder="Сообщение…" style="border-radius:12px">
      <button class="btn sm" id="chatSend">${I.send}</button>
    </div>
  </div></div>`;
  await loadMessages(b.id);
  const input=$('#chatInput',z), sendBtn=$('#chatSend',z);
  const doSend=async()=>{
    const text=input.value.trim();if(!text)return;input.value='';
    try{await api('/api/bookings/'+b.id+'/messages','POST',{text});await loadMessages(b.id);}
    catch(e){toast(e.message,true);}
  };
  sendBtn.onclick=doSend;
  input.onkeydown=(e)=>{if(e.key==='Enter')doSend();};
  // §8 typing ping — throttled to once per 3s while composing.
  input.oninput=()=>{const t=Date.now();if(t-chatTyping>3000){chatTyping=t;api('/api/bookings/'+b.id+'/typing','POST').catch(()=>{});}};
  // §9 image attachment.
  $('#chatAttach',z).onclick=()=>sendChatImage(b.id);
  // §14 short-poll for realtime updates while the chat is open.
  if(chatTimer)clearInterval(chatTimer);
  chatTimer=setInterval(()=>{ if($('#msgs')){loadMessages(b.id);} else {clearInterval(chatTimer);chatTimer=null;} },4000);
}
function sendChatImage(id){
  const inp=el('<input type="file" accept="image/*" style="display:none">');document.body.appendChild(inp);
  inp.onchange=async()=>{const f=inp.files[0];if(!f){inp.remove();return;}
    try{const dataUrl=await downscale(f,800,0.7);await api('/api/bookings/'+id+'/messages','POST',{type:'image',attachments:[dataUrl]});await loadMessages(id);}
    catch(e){toast(e.message||'Не удалось',true);}
    inp.remove();};
  inp.click();
}
const TICK={sent:'✓',delivered:'✓✓',read:'✓✓'};
async function loadMessages(id){
  const box=$('#msgs'); if(!box)return;
  try{
    const {messages,typing,location}=await api('/api/bookings/'+id+'/messages');
    // §13 live provider location bar (customer view during active booking).
    const lb=$('#locBar');
    if(lb)lb.innerHTML=location?`<div class="locbar">${I.pin}<span>Исполнитель в пути</span><span class="eta">~${location.etaMinutes} мин</span></div>`:'';
    box.innerHTML=messages.map(m=>{
      if(m.from==='system'||m.type==='system')return `<div class="msg sys">${esc(m.text)}</div>`;
      const me=m.from===state.user.id;
      const img=(m.type==='image'&&m.attachments&&m.attachments[0])?`<img src="${m.attachments[0]}">`:'';
      const body=m.text?esc(m.text):'';
      // §7 delivery ticks on my own outgoing messages.
      const tick=me&&m.delivery?`<span class="tick ${m.delivery==='read'?'read':''}">${TICK[m.delivery]||''}</span>`:'';
      // §11 translation (never overwrites original) — offered on the other party's messages.
      const tr=m.translatedBody?`<div class="tr">${esc(m.translatedBody)}</div>`:'';
      const trBtn=(!me&&m.text&&!m.translatedBody)?`<span class="trbtn" data-tr="${m.id}">Перевести</span>`:'';
      return `<div class="msg ${me?'me':'them'}">${me?'':`<div class="who">${esc(m.name)}</div>`}${body}${img}${tick}${tr}${trBtn}</div>`;
    }).join('') + ((typing&&typing.length)?`<div class="typing">${esc(typing[0].name)} печатает<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`:'');
    box.scrollTop=box.scrollHeight;
    box.querySelectorAll('.trbtn').forEach(btn=>btn.onclick=async()=>{
      try{await api('/api/bookings/'+id+'/messages/'+btn.dataset.tr+'/translate','POST',{target:'en'});await loadMessages(id);}catch(e){toast(e.message,true);}
    });
    // §7 mark read once I've viewed the thread.
    api('/api/bookings/'+id+'/messages/read','POST').catch(()=>{});
    loadNotifBadge&&loadNotifBadge();
  }catch{}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

    const clBody=$('#clBody',body);
    cleaners.forEach(cl=>{
      const tr=el(`<tr><td><b>${cl.name}</b></td><td>⭐ ${cl.rating}</td><td>${cl.jobsDone}</td><td>${money(cl.wallet||0)}</td>
        <td>${cl.verified?'<span class="badge green">Проверен</span>':'<span class="badge amber">Ожидает</span>'}</td>
        <td>${cl.verified?'':`<button class="btn sm" data-v="${cl.id}">Проверить</button>`}</td></tr>`);
      clBody.appendChild(tr);
    });
    clBody.querySelectorAll('[data-v]').forEach(btn=>btn.onclick=async()=>{
      try{await api('/api/admin/verify-cleaner','POST',{cleanerId:btn.dataset.v,verified:true});toast('Исполнитель проверен');viewAdmin();}
      catch(e){toast(e.message,true);}
    });
    const bkBody=$('#bkBody',body);
    recent.forEach(b=>{
      bkBody.appendChild(el(`<tr><td>${svcLabelRu(b.serviceLabel)}</td><td>${b.city}</td><td>${b.customer?.name||'—'}</td>
        <td>${statusBadge(b.status)}</td><td><b>${money(b.price)}</b></td><td style="color:var(--primary-600)">${money(b.commission)}</td></tr>`));
    });
  }catch(err){toast(err.message,true);}
}
function kpi(ico,val,lab,bg,fg){return `<div class="card pad kpi"><div class="ico" style="background:${bg};color:${fg}">${ico}</div><b>${val}</b><div class="lab">${lab}</div></div>`;}

/* ---------- Shared UI ---------- */
function emptyState(title,sub){return el(`<div class="empty">${I.jobs}<h3 style="color:var(--ink-2)">${title}</h3><p class="tiny">${sub}</p></div>`);}
let modalEl=null;
function showModal(html,wide){const n=el(`<div class="modal ${wide?'':''}" style="${wide?'max-width:560px':''}">${html}</div>`);showModalNode(n);}
function showModalNode(node){
  closeModal();
  const bg=el(`<div class="modal-bg"></div>`);
  bg.appendChild(node);
  bg.onclick=(e)=>{if(e.target===bg)closeModal();};
  document.body.appendChild(bg);
  modalEl=bg;
  requestAnimationFrame(()=>bg.classList.add('show'));
}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- Boot ---------- */
async function boot(){
  initTheme();
  await loadCatalog();   // cities/categories are public — needed for the signup form too
  if(state.token){
    try{
      const {user}=await api('/api/me');
      state.user=user;
      state.view=user.role==='admin'?'admin':user.role==='cleaner'?'jobs':'home';
      if(user.role==='customer') await loadProperties();
    }catch{ state.token=null;localStorage.removeItem('cg_token'); }
  }
  render();
}
boot();
</script>
</body>
