<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driveway — Buy & Sell Cars in the USA</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e6e8ee;
    --accent:#2457ff; --accent-dark:#1a3fd6; --accent-soft:#eef2ff;
    --green:#0f9d58; --green-soft:#e7f6ee; --amber:#b45309; --amber-soft:#fef3c7;
    --red:#dc2626; --red-soft:#fee2e2; --purple:#7c3aed; --purple-soft:#f3e8ff;
    --radius:16px; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.06);
    --shadow-lg:0 4px 12px rgba(15,23,42,.08),0 24px 48px rgba(15,23,42,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
  img{max-width:100%;display:block}
  ::placeholder{color:#94a3b8}
  a{color:var(--accent)}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .header-in{max-width:1280px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;gap:14px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.5px;cursor:pointer;white-space:nowrap}
  .logo span{color:var(--accent)}
  .nav{display:none;gap:2px;margin-left:6px}
  @media(min-width:1080px){.nav{display:flex}}
  .nav button{background:none;border:none;padding:9px 13px;border-radius:10px;font-size:14.5px;font-weight:600;color:var(--muted);transition:.15s}
  .nav button:hover{background:var(--bg);color:var(--ink)}
  .nav button.on{color:var(--ink);background:var(--bg)}
  .header-search{flex:1;max-width:330px;position:relative;display:none}
  @media(min-width:860px){.header-search{display:block}}
  .header-search input{width:100%;height:40px;border:1px solid var(--line);border-radius:99px;padding:0 16px 0 40px;background:var(--bg);outline:none;transition:.15s}
  .header-search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .header-search svg{position:absolute;left:14px;top:11px;pointer-events:none}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
  .menu-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:17px;flex:none}
  .menu-btn:hover{background:var(--bg)}
  @media(min-width:1080px){.menu-btn{display:none}}
  @media(max-width:1079px){.hide-sm{display:none!important}}
  @media(max-width:620px){
    .header-in{gap:8px;padding:0 14px}
    .logo{font-size:18px}.logo svg{width:26px;height:26px}
    .header-right .btn{padding:9px 12px}
    .header-right .lbl{display:none}
  }
  .menu-sheet{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .menu-sheet button{text-align:left;border:none;background:var(--bg);border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;color:var(--ink);transition:.15s}
  .menu-sheet button:hover{background:var(--accent-soft);color:var(--accent)}
  .lang{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .lang:hover{border-color:#c9cfdb;color:var(--ink)}

  .btn{border:none;border-radius:12px;padding:10px 18px;font-size:14.5px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(36,87,255,.3)}
  .btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--ink)}
  .btn-ghost:hover{background:var(--bg)}
  .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-outline:hover{border-color:#c9cfdb;background:var(--bg)}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover{filter:brightness(1.06)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-dark:hover{filter:brightness(1.25)}
  .btn-lg{padding:14px 26px;font-size:16px;border-radius:14px}
  .btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;border:none;flex:none}

  /* ---------- hero ---------- */
  .hero{background:linear-gradient(160deg,#0e1730 0%,#14245c 55%,#1c3aa0 100%);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-140px;top:-140px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(93,140,255,.35),transparent 70%)}
  .hero-in{max-width:1280px;margin:0 auto;padding:60px 20px 84px;position:relative;z-index:1}
  .hero h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-1.2px;line-height:1.12;max-width:660px}
  .hero p.sub{margin-top:14px;font-size:17px;color:#c3cdf0;max-width:540px}
  .hero-stats{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap}
  .hero-stats b{display:block;font-size:22px}
  .hero-stats span{font-size:13px;color:#9fb0e6}

  .search-panel{max-width:1280px;margin:-52px auto 0;padding:0 20px;position:relative;z-index:2}
  .search-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow-lg);padding:18px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px}
  @media(max-width:900px){.search-card{grid-template-columns:1fr 1fr}}
  @media(max-width:540px){.search-card{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
  .field select,.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none;transition:.15s}
  .field select:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-card .btn{align-self:end;height:46px}

  /* ---------- layout ---------- */
  .wrap{max-width:1280px;margin:0 auto;padding:0 20px}
  .page{max-width:960px;margin:0 auto;padding:34px 20px 70px}
  .page h1{font-size:28px;letter-spacing:-.6px;margin-bottom:6px}
  .page .lead{color:var(--muted);margin-bottom:24px}
  .panel{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:26px;margin-bottom:18px}
  .panel h3{font-size:17px;margin-bottom:4px}
  .panel .hint{font-size:13.5px;color:var(--muted);margin-bottom:16px}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:40px 0 16px;gap:12px;flex-wrap:wrap}
  .section-head h2{font-size:24px;font-weight:800;letter-spacing:-.5px}
  .section-head .count{color:var(--muted);font-size:14px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 15px;font-size:13.5px;font-weight:600;color:var(--ink);transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:#c9cfdb}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.smart.active{background:var(--purple);border-color:var(--purple)}

  /* ---------- car cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:20px;margin-bottom:50px}
  .car-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.18s;cursor:pointer;display:flex;flex-direction:column}
  .car-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .car-photo{position:relative;aspect-ratio:16/10;background:#e9edf5;overflow:hidden}
  .car-photo img{width:100%;height:100%;object-fit:cover}
  .fav-btn{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .fav-btn:hover{transform:scale(1.1)}
  .badge{position:absolute;left:10px;top:10px;background:rgba(15,23,42,.78);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
  .badge.new{background:var(--green)}
  .badge.hold{background:var(--amber)}
  .badge.sold{background:var(--red)}
  .deal{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.3px;backdrop-filter:blur(4px)}
  .deal.great{background:rgba(15,157,88,.92);color:#fff}
  .deal.good{background:rgba(36,87,255,.9);color:#fff}
  .deal.fair{background:rgba(255,255,255,.92);color:var(--muted)}
  .deal.high{background:rgba(220,38,38,.9);color:#fff}
  .car-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
  .car-price{font-size:20px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .car-price .offer-tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 9px}
  .car-price .was{font-size:13px;font-weight:600;color:var(--muted);text-decoration:line-through}
  .car-title{font-size:15px;font-weight:600}
  .car-meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
  .car-meta i{font-style:normal}
  .trust-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
  .tb{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.2px;display:inline-flex;align-items:center;gap:3px}
  .tb.ok{background:var(--green-soft);color:var(--green)}
  .tb.info{background:var(--accent-soft);color:var(--accent)}
  .tb.warn{background:var(--amber-soft);color:var(--amber)}
  .tb.bad{background:var(--red-soft);color:var(--red)}
  .tb.pur{background:var(--purple-soft);color:var(--purple)}
  .car-loc{margin-top:auto;padding-top:8px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;justify-content:space-between}
  .deadline{font-size:12px;font-weight:700;color:var(--amber)}
  .empty{padding:64px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:42px;margin-bottom:10px}

  /* ---------- how it works ---------- */
  .how{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:52px 0;margin-bottom:0}
  .how-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:24px;margin-top:28px}
  .how-step{padding:22px;border-radius:var(--radius);background:var(--bg)}
  .how-step .num{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:17px}
  .how-step h3{font-size:16.5px;margin-bottom:6px}
  .how-step p{font-size:14px;color:var(--muted)}

  footer{background:var(--ink);color:#94a3b8;padding:38px 0;font-size:13.5px}
  footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center}
  footer .logo{color:#fff;font-size:18px}

  /* ---------- modal ---------- */
  .modal-back{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:26px 16px;overflow-y:auto;backdrop-filter:blur(3px)}
  .modal-back.open{display:flex}
  .modal{background:#fff;border-radius:22px;width:100%;box-shadow:var(--shadow-lg);animation:pop .22s ease;position:relative;margin:auto 0}
  @keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal.sm{max-width:430px;padding:30px}
  .modal.md{max-width:580px;padding:30px}
  .modal.lg{max-width:960px;padding:0;overflow:hidden}
  .modal-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);font-size:16px;color:var(--muted);z-index:5;transition:.15s}
  .modal-x:hover{background:var(--line);color:var(--ink)}
  .modal h2{font-size:22px;letter-spacing:-.4px;margin-bottom:4px}
  .modal .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .form-grid{display:grid;gap:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:560px){.row2,.row3{grid-template-columns:1fr}}
  .f label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  .f .sublabel{font-weight:400;color:var(--muted);font-size:12.5px}
  .f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:.15s;background:#fff}
  .f textarea{resize:vertical;min-height:88px}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .form-err{background:var(--red-soft);color:var(--red);font-size:13.5px;padding:10px 14px;border-radius:10px;display:none}
  .switch-auth{text-align:center;font-size:14px;color:var(--muted);margin-top:16px}
  .switch-auth a{color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none}
  .note{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 13px;line-height:1.45}
  .note.demo{border-left:3px solid var(--purple)}

  /* ---------- detail ---------- */
  .detail-gallery{position:relative;background:#0f172a}
  .detail-gallery .main{aspect-ratio:16/9;overflow:hidden}
  .detail-gallery .main img{width:100%;height:100%;object-fit:cover}
  .gal-nav{position:absolute;top:42%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.9);font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .gal-prev{left:14px}.gal-next{right:14px}
  .shot-tag{position:absolute;left:14px;bottom:82px;background:rgba(15,23,42,.8);color:#fff;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px}
  .thumbs{display:flex;gap:8px;padding:10px;background:#0f172a;overflow-x:auto}
  .thumbs img{width:76px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.55;transition:.15s;flex:none;border:2px solid transparent}
  .thumbs img.on{opacity:1;border-color:#fff}
  .detail-body{padding:26px;display:grid;grid-template-columns:1.55fr 1fr;gap:26px}
  @media(max-width:820px){.detail-body{grid-template-columns:1fr}}
  .detail-body h2{font-size:24px}
  .detail-price{font-size:28px;font-weight:800;letter-spacing:-.6px;margin:6px 0 2px}
  .spec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
  .spec{background:var(--bg);border-radius:12px;padding:10px 14px}
  .spec b{display:block;font-size:14.5px}
  .spec span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .detail-desc{font-size:14.5px;color:#334155;white-space:pre-line}
  .box{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
  .box h4{font-size:14.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border:none}
  .kv span{color:var(--muted)}
  .kv b{font-weight:700;text-align:right}
  .seller-card{background:var(--bg);border-radius:16px;padding:20px;height:fit-content;position:sticky;top:78px}
  .seller-card .who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .seller-card .who b{font-size:15px}
  .seller-card .who span{font-size:12.5px;color:var(--muted);display:block}
  .seller-card .btn{width:100%;margin-bottom:9px}
  .trust{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:10px;line-height:1.45}
  .stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
  .qa-log{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;max-height:230px;overflow-y:auto}
  .qa-msg{font-size:13.5px;padding:9px 12px;border-radius:12px;max-width:88%}
  .qa-msg.me{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .qa-msg.bot{background:var(--bg);align-self:flex-start;border-bottom-left-radius:4px}
  .qa-msg.bot b{color:var(--accent)}
  .audio-row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px}
  .audio-row audio{flex:1;height:34px}

  /* ---------- wizard ---------- */
  .steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .step-pill{flex:1;min-width:120px;background:#fff;border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);border:2px solid transparent;transition:.15s}
  .step-pill.on{border-color:var(--accent)}
  .step-pill.done{border-color:var(--green)}
  .step-pill small{display:block;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
  .step-pill b{font-size:14px}
  .wizard-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}

  .photo-drop{border:2px dashed #c9d2e4;border-radius:16px;padding:30px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:var(--bg)}
  .photo-drop:hover,.photo-drop.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .photo-drop b{color:var(--ink);display:block;margin-bottom:4px;font-size:15px}
  .photo-previews{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;margin-top:12px}
  .photo-previews .ph{position:relative;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
  .photo-previews .ph img{width:100%;aspect-ratio:4/3;object-fit:cover}
  .photo-previews .ph select{width:100%;border:none;border-top:1px solid var(--line);font-size:11.5px;padding:5px;background:#fff;outline:none}
  .photo-previews .ph button{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(15,23,42,.75);color:#fff;font-size:12px}
  .shot-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .shot-need{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);color:var(--muted)}
  .shot-need.got{background:var(--green-soft);color:var(--green)}

  .slider-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  input[type=range]{flex:1;min-width:200px;accent-color:var(--accent);height:6px}
  .price-out{font-size:28px;font-weight:800;letter-spacing:-.6px;min-width:120px}
  .meter{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
  .meter div{background:var(--bg);border-radius:12px;padding:12px 14px}
  .meter b{display:block;font-size:17px}
  .meter span{font-size:11.5px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px}

  .roast{background:var(--amber-soft);border-radius:12px;padding:14px 16px;margin-top:12px;font-size:13.5px;color:#78350f;display:none}
  .roast.good{background:var(--green-soft);color:#065f46}
  .roast ul{margin:8px 0 0 18px}
  .roast li{margin-bottom:4px}

  /* ---------- dashboard ---------- */
  .tabbar{display:flex;gap:6px;background:#fff;border-radius:14px;padding:6px;box-shadow:var(--shadow);width:fit-content;margin-bottom:22px;flex-wrap:wrap}
  .tabbar button{border:none;background:transparent;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted);transition:.15s}
  .tabbar button.on{background:var(--ink);color:#fff}
  .dash-list{display:flex;flex-direction:column;gap:14px}
  .dash-item{background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .dash-item img.thumb{width:112px;height:78px;object-fit:cover;border-radius:10px;flex:none}
  .dash-item .info{flex:1;min-width:180px}

/* market value estimate for user listings (very rough, demo only) */
const TIER={Porsche:2.4,Lamborghini:6,"Mercedes-Benz":1.9,BMW:1.7,Audi:1.6,Lexus:1.5,Tesla:1.6,Acura:1.2,Infiniti:1.2,Volvo:1.3,Jeep:1.15,GMC:1.2,Ram:1.15,Ford:1,Chevrolet:1,Toyota:1.05,Honda:1.05,Subaru:1,Mazda:.95,Nissan:.92,Hyundai:.88,Kia:.9,Volkswagen:.92,Dodge:1};
const medianOf=a=>{const s=[...a].sort((x,y)=>x-y);return s.length%2?s[(s.length-1)/2]:Math.round((s[s.length/2-1]+s[s.length/2])/2);};
/* Market value: anchored on real sold comps when we have them, formula only as a fallback.
   Comps are adjusted ~6% per model year and ~$0.06 per mile of difference. */
function estimateValue(c){
  const comps=modelComps(c);
  if(comps.length){
    const adj=comps.map(s=>{
      let v=s.price*(1+.06*((+c.year||s.year)-s.year));
      v-=.06*((+c.miles||s.miles)-s.miles);
      return clamp(v,s.price*.4,s.price*2.2);
    });
    let v=medianOf(adj);
    if(c.history&&c.history.brand&&c.history.brand!=='Clean')v*=.62;
    if(c.history&&c.history.accidents)v*=1-.06*c.history.accidents;
    return Math.max(800,Math.round(v/50)*50);
  }
  const age=Math.max(0,2026-(+c.year||2020));
  let v=34000*(TIER[c.make]||1)*Math.max(.18,Math.pow(.91,age));
  v*=clamp(1.15-((+c.miles||0)/100000)*.30,.5,1.2);
  if(c.body==='Truck'||c.body==='SUV')v*=1.12;
  if(c.fuel==='Electric')v*=1.03;
  if(c.history&&c.history.brand&&c.history.brand!=='Clean')v*=.62;
  if(c.history&&c.history.accidents)v*=1-.06*c.history.accidents;
  return Math.max(800,Math.round(v/100)*100);
}
const mvOf=c=>c.mv||estimateValue(c);
/* deal rating vs market value */
function dealRating(c){
  const mv=mvOf(c),d=(mv-c.price)/mv;
  if(d>.08)return{k:'great',en:'Great deal',es:'Gran precio'};
  if(d>.02)return{k:'good',en:'Good deal',es:'Buen precio'};
  if(d>-.06)return{k:'fair',en:'Fair price',es:'Precio justo'};
  return{k:'high',en:'Above market',es:'Sobre mercado'};
}
/* predicted days to sell from price vs market */
function daysToSell(price,mv){
  const r=price/mv;
  return Math.round(clamp(9*Math.pow(2.9,(r-.94)*6),2,180));
}
/* guaranteed instant-offer floor (wholesale-style) */
const floorPrice=c=>Math.round(mvOf(c)*.86/50)*50;
/* monthly depreciation estimate */
const depPerMonth=c=>Math.max(35,Math.round(mvOf(c)*0.012/5)*5);

/* cost to own for a given buyer state */
function costToOwn(c,st,age){
  const s=ST[st];if(!s)return null;
  const tax=c.price*s[0]/100, reg=s[1];
  const mpg=c.fuel==='Electric'?0:(c.body==='Truck'?18:c.body==='SUV'?24:28);
  const fuel=c.fuel==='Electric'?55:Math.round(12000/12/mpg*3.35);
  let ins=Math.round((38+mvOf(c)*0.0013)*s[5]);
  if(age&&age<21)ins=Math.round(ins*2.1); else if(age&&age<25)ins=Math.round(ins*1.5);
  const maint=Math.round(38+(c.miles/1000)*0.55+(TIER[c.make]||1)*22);
  return{tax:Math.round(tax),reg,fuel,ins,maint,monthly:ins+fuel+maint,upfront:Math.round(tax)+reg};
}

function milesBetween(a,b){const A=CENT[a],B=CENT[b];if(!A||!B)return null;
  const dy=(A[0]-B[0])*69,dx=(A[1]-B[1])*54;return Math.round(Math.sqrt(dx*dx+dy*dy));}
function shipQuote(from,to){const d=milesBetween(from,to);if(d===null)return null;
  if(d<60)return{miles:d,price:0,days:0};
  const rate=d<500?1.15:d<1500?.78:.62;
  return{miles:d,price:Math.round((190+d*rate)/5)*5,days:Math.max(2,Math.round(d/420)+2)};}

function registerCheck(c,st){

  rows.push(`<div class="kv"><span>${st} emissions standard</span><b style="color:${carbOk?'var(--green)':'var(--amber)'}">${s[3]?(carbOk?'Should qualify':'Check 50-state certification'):'Federal — fine'}</b></div>`);
  rows.push(`<div class="kv"><span>Out-of-state purchase</span><b>${c.state===st?'Same state — simple':'Temp tag + '+st+' title transfer'}</b></div>`);

function askQa(id){
  const inp=document.getElementById('qaInput'),q=inp.value.trim();if(!q)return;
  const c=carById(id),log=document.getElementById('qaLog');
  log.insertAdjacentHTML('beforeend',`<div class="qa-msg me">${esc(q)}</div>`);
  inp.value='';
  const l=q.toLowerCase();let a=null;
  const has=(...w)=>w.some(x=>l.includes(x));
  if(has('mile','odometer','km'))a=`It shows <b>${fmtMi(c.miles)}</b>, about ${Math.round(c.miles/Math.max(1,2026-c.year)).toLocaleString()} miles a year — ${c.miles/Math.max(1,2026-c.year)<12000?'below':'above'} the US average.`;
  else if(has('accident','wreck','damage'))a=c.history?`The history report shows <b>${c.history.accidents} reported accident${c.history.accidents===1?'':'s'}</b> and a <b>${c.history.brand.toLowerCase()}</b> title.`:'No history data on file.';
  else if(has('price','negotiab','best offer','lower','discount'))a=`Asking is ${fmt$(c.price)} against an estimated market value of ${fmt$(mvOf(c))}. ${c.rules?'The seller has automatic offer rules set, so you may get an instant answer.':'Use Make Offer — the seller sees every offer.'}`;
  else if(has('battery','range','charge'))a=c.fuel==='Electric'?`Battery health is <b>${c.evSoh}%</b> of original capacity. Expect roughly ${Math.round(310*c.evSoh/100)} miles of range in mild weather, less in winter.`:'This one is not electric.';
  else if(has('tow','trailer','haul'))a=c.towLb?`Rated to tow <b>${c.towLb.toLocaleString()} lb</b>.`:'No tow rating is listed for this car — assume it is not a tow vehicle.';
  else if(has('carplay','android','bluetooth','screen','nav'))a=c.year>=2018?`Not stated explicitly, but a ${c.year} ${c.make} almost certainly has Bluetooth and very likely CarPlay. I have flagged this for the seller to confirm.`:'Not stated in the listing — I have passed the question to the seller.';
  else if(has('title','lien','loan','owe'))a=`Title brand is <b>${(c.history&&c.history.brand)||'unknown'}</b>. If there is still a loan on it, Driveway pays the lender directly and releases funds only when the title is clear.`;
  else if(has('recall'))a=c.recalls&&c.recalls.length?`There ${c.recalls.length===1?'is':'are'} <b>${c.recalls.length} open recall${c.recalls.length===1?'':'s'}</b>: ${esc(c.recalls.join('; '))}. Recall work is free at any franchised dealer.`:'No open safety recalls on this VIN.';
  else if(has('insur','cost','month','own'))a=buyerZip?`With your ZIP ${buyerZip}, I estimate about <b>${fmt$((costToOwn(c,zipState(buyerZip))||{}).monthly||0)}/month</b> all-in including insurance, fuel and maintenance.`:'Enter your ZIP in the panel on the right and I will price out insurance, fuel and registration for you.';
  else if(has('trade','swap'))a='Driveway is private-party only, but you can list your own car and run both deals side by side in My garage.';
  else if(has('test drive','see it','meet'))a=`The seller is in ${esc(c.city)}, ${c.state}. Meet at the police-station safe exchange zone listed on the right — both sides verify ID in the app first.`;
  if(a)log.insertAdjacentHTML('beforeend',`<div class="qa-msg bot">${a}</div>`);
  else log.insertAdjacentHTML('beforeend',`<div class="qa-msg bot">I don't have that in the listing data, so I have sent the question to <b>${esc(c.sellerName)}</b>. You will get an answer here.</div>`);
  log.scrollTop=log.scrollHeight;
}

function bindPhotoInput(){

  ['dragover','dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{

function addPhotos(files){
  const order=SHOTS.map(s=>s.k);
  [...files].filter(f=>f.type.startsWith('image/')).slice(0,12-draft.photos.length).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>compressImg(r.result,url=>{
      const used=new Set(draft.photos.map(p=>p.tag));
      const tag=order.find(k=>!used.has(k))||'other';
      draft.photos.push({url,tag});renderStep();
    });
    r.readAsDataURL(f);
  });
  const inp=document.getElementById('photoInput');if(inp)inp.value='';
}
function compressImg(src,cb){
  const img=new Image();
  img.onload=()=>{const max=1200,k=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=img.width*k;cv.height=img.height*k;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72));};
  img.onerror=()=>cb(src);img.src=src;
}

let mediaRec=null,recChunks=[],recTimer=null;
function toggleRec(){
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    toast('Microphone not available in this browser.');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    mediaRec=new MediaRecorder(stream);recChunks=[];
    mediaRec.ondataavailable=e=>recChunks.push(e.data);
    mediaRec.onstop=()=>{
      clearInterval(recTimer);stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
      const fr=new FileReader();fr.onload=()=>{draft.audio=fr.result;renderStep();toast('🎧 Cold-start recording saved.');};
      fr.readAsDataURL(blob);};
    mediaRec.start();
    let s=10;const btn=document.getElementById('recBtn'),tm=document.getElementById('recTime');
    if(btn)btn.textContent='■ Stop';
    recTimer=setInterval(()=>{s--;if(tm)tm.textContent=s+'s';if(s<=0&&mediaRec.state==='recording')mediaRec.stop();},1000);
  }).catch(()=>toast('Microphone permission denied.'));
}

  if(!amount||amount<1)return err('offerErr','Enter your offer amount.');

  const o={id:'o'+Date.now(),carId:c.id,carTitle:`${c.year} ${c.make} ${c.model}`,carPhoto:c.photos[0].url,

  else if(o.status==='countered')toast(`↩️ Instant counter: the seller wants ${fmt$(o.counter)}. Respond in My garage.`);

function applyRules(o,c){
  if(!c.rules)return;
  if(o.amount>=c.rules.accept){o.status='accepted';o.auto=1;}
  else if(o.amount>=c.rules.decline){o.status='countered';o.counter=c.rules.counter;o.auto=1;}
  else{o.status='declined';o.auto=1;}
}
function recordSale(c,price,o){
  if(isSold(c.id))return;
  soldLog.push({carId:c.id,make:c.make,model:c.model,year:c.year,miles:c.miles,price,state:c.state,
    ts:Date.now(),sellerEmail:c.sellerEmail,buyerEmail:o?o.buyerEmail:null});
  save.sold();
  offers.filter(x=>x.carId===c.id&&x.status==='pending').forEach(x=>x.status='declined');
  save.offers();
}
function setOfferStatus(id,status){
  const o=offers.find(x=>x.id===id);if(!o)return;
  o.status=status;save.offers();
  if(status==='accepted'){const c=carById(o.carId);if(c)recordSale(c,o.amount,o);
    toast(`🤝 Deal! Contact ${o.buyerName}${o.buyerPhone?' at '+o.buyerPhone:''} to close it.`);}
  else toast('Offer declined.');
  renderAll();
}
function acceptCounter(id){
  const o=offers.find(x=>x.id===id);if(!o)return;
  o.amount=o.counter;o.status='accepted';save.offers();
  const c=carById(o.carId);if(c)recordSale(c,o.amount,o);
  renderAll();toast('🤝 Counter accepted — the car is yours to close.');
}
function counterOffer(id){
  const o=offers.find(x=>x.id===id);if(!o)return;
  const v=prompt('Counter with what amount?',Math.round(o.amount*1.05));
  if(!v)return;
  o.status='countered';o.counter=+v;save.offers();renderAll();toast('Counter sent.');
}
/* standing bids = limit orders on cars */
function matchStanding(s,c){
  if(c.sellerEmail===s.buyerEmail)return false;
  if(s.make&&c.make!==s.make)return false;
  if(s.model&&!(c.model.toLowerCase().includes(s.model.toLowerCase())))return false;
  if(s.yearMin&&c.year<s.yearMin)return false;
  if(s.maxMiles&&c.miles>s.maxMiles)return false;
  if(s.state&&c.state!==s.state)return false;
  return c.price<=s.amount*1.15;
}
const matchingStanding=c=>standing.filter(s=>s.active&&matchStanding(s,c));
function fireStandingOffers(c){
  const list=matchingStanding(c);
  list.forEach(s=>{
    const u=users.find(x=>x.email===s.buyerEmail)||{name:s.buyerName,phone:''};
    const o={id:'o'+Date.now()+Math.random().toString(36).slice(2,6),carId:c.id,
      carTitle:`${c.year} ${c.make} ${c.model}`,carPhoto:c.photos[0].url,asking:c.price,
      amount:Math.min(s.amount,c.price),msg:'Automatic offer from my standing bid.',warns:[],
      verified:true,standing:true,buyerEmail:s.buyerEmail,buyerName:s.buyerName,buyerPhone:u.phone||'',
      sellerEmail:c.sellerEmail,status:'pending',created:Date.now()};
    applyRules(o,c);offers.push(o);
    if(o.status==='accepted')recordSale(c,o.amount,o);
  });
  if(list.length)save.offers();
  return list.length;
}

/* ============ 8. SOLD PRICE DATABASE ============ */
const allSold=()=>SOLD_SEED.concat(soldLog).sort((a,b)=>b.ts-a.ts);
/* strict: same make AND the same model line — this is what a valuation may rely on */
function modelComps(c){
  const cm=(c.model||'').toLowerCase().trim();
  if(!cm)return[];
  return allSold().filter(s=>{
    if(s.make!==c.make)return false;
    const sm=s.model.toLowerCase().trim();
    return cm===sm||cm.includes(sm)||sm.includes(cm);
  });
}
/* loose: falls back to other models from the same make, for "related sales" tables only */
function findComps(c){
  const m=modelComps(c);
  return (m.length?m:allSold().filter(s=>s.make===c.make)).slice(0,8);
}
function compRange(c){
  const l=findComps(c).map(s=>s.price);
  if(!l.length)return 'no comparable sales yet';
  return fmt$(Math.min(...l))+'–'+fmt$(Math.max(...l));
}
let soldQ='';

      <div class="meter" style="margin-bottom:16px">
        <div><span>Sales in view</span><b>${list.length}</b></div>
        <div><span>Average sold price</span><b>${avg?fmt$(avg):'—'}</b></div>
        <div><span>Lowest</span><b>${list.length?fmt$(Math.min(...list.map(s=>s.price))):'—'}</b></div>
        <div><span>Highest</span><b>${list.length?fmt$(Math.max(...list.map(s=>s.price))):'—'}</b></div>
      </div>
      <div class="comp-wrap"><table class="comps">
        <tr><th>Vehicle</th><th>Miles</th><th>State</th><th>Sold for</th><th>When</th></tr>
        ${list.length?list.slice(0,60).map(s=>`<tr><td><b>${s.year} ${esc(s.make)} ${esc(s.model)}</b></td><td>${fmtMi(s.miles)}</td><td>${s.state}</td>
          <td><b style="color:var(--green)">${fmt$(s.price)}</b></td><td>${timeAgo(s.ts)} ${s.seed?'':'<span class="pill blue">Driveway</span>'}</td></tr>`).join('')
          :'<tr><td colspan="5" style="padding:30px;text-align:center;color:var(--muted)">No sales match that search yet.</td></tr>'}
      </table></div>
      <div class="note" style="margin-top:14px">Seeded with sample sales so the database is useful on day one. Every accepted offer on Driveway adds a real, verified data point.</div>
    </div></div>`;
}

  const langBtn=`<button class="lang hide-sm" onclick="toggleLang()">${LANG==='en'?'ES':'EN'}</button>`;
  const menuBtn=`<button class="menu-btn" onclick="openMenu()" aria-label="Menu">☰</button>`;
  const sellBtn=`<button class="btn btn-primary" onclick="startSell()">+<span class="lbl" style="margin-left:6px">${t('sellYourCar').replace('+ ','')}</span></button>`;
  if(u){
    const ini=u.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const pend=pendingCount(u);
    r.innerHTML=`${langBtn}${sellBtn}
      <button class="btn btn-ghost hide-sm" onclick="go('dash')">${t('garage')}${pend?` <span class="pill red" style="padding:1px 7px">${pend}</span>`:''}</button>
      <button class="avatar" title="${esc(u.name)}" onclick="openMenu()">${ini}</button>${menuBtn}`;
  }else{
    r.innerHTML=`${langBtn}
      <button class="btn btn-ghost hide-sm" onclick="openModal('authModal');authMode('login')">${t('logIn')}</button>
      ${sellBtn}${menuBtn}`;
  }
}
function pendingCount(u){
  if(!u)return 0;
  return offers.filter(o=>o.sellerEmail===u.email&&o.status==='pending').length
       + offers.filter(o=>o.buyerEmail===u.email&&o.status==='countered').length;
}
function openMenu(){
  const u=me(),pend=pendingCount(u);
  const item=(label,action)=>`<button onclick="closeModal('genModal');${action}">${label}</button>`;
  openGen(`<h2>${u?esc(u.name):'Driveway'}</h2>
    <p class="sub">${u?esc(u.email):'Buy and sell cars across the USA'}</p>
    <div class="f" style="margin-bottom:10px"><input id="menuSearch" placeholder="Search make, model…"
      onkeydown="if(event.key==='Enter'){filters.q=this.value.trim().toLowerCase();closeModal('genModal');go('home');renderGrid();}"></div>
    <div class="menu-sheet">
      ${item('🔍 '+t('browse'),"go('home')")}
      ${item('💵 '+t('soldPrices'),"go('sold')")}
      ${item('📋 '+t('wanted'),"go('wanted')")}
      ${item('🚗 '+t('sell'),"startSell()")}
      ${u?item('🔧 '+t('garage')+(pend?' · '+pend+' new':''),"go('dash')"):''}
      ${u&&!u.verifiedFunds?item('✅ Verify my funds',"verifyFunds()"):''}
      ${item((LANG==='en'?'🌐 Español':'🌐 English'),"toggleLang()")}
      ${u?item('↩︎ '+t('logOut'),"logout()"):item('👤 '+t('logIn'),"openModal('authModal');authMode('login')")}
    </div>`);
}
function renderAll(){
  applyI18n();initControls();renderHeader();renderNav();renderGrid();
  if(currentView==='dash')dashTab(currentTab);
  if(currentView==='sold')renderSold();
  if(currentView==='wanted')renderWanted();
  if(currentView==='sell')renderSell();
}
function openModal(id){document.getElementById(id).classList.add('open');document.body.style.overflow='hidden';}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
function openGen(html){document.getElementById('genContent').innerHTML=`<button class="modal-x" onclick="closeModal('genModal')">✕</button>`+html;openModal('genModal');}
document.querySelectorAll('.modal-back').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)closeModal(m.id);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-back.open').forEach(m=>closeModal(m.id));});

applyI18n();initControls();renderHeader();renderNav();renderGrid();
</script>
</body>
</html>
