<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<base href="/office/">
<title>Virtual AI Office — BestWayPlus</title>
<style>
  :root{
    --bg:#0d0a16; --panel:#151221; --panel2:#1b1830; --line:#2a2440;
    --text:#e9e6f5; --soft:#9a93b5; --violet:#7c5ce8; --violet2:#8b7cf0; --line2:#342d4d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .soft{color:var(--soft)} .small{font-size:11px} .nb{margin:8px 0}

  #app{display:grid;grid-template-columns:64px 1fr 340px;grid-template-rows:56px 1fr;height:100%;
    grid-template-areas:"side top top" "side center right"}
  #sidebar{grid-area:side;background:#100d1b;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
  .sb-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#7c5ce8,#a78bfa);
    display:grid;place-items:center;font-size:20px;color:#fff;margin-bottom:10px}
  .sb-item{width:48px;height:46px;border:none;background:transparent;color:var(--soft);border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9px;transition:.15s}
  .sb-item .ic{font-size:17px}
  .sb-item:hover{background:#1b1830;color:var(--text)}
  .sb-item.active{background:#241d3f;color:#fff;box-shadow:inset 2px 0 0 var(--violet2)}

  #topbar{grid-area:top;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:16px}
  .tb-left{display:flex;align-items:center;gap:16px}
  .brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand-mark{color:var(--violet2)}
  .selects{display:flex;gap:8px}
  .sel{background:var(--panel2);border:1px solid var(--line);color:var(--soft);border-radius:9px;padding:6px 11px;font-size:12px}
  .sel:hover{color:var(--text);border-color:var(--line2)}
  .tb-mid{flex:1;max-width:420px}
  .search{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 13px;font-size:13px;outline:none}
  .search:focus{border-color:var(--violet)}
  .tb-right{display:flex;align-items:center;gap:8px}
  .tb-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;
    padding:8px 12px;font-size:13px;font-weight:600;position:relative}
  .tb-btn:hover{border-color:var(--line2)}
  .tb-btn.primary{background:linear-gradient(135deg,#7c5ce8,#8b6ff0);border:none;color:#fff}
  .tb-btn.bell{padding:8px 11px}
  .badge{position:absolute;top:-6px;right:-6px;background:#f59e0b;color:#1a1200;border-radius:10px;
    font-size:10px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center}
  .me{width:34px;height:34px;border-radius:50%;background:#3b6fb0;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}

  #center{grid-area:center;position:relative;overflow:hidden;background:#0d0a16}
  #scene{width:100%;height:100%;display:block;cursor:grab}
  #scene:active{cursor:grabbing}
  #tooltip{position:absolute;z-index:20;pointer-events:none;background:rgba(16,12,26,.95);border:1px solid var(--line2);
    border-radius:8px;padding:6px 10px;font-size:12px;transform:translateY(-50%);white-space:nowrap}
  .cam-hint{position:absolute;left:14px;bottom:12px;color:var(--soft);font-size:11px;background:rgba(16,12,26,.7);
    padding:6px 10px;border-radius:8px;border:1px solid var(--line);pointer-events:none}

  #rightPanel{grid-area:right;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px}
  .panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .panel-head h3{margin:0;font-size:15px;flex:1}
  .panel-head .back{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:28px;height:28px}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:11px;color:var(--soft)}
  .feed{display:flex;flex-direction:column;gap:2px}
  .feed-row{display:flex;gap:10px;align-items:flex-start;padding:9px 8px;border-radius:9px;cursor:default}
  .feed-row[data-agent]{cursor:pointer}
  .feed-row:hover{background:var(--panel2)}
  .feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
  .feed-body{flex:1;min-width:0}
  .feed-text{font-size:13px;line-height:1.35}
  .feed-time{font-size:11px;color:var(--soft);margin-top:2px;display:flex;align-items:center;gap:5px}
  .empty{color:var(--soft);text-align:center;padding:30px 0;font-size:13px}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block}

  .agent-card{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .ava{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px}
  .ava.sm{width:30px;height:30px;font-size:13px;border-radius:9px}
  .a-name{font-weight:800;font-size:16px}.a-role{color:var(--soft);font-size:12px}
  .status-line{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cur-task{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px}
  .ct-title{font-weight:600;font-size:13px;margin-bottom:8px}
  .progress{height:7px;background:#0f0c1a;border-radius:6px;overflow:hidden}
  .bar{height:100%;background:linear-gradient(90deg,#7c5ce8,#a78bfa);transition:width .4s}
  .kv{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .kv span{color:var(--soft)}
  .chips-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
  .chips-label{color:var(--soft);font-size:11px;width:100%}
  .chip{background:#241d3f;color:#c9bdf5;border-radius:7px;padding:3px 9px;font-size:11px}
  .chip.alt{background:#1a2740;color:#9cc7f5}
  .w-approve{width:100%;margin:12px 0 4px;background:#f59e0b;border:none;color:#1a1200;font-weight:800;padding:11px;border-radius:11px}
  .a-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .a-actions button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:12px;font-weight:600}
  .a-actions button:hover{border-color:var(--violet)}

  #modalWrap{position:fixed;inset:0;z-index:50;background:rgba(6,4,12,.6);display:grid;place-items:center;backdrop-filter:blur(3px)}
  #modalWrap[hidden]{display:none}
  #tooltip[hidden]{display:none}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px;width:min(460px,92vw);box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;font-size:12px;color:var(--soft);margin:10px 0 5px}
  .modal input,.modal textarea,.modal select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font-size:13px;outline:none;font-family:inherit}
  .modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--violet)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ck{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;margin-top:12px}
  .ck input{width:auto}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .modal-actions button{border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  .modal-actions .primary{background:linear-gradient(135deg,#7c5ce8,#8b6ff0);border:none;color:#fff}
  .modal-actions .danger{background:#3a1620;border-color:#7a2a3a;color:#ff9db0}
  .modal-actions .ghost{background:transparent}
  .ap-agent{display:flex;gap:12px;align-items:center;margin-bottom:12px}
  .ap-q{font-weight:700;font-size:15px;margin:6px 0 10px}

  #toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:10px}
  .toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid #f59e0b;border-radius:12px;
    padding:12px 14px;min-width:240px;max-width:320px;cursor:pointer;opacity:0;transform:translateX(20px);transition:.3s;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:none}

  #splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#241a54,#0d0a16);
    display:grid;place-items:center;transition:opacity .5s}
  #splash.hide{opacity:0;pointer-events:none}
  .sp-in{text-align:center}
  .sp-mark{font-size:52px}
  .sp-t{font-size:26px;font-weight:800;margin-top:8px}
  .sp-s{color:var(--soft);margin-top:6px;font-size:13px}
  .sp-bar{width:180px;height:4px;background:#2a2440;border-radius:4px;margin:18px auto 0;overflow:hidden}
  .sp-bar i{display:block;height:100%;width:40%;background:var(--violet2);border-radius:4px;animation:load 1.1s infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

  /* ===== Tablet ===== */
  @media(max-width:1000px){ .selects{display:none} .tb-mid{max-width:260px} }

  /* ===== Phone ===== */
  #mobileNav{display:none}
  #sheetBackdrop{display:none}
  @media(max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:52px 1fr;grid-template-areas:"top" "center"}
    #sidebar{display:none}
    #topbar{padding:0 10px;gap:8px}
    .brand{font-size:14px}.tb-mid{display:none}
    .tb-btn{padding:8px 10px;font-size:12px}
    .tb-btn.primary .lbl-full{display:none}
    #btnAddAgent,#btnFit{display:none}
    .me{width:30px;height:30px}
    .cam-hint{display:none}

    /* right panel becomes a bottom sheet */
    #rightPanel{position:fixed;left:0;right:0;bottom:58px;top:auto;height:68vh;z-index:40;
      border-left:none;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
      transform:translateY(105%);transition:transform .28s cubic-bezier(.4,0,.2,1);
      box-shadow:0 -14px 50px rgba(0,0,0,.5);padding-top:22px}
    #rightPanel.open{transform:translateY(0)}
    #rightPanel::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:40px;height:4px;border-radius:3px;background:var(--line2)}
    #sheetBackdrop{position:fixed;inset:0;z-index:39;background:rgba(4,3,10,.45);opacity:0;pointer-events:none;transition:.28s}
    #sheetBackdrop.open{opacity:1;pointer-events:auto}

    /* bottom navigation */
    #mobileNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:46;height:58px;
      background:#100d1b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    #mobileNav button{flex:1;background:none;border:none;color:var(--soft);display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600}
    #mobileNav button .ic{font-size:18px}
    #mobileNav button.active{color:var(--violet2)}
    #center{padding-bottom:58px}
    #toasts{bottom:70px;right:10px;left:10px}
    .toast{max-width:none}
    .a-actions{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <header id="topbar"></header>
  <main id="center">
    <canvas id="scene"></canvas>
    <div id="tooltip" hidden></div>
    <div class="cam-hint">Drag to pan · scroll to zoom · click an agent · double-click to focus</div>
  </main>
  <aside id="rightPanel"></aside>
</div>
<div id="sheetBackdrop"></div>
<nav id="mobileNav">
  <button data-mnav="office" class="active"><span class="ic">🏢</span>Office</button>
  <button data-mnav="agents"><span class="ic">👥</span>Agents</button>
  <button data-mnav="create"><span class="ic">➕</span>Task</button>
  <button data-mnav="tasks"><span class="ic">✅</span>Tasks</button>
  <button data-mnav="feed"><span class="ic">📡</span>Feed</button>
</nav>
<div id="modalWrap" hidden></div>
<div id="toasts"></div>
<div id="splash"><div class="sp-in"><div class="sp-mark">◧</div><div class="sp-t">Virtual AI Office</div><div class="sp-s">Waking up the team…</div><div class="sp-bar"><i></i></div></div></div>

<script>
  /* kill any old taxi service worker + caches so root always shows this app */
  if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(()=>{}); }
  if (window.caches) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(()=>{}); }
</script>
<script src="config.js" onerror="window.__cfgMissing=1"></script>
<script src="js/eventbus.js"></script>
<script src="js/layout.js"></script>
<script src="js/pathfinding.js"></script>
<script src="js/render.js"></script>
<script src="js/agentsprites.js"></script>
<script src="js/agents.js"></script>
<script src="js/engine.js"></script>
<script src="js/director.js"></script>
<script src="js/gps.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
