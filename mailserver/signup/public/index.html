<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viply — Premium Email</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --panel: rgba(255,255,255,.025); --line: rgba(255,255,255,.08);
    --text: #ededf0; --muted: #6f6f78; --acc: #6d5df6; --acc2: #22d3ee;
  }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  /* soft ambient glow, barely there */
  .glow { position: fixed; border-radius: 50%; filter: blur(140px); pointer-events: none; z-index: 0; }
  .g1 { width: 640px; height: 640px; background: var(--acc); opacity: .13; top: -240px; left: -180px; animation: drift1 38s ease-in-out infinite; }
  .g2 { width: 520px; height: 520px; background: var(--acc2); opacity: .07; bottom: -240px; right: -160px; animation: drift2 46s ease-in-out infinite; }
  @keyframes drift1 { 50% { transform: translate(120px, 80px); } }
  @keyframes drift2 { 50% { transform: translate(-140px, -60px); } }

  /* faint grid, like a product page */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%);
            mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 100%);
  }

  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px; margin: 16px; padding: 40px 34px 32px;
    border-radius: 18px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 80px rgba(0,0,0,.55);
    animation: cardIn .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardIn { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card.shake { animation: shake .4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-7px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); }
  }

  .wordmark { font-size: 30px; font-weight: 750; letter-spacing: -.04em; }
  .wordmark .d {
    background: linear-gradient(90deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { color: var(--muted); font-size: 13.5px; margin: 6px 0 30px; letter-spacing: -.01em; }

  label { display: block; font-size: 12.5px; font-weight: 550; margin: 16px 0 6px; color: #a0a0a8; }
  .row { display: flex; align-items: center; gap: 10px; }
  input {
    width: 100%; padding: 11px 13px; font-size: 16px; color: var(--text);
    background: #121216; border: 1px solid #232329; border-radius: 10px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #4c4c54; }
  input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(109,93,246,.18); }
  .domain { font-size: 15px; font-weight: 600; color: #a0a0a8; white-space: nowrap; }

  button {
    width: 100%; margin-top: 26px; padding: 12px; font-size: 14.5px; font-weight: 650;
    color: #0a0a0c; background: #fff; border: 0; border-radius: 10px; cursor: pointer;
    letter-spacing: -.01em;
    transition: background .2s, transform .15s, box-shadow .25s;
    box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 8px 28px rgba(0,0,0,.35);
  }
  button:hover { background: #e9e9ee; transform: translateY(-1px); }
  button:active { transform: translateY(0) scale(.985); }
  button:disabled { opacity: .55; cursor: default; }

  .msg { margin-top: 14px; font-size: 13.5px; display: none; animation: msgIn .3s ease both; }
  @keyframes msgIn { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.err { display: block; color: #f87171; }

  .perks {
    margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);
    display: flex; justify-content: center; gap: 8px;
    color: var(--muted); font-size: 12.5px; letter-spacing: -.01em;
  }
  .perks .sep { color: #38383f; }

  /* success state */
  .success { text-align: center; padding: 6px 0 2px; }
  .check {
    width: 64px; height: 64px; margin: 4px auto 22px; border-radius: 50%; position: relative;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    animation: pop .5s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .check::after {
    content: ''; position: absolute; left: 23px; top: 16px; width: 15px; height: 28px;
    border: solid #fff; border-width: 0 4px 4px 0; border-radius: 2px;
    transform-origin: center; transform: rotate(45deg) scale(0);
    animation: tick .3s ease .35s forwards;
  }
  @keyframes tick { to { transform: rotate(45deg) scale(1); } }
  .success h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  .success .email {
    display: inline-block; margin: 6px 0 2px; padding: 8px 14px;
    font-size: 15px; font-weight: 600; word-break: break-all;
    background: #121216; border: 1px solid #232329; border-radius: 10px;
  }
  .success .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .success a {
    display: block; margin-top: 22px; padding: 12px; border-radius: 10px;
    color: #0a0a0c; background: #fff; text-decoration: none; font-weight: 650; font-size: 14.5px;
    transition: background .2s, transform .15s;
  }
  .success a:hover { background: #e9e9ee; transform: translateY(-1px); }

  @media (max-width: 480px) {
    body { align-items: flex-start; overflow-y: auto; }
    .card { margin: 28px 14px calc(28px + env(safe-area-inset-bottom, 0px)); padding: 32px 24px 26px; }
  }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>

<div class="card" id="card">
  <div class="wordmark">viply<span class="d">.</span></div>
  <div class="tagline">Premium email. Zero noise.</div>
  <form id="f">
    <label for="u">Your address</label>
    <div class="row">
      <input id="u" name="username" autocomplete="username" placeholder="john" required>
      <span class="domain" id="dom">@…</span>
    </div>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8+ characters" required>
    <label for="p2">Repeat password</label>
    <input id="p2" type="password" autocomplete="new-password" minlength="8" required>
    <div id="inviteBlock" style="display:none">
      <label for="inv">Invite code</label>
      <input id="inv" name="invite" autocomplete="off">
    </div>
    <button id="btn" type="submit">Create account</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="perks">Instant setup <span class="sep">·</span> Private <span class="sep">·</span> Ad-free</div>
</div>

<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'),
      btn = document.getElementById('btn'), card = document.getElementById('card');

fetch('api/info').then(r => r.json()).then(i => {
  document.getElementById('dom').textContent = '@' + i.domain;
  if (i.inviteRequired) document.getElementById('inviteBlock').style.display = '';
});

function fail(text) {
  msg.className = 'msg err'; msg.textContent = text;
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  if (document.getElementById('p').value !== document.getElementById('p2').value) {
    fail('Passwords do not match.'); return;
  }
  btn.disabled = true; btn.textContent = 'Creating…';
  try {
    const r = await fetch('api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value,
        invite: document.getElementById('inv').value,
      }),
    });
    const data = await r.json();
    if (r.ok) {
      card.innerHTML = `
        <div class="success">
          <div class="check"></div>
          <h2>Your address is ready</h2>
          <div class="email">${data.email}</div>
          <div class="note">Sign in anywhere with this address and your password.</div>
          ${data.webmail ? `<a href="${data.webmail}">Open inbox</a>` : ''}
        </div>`;
    } else {
      fail(data.error || 'Registration failed.');
    }
  } catch {
    fail('Server unavailable, please try again later.');
  } finally {
    btn.disabled = false; btn.textContent = 'Create account';
  }
});
</script>
</body>
</html>
