<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiMail — all your inboxes on one screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: flex; color: #e8eef5; overflow: hidden;
    background: #0d1420;
  }
  /* aurora blobs drifting behind everything */
  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .35; z-index: 0; pointer-events: none; }
  .blob.b1 { width: 520px; height: 520px; background: #2d6cff; top: -140px; left: -120px; animation: drift1 24s ease-in-out infinite; }
  .blob.b2 { width: 460px; height: 460px; background: #8a2dff; bottom: -160px; right: -100px; animation: drift2 30s ease-in-out infinite; }
  .blob.b3 { width: 320px; height: 320px; background: #00b3a4; top: 40%; left: 45%; animation: drift3 26s ease-in-out infinite; }
  @keyframes drift1 { 50% { transform: translate(120px, 90px) scale(1.15); } }
  @keyframes drift2 { 50% { transform: translate(-140px, -70px) scale(.9); } }
  @keyframes drift3 { 50% { transform: translate(-90px, 110px) scale(1.2); } }

  aside, .list, .view { position: relative; z-index: 1; }

  /* ============ sidebar ============ */
  aside {
    width: 285px; min-width: 285px; display: flex; flex-direction: column;
    background: rgba(13,22,38,.72); backdrop-filter: blur(16px);
    border-right: 1px solid rgba(255,255,255,.08);
  }
  aside h1 {
    font-size: 17px; padding: 18px 16px; letter-spacing: .3px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  aside h1 .mm {
    background: linear-gradient(90deg, #6db6ff, #b48cff, #6db6ff);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .acc-list { flex: 1; overflow-y: auto; padding: 10px; }
  .acc {
    display: flex; align-items: center; gap: 9px; padding: 10px 11px; margin-bottom: 3px;
    border-radius: 10px; cursor: pointer; font-size: 13.5px;
    transition: background .2s, transform .15s;
    animation: slideIn .4s ease both;
  }
  @keyframes slideIn { from { transform: translateX(-16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .acc:hover { background: rgba(255,255,255,.07); transform: translateX(3px); }
  .acc.active { background: linear-gradient(90deg, rgba(77,142,255,.25), rgba(140,90,255,.18)); box-shadow: inset 0 0 0 1px rgba(120,170,255,.3); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  .acc .em { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    background: linear-gradient(135deg, #ff5d7a, #e33d5d); color: #fff; border-radius: 10px;
    font-size: 11px; padding: 1px 7px; font-weight: 700;
  }
  .badge.hot { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,93,122,.55); } 100% { box-shadow: 0 0 0 10px rgba(255,93,122,0); } }
  .badge.zero { background: rgba(255,255,255,.12); animation: none; }
  .acc .del { opacity: 0; border: 0; background: none; color: #ff9d9d; cursor: pointer; font-size: 15px; transition: opacity .2s, transform .15s; }
  .acc:hover .del { opacity: 1; }
  .acc .del:hover { transform: scale(1.3) rotate(90deg); }
  .acc.err .em { color: #ff9d9d; }

  .addbox { padding: 14px; border-top: 1px solid rgba(255,255,255,.08); }
  .addbox input {
    width: 100%; margin-bottom: 7px; padding: 9px 11px; font-size: 13px; color: #e8eef5;
    background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.12); border-radius: 8px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .addbox input:focus { border-color: #6db6ff; box-shadow: 0 0 0 3px rgba(109,182,255,.15); }
  .addbox label { font-size: 12px; display: flex; gap: 6px; align-items: center; margin: 4px 0 8px; color: #93a9be; cursor: pointer; }
  .addbox button {
    width: 100%; padding: 9px; border: 0; border-radius: 8px; font-weight: 700; font-size: 13.5px;
    color: #fff; cursor: pointer;
    background: linear-gradient(90deg, #4a9eda, #7b5cff); background-size: 200% auto;
    transition: background-position .35s, transform .15s, box-shadow .25s;
    box-shadow: 0 6px 18px rgba(90,120,255,.3);
  }
  .addbox button:hover { background-position: right center; transform: translateY(-1px); box-shadow: 0 9px 24px rgba(90,120,255,.45); }
  .addbox button:active { transform: scale(.97); }
  .addbox button:disabled { opacity: .6; }
  .addbox .e { color: #ffb3b3; font-size: 12px; min-height: 15px; margin-bottom: 4px; }

  /* ============ message list ============ */
  main { flex: 1; display: flex; min-width: 0; }
  .list {
    width: 405px; min-width: 305px; display: flex; flex-direction: column;
    background: rgba(16,26,44,.65); backdrop-filter: blur(14px);
    border-right: 1px solid rgba(255,255,255,.08);
  }
  .list-head {
    padding: 13px 15px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  .list-head b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    border: 0; border-radius: 8px; padding: 8px 13px; cursor: pointer; font-weight: 700; font-size: 13px;
    color: #fff; background: linear-gradient(90deg, #4a9eda, #7b5cff); background-size: 200% auto;
    transition: background-position .35s, transform .15s; white-space: nowrap;
  }
  .btn:hover { background-position: right center; transform: translateY(-1px); }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: rgba(255,255,255,.1); }
  #refreshBtn.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msgs { flex: 1; overflow-y: auto; }
  .m {
    padding: 11px 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.05);
    border-left: 3px solid transparent;
    transition: background .2s, border-color .2s, transform .15s;
    animation: msgIn .35s ease both;
  }
  @keyframes msgIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .m:hover { background: rgba(255,255,255,.06); transform: translateX(3px); }
  .m.sel { background: rgba(77,142,255,.14); border-left-color: #6db6ff; }
  .m .top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #93a9be; }
  .m .top .dot { width: 8px; height: 8px; }
  .m .top .d { margin-left: auto; white-space: nowrap; }
  .m .sub { font-size: 14px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m.unread .sub { font-weight: 700; }
  .m.unread .sub::before { content: '●'; color: #6db6ff; margin-right: 6px; font-size: 10px; vertical-align: 2px; }
  .empty { padding: 44px 24px; text-align: center; color: #7388a0; font-size: 14px; }
  .empty .big { font-size: 44px; display: block; margin-bottom: 12px; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-9px) rotate(6deg); } }

  /* ============ reading pane ============ */
  .view { flex: 1; display: flex; flex-direction: column; min-width: 0; background: rgba(20,30,50,.5); backdrop-filter: blur(10px); }
  .view-head { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); animation: msgIn .3s ease both; }
  .view-head h2 { font-size: 18px; margin-bottom: 7px; }
  .view-head .meta { font-size: 13px; color: #93a9be; line-height: 1.5; }
  .view-body { flex: 1; overflow: hidden; animation: msgIn .4s ease both; }
  .view-body iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .view-body pre { padding: 20px; white-space: pre-wrap; font-family: inherit; font-size: 14.5px; overflow-y: auto; height: 100%; line-height: 1.55; }
  .placeholder { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; height: 100%; color: #7388a0; }
  .placeholder .big { font-size: 58px; animation: bob 3s ease-in-out infinite; }
  .reply { padding: 12px 20px; border-top: 1px solid rgba(255,255,255,.08); }

  /* loading dots */
  .dots span { animation: blink 1.2s infinite; font-size: 26px; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  /* ============ compose modal ============ */
  .modal {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(5,10,20,.6); backdrop-filter: blur(6px);
  }
  .modal.open { display: flex; animation: fadeIn .25s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .mwin {
    width: 540px; max-width: 94vw; padding: 24px; border-radius: 16px;
    background: rgba(20,32,54,.95); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 90px rgba(0,0,0,.6);
    animation: zoomIn .3s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes zoomIn { from { transform: scale(.85) translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .mwin h3 { margin-bottom: 14px; font-size: 18px; }
  .mwin select, .mwin input, .mwin textarea {
    width: 100%; margin-bottom: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit;
    color: #e8eef5; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .mwin select:focus, .mwin input:focus, .mwin textarea:focus { border-color: #6db6ff; box-shadow: 0 0 0 3px rgba(109,182,255,.15); }
  .mwin select option { background: #16243c; }
  .mwin textarea { height: 150px; resize: vertical; }
  .mwin .row { display: flex; gap: 9px; justify-content: flex-end; }
  .mwin .st { font-size: 13px; min-height: 17px; margin-bottom: 7px; }
  .mwin .st.ok { color: #52d98a; } .mwin .st.err { color: #ff9d9d; }

  ::-webkit-scrollbar { width: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.24); }

  @media (min-width: 901px) and (max-width: 1100px) {
    aside { width: 225px; min-width: 225px; }
    .list { width: 305px; }
  }

  /* ============ mobile: single-column layout ============ */
  .menuBtn, .backBtn { display: none; }
  @media (max-width: 900px) {
    body { overflow: hidden; }
    /* sidebar becomes a slide-in drawer */
    aside {
      position: fixed; inset: 0 auto 0 0; width: min(310px, 85vw); z-index: 20;
      transform: translateX(-105%); transition: transform .3s cubic-bezier(.2,.9,.3,1);
      box-shadow: 24px 0 60px rgba(0,0,0,.5);
    }
    aside.open { transform: translateX(0); }
    .drawer-backdrop {
      position: fixed; inset: 0; z-index: 19; background: rgba(5,10,20,.55);
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; }

    .list { width: 100%; min-width: 0; border-right: 0; }
    .menuBtn {
      display: inline-block; border: 0; border-radius: 8px; padding: 8px 11px; cursor: pointer;
      font-size: 16px; color: #fff; background: rgba(255,255,255,.1); flex: none;
    }

    /* reading pane slides over the list */
    .view {
      position: fixed; inset: 0; z-index: 15; background: #101a2c;
      transform: translateX(105%); transition: transform .3s cubic-bezier(.2,.9,.3,1);
    }
    .view.open { transform: translateX(0); }
    .backBtn {
      display: inline-block; border: 0; border-radius: 8px; padding: 7px 12px; margin-bottom: 10px;
      cursor: pointer; font-size: 14px; font-weight: 700; color: #fff; background: rgba(255,255,255,.12);
    }
    .view-head { padding: 12px 16px; }
    .view-head h2 { font-size: 16px; }
    .mwin { padding: 18px; border-radius: 14px; }
    .mwin textarea { height: 110px; }
    .m { padding: 12px 14px; }
    .m:hover { transform: none; }
    .blob { opacity: .25; }
    /* 16px+ keeps iOS Safari from zoom-jumping into focused fields */
    .addbox input, .mwin input, .mwin select, .mwin textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="drawer-backdrop" id="backdrop"></div>

<aside id="sidebar">
  <h1>📬 <span class="mm">MultiMail</span></h1>
  <div class="acc-list" id="accList"></div>
  <div class="addbox">
    <div class="e" id="addErr"></div>
    <input id="aEmail" placeholder="address@domain" autocomplete="off">
    <input id="aPass" type="password" placeholder="password" autocomplete="off">
    <label><input type="checkbox" id="aRemember" checked> remember in this browser</label>
    <button id="aBtn">+ Add mailbox</button>
  </div>
</aside>

<main>
  <div class="list">
    <div class="list-head">
      <button class="menuBtn" id="menuBtn" title="Mailboxes">☰</button>
      <b id="listTitle">All inboxes</b>
      <div style="display:flex; gap:7px">
        <button class="btn" id="composeBtn">✏️ Compose</button>
        <button class="btn ghost" id="refreshBtn" title="Refresh">⟳</button>
      </div>
    </div>
    <div class="msgs" id="msgs">
      <div class="empty"><span class="big">📭</span>Add your mailboxes on the left<br>to see all your mail in one place</div>
    </div>
  </div>
  <div class="view" id="view">
    <div class="placeholder"><span class="big">💌</span>Select a message to read it</div>
  </div>
</main>

<div class="modal" id="modal">
  <div class="mwin">
    <h3>✏️ New message</h3>
    <select id="cFrom"></select>
    <input id="cTo" placeholder="To (recipient address)">
    <input id="cSubj" placeholder="Subject">
    <textarea id="cText" placeholder="Write your message…"></textarea>
    <div class="st" id="cSt"></div>
    <div class="row">
      <button class="btn ghost" id="cCancel">Cancel</button>
      <button class="btn" id="cSend">Send 🚀</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#4a9eda','#5dbb63','#e3a04a','#c05de3','#e35d5d','#3fc1c9','#e35da8','#a3b830','#8a6ee3','#5d8fe3'];
let accounts = [];      // [{id, email, color, unseen, error, messages}]
let filter = null;      // account id or null = all
let selected = null;    // {account, uid}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- mailboxes remembered in this browser ---
const saved = () => JSON.parse(localStorage.getItem('mmAccounts') || '[]');
const saveAcc = (email, password) => {
  const list = saved().filter((a) => a.email !== email);
  list.push({ email, p: btoa(unescape(encodeURIComponent(password))) });
  localStorage.setItem('mmAccounts', JSON.stringify(list));
};
const forgetAcc = (email) => {
  localStorage.setItem('mmAccounts', JSON.stringify(saved().filter((a) => a.email !== email)));
};

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Server error');
  return data;
}

async function init() {
  const info = await api('api/info');
  // server session is empty but the browser remembers mailboxes — restore them
  if (info.accounts.length === 0 && saved().length) {
    for (const a of saved()) {
      try {
        await api('api/accounts', { method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: a.email, password: decodeURIComponent(escape(atob(a.p))) }) });
      } catch { forgetAcc(a.email); }
    }
  }
  await reload();
}

async function reload() {
  $('refreshBtn').classList.add('spin');
  try {
    const data = await api('api/inbox');
    accounts = data.accounts.map((a, i) => ({ ...a, color: COLORS[i % COLORS.length] }));
    renderSidebar();
    renderList();
  } finally {
    $('refreshBtn').classList.remove('spin');
  }
}

function renderSidebar() {
  const el = $('accList');
  const totalUnseen = accounts.reduce((n, a) => n + (a.unseen || 0), 0);
  let html = `<div class="acc ${filter===null?'active':''}" data-id="">
    <span class="dot" style="background:#fff; color:#fff"></span><span class="em">All inboxes</span>
    <span class="badge ${totalUnseen?'hot':'zero'}">${totalUnseen}</span></div>`;
  accounts.forEach((a, i) => {
    html += `<div class="acc ${filter===a.id?'active':''} ${a.error?'err':''}" data-id="${a.id}" style="animation-delay:${i*60}ms">
      <span class="dot" style="background:${a.color}; color:${a.color}"></span>
      <span class="em" title="${esc(a.email)}${a.error ? ' — ' + esc(a.error) : ''}">${esc(a.email)}</span>
      ${a.error ? '⚠️' : `<span class="badge ${a.unseen?'hot':'zero'}">${a.unseen}</span>`}
      <button class="del" data-del="${a.id}" title="Remove">✕</button></div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.acc').forEach((n) => n.addEventListener('click', (e) => {
    if (e.target.dataset.del !== undefined && e.target.dataset.del !== '') return;
    filter = n.dataset.id || null;
    renderSidebar(); renderList(); closeDrawer();
  }));
  el.querySelectorAll('.del').forEach((n) => n.addEventListener('click', async (e) => {
    e.stopPropagation();
    const acc = accounts.find((a) => a.id === n.dataset.del);
    await api('api/accounts/' + n.dataset.del, { method: 'DELETE' });
    if (acc) forgetAcc(acc.email);
    if (filter === n.dataset.del) filter = null;
    await reload();
  }));
}

function renderList() {
  const el = $('msgs');
  const src = accounts.filter((a) => !a.error && (!filter || a.id === filter));
  $('listTitle').textContent = filter ? (accounts.find((a) => a.id === filter)?.email || '') : 'All inboxes';
  const items = src.flatMap((a) => (a.messages || []).map((m) => ({ ...m, acc: a })));
  items.sort((x, y) => new Date(y.date) - new Date(x.date));
  if (!items.length) {
    el.innerHTML = accounts.length
      ? '<div class="empty"><span class="big">🌤️</span>No mail here yet — enjoy the calm!</div>'
      : '<div class="empty"><span class="big">📭</span>Add your mailboxes on the left<br>to see all your mail in one place</div>';
    return;
  }
  el.innerHTML = items.map((m, i) => `
    <div class="m ${m.seen?'':'unread'} ${selected && selected.uid===m.uid && selected.account===m.acc.id ? 'sel':''}"
         data-acc="${m.acc.id}" data-uid="${m.uid}" style="animation-delay:${Math.min(i*40, 400)}ms">
      <div class="top"><span class="dot" style="background:${m.acc.color}; color:${m.acc.color}"></span>
        <span>${esc(m.fromName || m.from)}</span>
        <span class="d">${fmtDate(m.date)}</span></div>
      <div class="sub">${esc(m.subject)}</div>
    </div>`).join('');
  el.querySelectorAll('.m').forEach((n) => n.addEventListener('click', () => openMessage(n.dataset.acc, +n.dataset.uid)));
}

function fmtDate(d) {
  const dt = new Date(d), now = new Date();
  return dt.toDateString() === now.toDateString()
    ? dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    : dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

async function openMessage(accId, uid) {
  selected = { account: accId, uid };
  renderList();
  const v = $('view');
  v.classList.add('open');
  v.innerHTML = '<div class="placeholder"><div class="dots"><span>●</span><span>●</span><span>●</span></div>Loading message…</div>';
  try {
    const m = await api(`api/message?account=${accId}&uid=${uid}`);
    const acc = accounts.find((a) => a.id === accId);
    v.innerHTML = `
      <div class="view-head"><button class="backBtn" id="backBtn">← Inbox</button><h2>${esc(m.subject)}</h2>
        <div class="meta">From: ${esc(m.from)}<br>To: ${esc(m.to)} · ${new Date(m.date).toLocaleString('en-GB')}
        ${m.attachments.length ? '<br>📎 ' + m.attachments.map((a) => esc(a.filename)).join(', ') : ''}</div></div>
      <div class="view-body" id="vb"></div>
      <div class="reply"><button class="btn" id="replyBtn">↩ Reply</button></div>`;
    const vb = $('vb');
    if (m.html) {
      const fr = document.createElement('iframe');
      fr.sandbox = 'allow-same-origin';
      fr.srcdoc = m.html;
      vb.appendChild(fr);
    } else {
      vb.innerHTML = `<pre>${esc(m.text)}</pre>`;
    }
    $('replyBtn').addEventListener('click', () => {
      openCompose(accId, m.from.match(/<(.+)>/)?.[1] || m.from, 'Re: ' + m.subject);
    });
    $('backBtn').addEventListener('click', () => { v.classList.remove('open'); selected = null; renderList(); });
    const cached = acc?.messages?.find((x) => x.uid === uid);
    if (cached && !cached.seen) { cached.seen = true; acc.unseen = Math.max(0, acc.unseen - 1); renderSidebar(); renderList(); }
  } catch (e) {
    v.innerHTML = `<div class="placeholder"><button class="backBtn" id="backBtn2">← Inbox</button><span class="big">⚠️</span>${esc(e.message)}</div>`;
    $('backBtn2').addEventListener('click', () => { v.classList.remove('open'); selected = null; renderList(); });
  }
}

// --- mobile drawer ---
function closeDrawer() { $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); }
$('menuBtn').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('backdrop').classList.toggle('show', $('sidebar').classList.contains('open'));
});
$('backdrop').addEventListener('click', closeDrawer);

// --- compose ---
function openCompose(fromId, to = '', subj = '') {
  $('cFrom').innerHTML = accounts.filter((a) => !a.error)
    .map((a) => `<option value="${a.id}" ${a.id===fromId?'selected':''}>${esc(a.email)}</option>`).join('');
  $('cTo').value = to; $('cSubj').value = subj; $('cText').value = '';
  $('cSt').textContent = ''; $('cSt').className = 'st';
  $('modal').classList.add('open');
}
$('composeBtn').addEventListener('click', () => openCompose(filter));
$('cCancel').addEventListener('click', () => $('modal').classList.remove('open'));
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.remove('open'); });
$('cSend').addEventListener('click', async () => {
  const st = $('cSt');
  st.className = 'st'; st.textContent = 'Sending…';
  try {
    await api('api/send', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ account: $('cFrom').value, to: $('cTo').value, subject: $('cSubj').value, text: $('cText').value }) });
    st.className = 'st ok'; st.textContent = 'Sent! 🎉';
    setTimeout(() => { $('modal').classList.remove('open'); reload(); }, 900);
  } catch (e) {
    st.className = 'st err'; st.textContent = e.message;
  }
});

// --- add mailbox ---
$('aBtn').addEventListener('click', async () => {
  const email = $('aEmail').value.trim(), password = $('aPass').value;
  $('addErr').textContent = '';
  if (!email || !password) { $('addErr').textContent = 'Please fill in the address and password'; return; }
  $('aBtn').disabled = true; $('aBtn').textContent = 'Connecting…';
  try {
    await api('api/accounts', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password }) });
    if ($('aRemember').checked) saveAcc(email, password);
    $('aEmail').value = ''; $('aPass').value = '';
    await reload();
  } catch (e) {
    $('addErr').textContent = e.message;
  } finally {
    $('aBtn').disabled = false; $('aBtn').textContent = '+ Add mailbox';
  }
});

$('refreshBtn').addEventListener('click', reload);
setInterval(() => reload().catch(() => {}), 60_000); // auto-refresh every minute

init().catch((e) => { $('msgs').innerHTML = `<div class="empty"><span class="big">⚠️</span>${esc(e.message)}</div>`; });
</script>
</body>
</html>
