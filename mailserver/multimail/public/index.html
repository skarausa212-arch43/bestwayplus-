<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viply Mail — VIP inboxes on one screen</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090b; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.04);
    --text: #ededf0; --muted: #77777f; --dim: #5c5c63; --acc: #6d5df6; --acc2: #22d3ee;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; height: 100dvh;
    display: flex; color: var(--text); overflow: hidden;
    background: var(--bg); -webkit-font-smoothing: antialiased;
  }
  /* soft ambient glow */
  .blob { position: fixed; border-radius: 50%; filter: blur(140px); z-index: 0; pointer-events: none; }
  .blob.b1 { width: 620px; height: 620px; background: var(--acc); opacity: .12; top: -240px; left: -180px; animation: drift1 38s ease-in-out infinite; }
  .blob.b2 { width: 520px; height: 520px; background: var(--acc2); opacity: .06; bottom: -240px; right: -160px; animation: drift2 46s ease-in-out infinite; }
  .blob.b3 { display: none; }
  @keyframes drift1 { 50% { transform: translate(120px, 80px); } }
  @keyframes drift2 { 50% { transform: translate(-140px, -60px); } }

  aside, .list, .view { position: relative; z-index: 1; }

  /* ============ sidebar ============ */
  aside {
    width: 280px; min-width: 280px; display: flex; flex-direction: column;
    background: rgba(12,12,15,.85); backdrop-filter: blur(18px);
    border-right: 1px solid var(--line);
  }
  aside h1 {
    font-size: 16px; font-weight: 700; letter-spacing: -.03em;
    padding: 18px 16px; border-bottom: 1px solid var(--line);
  }
  aside h1 .mm { color: #fff; }
  aside h1 .mm::after {
    content: '.';
    background: linear-gradient(90deg, var(--acc), var(--acc2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  aside h1 .mm2 { color: var(--muted); font-weight: 500; }
  .acc-list { flex: 1; overflow-y: auto; padding: 10px; }
  .acc {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; margin-bottom: 2px;
    border-radius: 8px; cursor: pointer; font-size: 13.5px; color: #b8b8c0;
    transition: background .15s, color .15s;
    animation: slideIn .35s ease both;
  }
  @keyframes slideIn { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .acc:hover { background: rgba(255,255,255,.05); color: var(--text); }
  .acc.active { background: rgba(255,255,255,.08); color: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .acc .em { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    background: #1d1d23; color: #8f8f98; border-radius: 999px;
    font-size: 11px; padding: 1px 8px; font-weight: 650;
  }
  .badge.hot { background: var(--acc); color: #fff; }
  .badge.zero { background: #17171c; color: #55555c; }
  .acc .del { opacity: 0; border: 0; background: none; color: #6c6c74; cursor: pointer; font-size: 14px; transition: opacity .15s, color .15s; }
  .acc:hover .del { opacity: 1; }
  .acc .del:hover { color: #f87171; }
  .acc.err .em { color: #f87171; }

  .addbox { padding: 14px; border-top: 1px solid var(--line); }
  .addbox input {
    width: 100%; margin-bottom: 7px; padding: 9px 11px; font-size: 13px; color: var(--text);
    background: #121216; border: 1px solid #232329; border-radius: 8px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .addbox input::placeholder { color: #4c4c54; }
  .addbox input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(109,93,246,.15); }
  .addbox input[type="checkbox"] { width: auto; flex: none; margin: 0; accent-color: var(--acc); }
  .addbox label { font-size: 12px; display: flex; gap: 7px; align-items: center; margin: 4px 0 10px; color: var(--muted); cursor: pointer; }
  .addbox button {
    width: 100%; padding: 9px; border: 0; border-radius: 8px; font-weight: 650; font-size: 13px;
    color: #0a0a0c; background: #fff; cursor: pointer;
    transition: background .2s, transform .15s;
  }
  .addbox button:hover { background: #e9e9ee; transform: translateY(-1px); }
  .addbox button:active { transform: scale(.98); }
  .addbox button:disabled { opacity: .55; }
  .addbox .e { color: #f87171; font-size: 12px; min-height: 15px; margin-bottom: 4px; }

  /* ============ message list ============ */
  main { flex: 1; display: flex; min-width: 0; }
  .list {
    width: 400px; min-width: 300px; display: flex; flex-direction: column;
    background: rgba(10,10,13,.6); backdrop-filter: blur(14px);
    border-right: 1px solid var(--line);
  }
  .list-head {
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .list-head b { font-size: 14px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    border: 0; border-radius: 8px; padding: 8px 13px; cursor: pointer; font-weight: 650; font-size: 13px;
    color: #0a0a0c; background: #fff;
    transition: background .2s, transform .15s; white-space: nowrap;
  }
  .btn:hover { background: #e9e9ee; transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: rgba(255,255,255,.07); color: var(--text); }
  .btn.ghost:hover { background: rgba(255,255,255,.12); }
  #refreshBtn.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msgs { flex: 1; overflow-y: auto; }
  .m {
    padding: 11px 14px; cursor: pointer; border-bottom: 1px solid var(--line2);
    border-left: 2px solid transparent;
    transition: background .15s, border-color .15s;
    animation: msgIn .3s ease both;
  }
  @keyframes msgIn { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .m:hover { background: rgba(255,255,255,.04); }
  .m.sel { background: rgba(109,93,246,.10); border-left-color: var(--acc); }
  .m .top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .m .top .dot { width: 7px; height: 7px; }
  .m .top .d { margin-left: auto; white-space: nowrap; }
  .m .sub { font-size: 13.5px; margin-top: 4px; color: #c6c6cd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m.unread .sub { font-weight: 650; color: var(--text); }
  .m.unread .sub::before { content: '\2022'; color: var(--acc); margin-right: 6px; }
  .empty { padding: 52px 24px; text-align: center; color: var(--dim); font-size: 13.5px; line-height: 1.6; }

  /* ============ reading pane ============ */
  .view { flex: 1; display: flex; flex-direction: column; min-width: 0; background: rgba(10,10,13,.4); backdrop-filter: blur(10px); }
  .view-head { padding: 16px 20px; border-bottom: 1px solid var(--line); animation: msgIn .25s ease both; }
  .view-head h2 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 7px; }
  .view-head .meta { font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .view-body { flex: 1; overflow: hidden; animation: msgIn .3s ease both; }
  /* width:1px + min-width:100% — iOS Safari otherwise inflates the iframe to the email's width */
  .view-body iframe { width: 1px; min-width: 100%; height: 100%; border: 0; background: #fff; }
  .view-body pre { padding: 20px; white-space: pre-wrap; font-family: inherit; font-size: 14px; overflow-y: auto; height: 100%; line-height: 1.6; }
  .placeholder { display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; height: 100%; color: var(--dim); font-size: 13.5px; }
  .reply { padding: 12px 20px; border-top: 1px solid var(--line); }

  /* loading dots */
  .dots span { animation: blink 1.2s infinite; font-size: 20px; color: var(--muted); }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }

  /* ============ compose modal ============ */
  .modal {
    position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); backdrop-filter: blur(8px);
  }
  .modal.open { display: flex; animation: fadeIn .2s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .mwin {
    width: 530px; max-width: 94vw; padding: 22px; border-radius: 14px;
    background: #121216; border: 1px solid var(--line);
    box-shadow: 0 30px 90px rgba(0,0,0,.6);
    animation: zoomIn .25s cubic-bezier(.2,1.1,.3,1) both;
  }
  @keyframes zoomIn { from { transform: scale(.94) translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .mwin h3 { margin-bottom: 14px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .mwin select, .mwin input, .mwin textarea {
    width: 100%; margin-bottom: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit;
    color: var(--text); background: #0d0d10; border: 1px solid #232329; border-radius: 9px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .mwin select:focus, .mwin input:focus, .mwin textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(109,93,246,.15); }
  .mwin select option { background: #121216; }
  .mwin textarea { height: 150px; resize: vertical; }
  .mwin .row { display: flex; gap: 9px; justify-content: flex-end; }
  .mwin .st { font-size: 13px; min-height: 17px; margin-bottom: 7px; }
  .mwin .st.ok { color: #34d399; } .mwin .st.err { color: #f87171; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #26262c; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #33333a; }

  @media (min-width: 901px) and (max-width: 1100px) {
    aside { width: 225px; min-width: 225px; }
    .list { width: 305px; }
  }

  /* ============ mobile: single-column layout ============ */
  .menuBtn, .backBtn { display: none; }
  @media (max-width: 900px) {
    /* pin the whole page: iOS Safari can't drag it under the status bar after the keyboard closes */
    body { position: fixed; inset: 0; width: 100%; overflow: hidden; }
    aside h1 { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
    .list-head { padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
    .addbox { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
    .reply { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

    /* sidebar becomes a slide-in drawer */
    aside {
      position: fixed; inset: 0 auto 0 0; width: min(300px, 85vw); z-index: 20;
      transform: translateX(-105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
      box-shadow: 24px 0 60px rgba(0,0,0,.55);
    }
    aside.open { transform: translateX(0); }
    .drawer-backdrop {
      position: fixed; inset: 0; z-index: 19; background: rgba(0,0,0,.55);
      opacity: 0; pointer-events: none; transition: opacity .28s;
    }
    .drawer-backdrop.show { opacity: 1; pointer-events: auto; }

    .list { width: 100%; min-width: 0; border-right: 0; }
    .menuBtn {
      display: inline-block; border: 0; border-radius: 8px; padding: 8px 11px; cursor: pointer;
      font-size: 15px; color: var(--text); background: rgba(255,255,255,.07); flex: none;
    }

    /* reading pane slides over the list */
    .view {
      position: fixed; inset: 0; z-index: 15; background: #0b0b0e;
      transform: translateX(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
    }
    .view.open { transform: translateX(0); }
    .backBtn {
      display: inline-block; border: 0; border-radius: 8px; padding: 7px 12px; margin-bottom: 10px;
      cursor: pointer; font-size: 13.5px; font-weight: 650; color: var(--text); background: rgba(255,255,255,.08);
    }
    .view-head { padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
    .view-head h2 { font-size: 16px; }
    .mwin { padding: 18px; border-radius: 12px; }
    .mwin textarea { height: 110px; }
    .m { padding: 12px 14px; }
    .blob { opacity: .08; }
    /* 16px+ keeps iOS Safari from zoom-jumping into focused fields */
    .addbox input, .mwin input, .mwin select, .mwin textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="drawer-backdrop" id="backdrop"></div>

<aside id="sidebar">
  <h1><span class="mm">viply</span> <span class="mm2">mail</span></h1>
  <div class="acc-list" id="accList"></div>
  <div class="addbox">
    <div class="e" id="addErr"></div>
    <input id="aEmail" placeholder="address@domain" autocomplete="off">
    <input id="aPass" type="password" placeholder="password" autocomplete="off">
    <label><input type="checkbox" id="aRemember" checked> remember in this browser</label>
    <button id="aBtn">+ Add mailbox</button>
  </div>
</aside>

<main>
  <div class="list">
    <div class="list-head">
      <button class="menuBtn" id="menuBtn" title="Mailboxes">☰</button>
      <b id="listTitle">All inboxes</b>
      <div style="display:flex; gap:7px">
        <button class="btn" id="composeBtn">Compose</button>
        <button class="btn ghost" id="refreshBtn" title="Refresh">⟳</button>
      </div>
    </div>
    <div class="msgs" id="msgs">
      <div class="empty">Add a mailbox to see all<br>your mail in one place</div>
    </div>
  </div>
  <div class="view" id="view">
    <div class="placeholder">Select a message</div>
  </div>
</main>

<div class="modal" id="modal">
  <div class="mwin">
    <h3>New message</h3>
    <select id="cFrom"></select>
    <input id="cTo" placeholder="To (recipient address)">
    <input id="cSubj" placeholder="Subject">
    <textarea id="cText" placeholder="Write your message…"></textarea>
    <div class="st" id="cSt"></div>
    <div class="row">
      <button class="btn ghost" id="cCancel">Cancel</button>
      <button class="btn" id="cSend">Send</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#8b7cf6','#5eead4','#f472b6','#fbbf24','#60a5fa','#34d399','#f87171','#a78bfa','#38bdf8','#fb923c'];
let accounts = [];      // [{id, email, color, unseen, error, messages}]
let filter = null;      // account id or null = all
let selected = null;    // {account, uid}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// --- mailboxes remembered in this browser ---
const saved = () => JSON.parse(localStorage.getItem('viplyAccounts') || '[]');
const saveAcc = (email, password) => {
  const list = saved().filter((a) => a.email !== email);
  list.push({ email, p: btoa(unescape(encodeURIComponent(password))) });
  localStorage.setItem('viplyAccounts', JSON.stringify(list));
};
const forgetAcc = (email) => {
  localStorage.setItem('viplyAccounts', JSON.stringify(saved().filter((a) => a.email !== email)));
};

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Server error');
  return data;
}

async function init() {
  const info = await api('api/info');
  // server session is empty but the browser remembers mailboxes — restore them
  if (info.accounts.length === 0 && saved().length) {
    for (const a of saved()) {
      try {
        await api('api/accounts', { method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email: a.email, password: decodeURIComponent(escape(atob(a.p))) }) });
      } catch { forgetAcc(a.email); }
    }
  }
  await reload();
}

async function reload() {
  $('refreshBtn').classList.add('spin');
  try {
    const data = await api('api/inbox');
    accounts = data.accounts.map((a, i) => ({ ...a, color: COLORS[i % COLORS.length] }));
    renderSidebar();
    renderList();
  } finally {
    $('refreshBtn').classList.remove('spin');
  }
}

function renderSidebar() {
  const el = $('accList');
  const totalUnseen = accounts.reduce((n, a) => n + (a.unseen || 0), 0);
  let html = `<div class="acc ${filter===null?'active':''}" data-id="">
    <span class="dot" style="background:#fff; color:#fff"></span><span class="em">All inboxes</span>
    <span class="badge ${totalUnseen?'hot':'zero'}">${totalUnseen}</span></div>`;
  accounts.forEach((a, i) => {
    html += `<div class="acc ${filter===a.id?'active':''} ${a.error?'err':''}" data-id="${a.id}" style="animation-delay:${i*60}ms">
      <span class="dot" style="background:${a.color}; color:${a.color}"></span>
      <span class="em" title="${esc(a.email)}${a.error ? ' — ' + esc(a.error) : ''}">${esc(a.email)}</span>
      ${a.error ? '⚠️' : `<span class="badge ${a.unseen?'hot':'zero'}">${a.unseen}</span>`}
      <button class="del" data-del="${a.id}" title="Remove">✕</button></div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.acc').forEach((n) => n.addEventListener('click', (e) => {
    if (e.target.dataset.del !== undefined && e.target.dataset.del !== '') return;
    filter = n.dataset.id || null;
    renderSidebar(); renderList(); closeDrawer();
  }));
  el.querySelectorAll('.del').forEach((n) => n.addEventListener('click', async (e) => {
    e.stopPropagation();
    const acc = accounts.find((a) => a.id === n.dataset.del);
    await api('api/accounts/' + n.dataset.del, { method: 'DELETE' });
    if (acc) forgetAcc(acc.email);
    if (filter === n.dataset.del) filter = null;
    await reload();
  }));
}

function renderList() {
  const el = $('msgs');
  const src = accounts.filter((a) => !a.error && (!filter || a.id === filter));
  $('listTitle').textContent = filter ? (accounts.find((a) => a.id === filter)?.email || '') : 'All inboxes';
  const items = src.flatMap((a) => (a.messages || []).map((m) => ({ ...m, acc: a })));
  items.sort((x, y) => new Date(y.date) - new Date(x.date));
  if (!items.length) {
    el.innerHTML = accounts.length
      ? '<div class="empty">No mail yet</div>'
      : '<div class="empty">Add a mailbox to see all<br>your mail in one place</div>';
    return;
  }
  el.innerHTML = items.map((m, i) => `
    <div class="m ${m.seen?'':'unread'} ${selected && selected.uid===m.uid && selected.account===m.acc.id ? 'sel':''}"
         data-acc="${m.acc.id}" data-uid="${m.uid}" style="animation-delay:${Math.min(i*40, 400)}ms">
      <div class="top"><span class="dot" style="background:${m.acc.color}; color:${m.acc.color}"></span>
        <span>${esc(m.fromName || m.from)}</span>
        <span class="d">${fmtDate(m.date)}</span></div>
      <div class="sub">${esc(m.subject)}</div>
    </div>`).join('');
  el.querySelectorAll('.m').forEach((n) => n.addEventListener('click', () => openMessage(n.dataset.acc, +n.dataset.uid)));
}

function fmtDate(d) {
  const dt = new Date(d), now = new Date();
  return dt.toDateString() === now.toDateString()
    ? dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    : dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

async function openMessage(accId, uid) {
  selected = { account: accId, uid };
  renderList();
  const v = $('view');
  v.classList.add('open');
  v.innerHTML = '<div class="placeholder"><div class="dots"><span>●</span><span>●</span><span>●</span></div>Loading message…</div>';
  try {
    const m = await api(`api/message?account=${accId}&uid=${uid}`);
    const acc = accounts.find((a) => a.id === accId);
    v.innerHTML = `
      <div class="view-head"><button class="backBtn" id="backBtn">← Inbox</button><h2>${esc(m.subject)}</h2>
        <div class="meta">From: ${esc(m.from)}<br>To: ${esc(m.to)} · ${new Date(m.date).toLocaleString('en-GB')}
        ${m.attachments.length ? '<br>📎 ' + m.attachments.map((a) => esc(a.filename)).join(', ') : ''}</div></div>
      <div class="view-body" id="vb"></div>
      <div class="reply"><button class="btn" id="replyBtn">Reply</button></div>`;
    const vb = $('vb');
    if (m.html) {
      const fr = document.createElement('iframe');
      fr.sandbox = 'allow-same-origin';
      const baseCss = '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<style>html,body{margin:0;padding:10px;box-sizing:border-box;-webkit-text-size-adjust:100%;word-break:break-word;}' +
        'img{max-width:100%!important;height:auto!important;}</style>';
      fr.srcdoc = baseCss + m.html;
      // письма свёрстаны под 600-800px — ужимаем под ширину экрана;
      // пересчитываем несколько раз: картинки догружаются и меняют ширину
      const fit = () => {
        try {
          const d = fr.contentDocument;
          if (!d || !d.body) return;
          d.body.style.transform = ''; d.body.style.width = '';
          const w = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
          const avail = fr.getBoundingClientRect().width;
          if (w > avail + 2) {
            const s = avail / w;
            d.body.style.transformOrigin = '0 0';
            d.body.style.transform = `scale(${s})`;
            d.body.style.width = w + 'px';
          }
          d.documentElement.style.overflowX = 'hidden';
          d.body.style.overflowX = 'hidden';
        } catch {}
      };
      fr.addEventListener('load', () => { fit(); setTimeout(fit, 400); setTimeout(fit, 1500); });
      vb.appendChild(fr);
    } else {
      vb.innerHTML = `<pre>${esc(m.text)}</pre>`;
    }
    $('replyBtn').addEventListener('click', () => {
      openCompose(accId, m.from.match(/<(.+)>/)?.[1] || m.from, 'Re: ' + m.subject);
    });
    $('backBtn').addEventListener('click', () => { v.classList.remove('open'); selected = null; renderList(); });
    const cached = acc?.messages?.find((x) => x.uid === uid);
    if (cached && !cached.seen) { cached.seen = true; acc.unseen = Math.max(0, acc.unseen - 1); renderSidebar(); renderList(); }
  } catch (e) {
    v.innerHTML = `<div class="placeholder"><button class="backBtn" id="backBtn2">← Inbox</button>${esc(e.message)}</div>`;
    $('backBtn2').addEventListener('click', () => { v.classList.remove('open'); selected = null; renderList(); });
  }
}

// --- mobile drawer ---
function closeDrawer() { $('sidebar').classList.remove('open'); $('backdrop').classList.remove('show'); }
$('menuBtn').addEventListener('click', () => {
  $('sidebar').classList.toggle('open');
  $('backdrop').classList.toggle('show', $('sidebar').classList.contains('open'));
});
$('backdrop').addEventListener('click', closeDrawer);

// --- compose ---
function openCompose(fromId, to = '', subj = '') {
  $('cFrom').innerHTML = accounts.filter((a) => !a.error)
    .map((a) => `<option value="${a.id}" ${a.id===fromId?'selected':''}>${esc(a.email)}</option>`).join('');
  $('cTo').value = to; $('cSubj').value = subj; $('cText').value = '';
  $('cSt').textContent = ''; $('cSt').className = 'st';
  $('modal').classList.add('open');
}
$('composeBtn').addEventListener('click', () => openCompose(filter));
$('cCancel').addEventListener('click', () => $('modal').classList.remove('open'));
$('modal').addEventListener('click', (e) => { if (e.target === $('modal')) $('modal').classList.remove('open'); });
$('cSend').addEventListener('click', async () => {
  const st = $('cSt');
  st.className = 'st'; st.textContent = 'Sending…';
  try {
    await api('api/send', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ account: $('cFrom').value, to: $('cTo').value, subject: $('cSubj').value, text: $('cText').value }) });
    st.className = 'st ok'; st.textContent = 'Sent ✓';
    setTimeout(() => { $('modal').classList.remove('open'); reload(); }, 900);
  } catch (e) {
    st.className = 'st err'; st.textContent = e.message;
  }
});

// --- add mailbox ---
$('aBtn').addEventListener('click', async () => {
  const email = $('aEmail').value.trim(), password = $('aPass').value;
  $('addErr').textContent = '';
  if (!email || !password) { $('addErr').textContent = 'Please fill in the address and password'; return; }
  $('aBtn').disabled = true; $('aBtn').textContent = 'Connecting…';
  try {
    await api('api/accounts', { method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password }) });
    if ($('aRemember').checked) saveAcc(email, password);
    $('aEmail').value = ''; $('aPass').value = '';
    await reload();
  } catch (e) {
    $('addErr').textContent = e.message;
  } finally {
    $('aBtn').disabled = false; $('aBtn').textContent = '+ Add mailbox';
  }
});

$('refreshBtn').addEventListener('click', reload);
setInterval(() => reload().catch(() => {}), 60_000); // auto-refresh every minute

// iOS Safari: после закрытия клавиатуры страница может остаться сдвинутой — возвращаем на место
document.addEventListener('focusout', () => setTimeout(() => window.scrollTo(0, 0), 60));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const tag = document.activeElement?.tagName || '';
    if (!/INPUT|TEXTAREA|SELECT/.test(tag)) window.scrollTo(0, 0);
  });
}

init().catch((e) => { $('msgs').innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
</script>
</body>
</html>
