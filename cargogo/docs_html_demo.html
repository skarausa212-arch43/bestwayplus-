<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CargoGo — demo MVP</title>
<style>
  :root {
    --brand: #00A876; --brand-soft: #E8F6F0;
    --ink: #1E2430; --sub: #7A8394; --faint: #AEB6C4;
    --line: #EEF0F4; --bg: #EEF1F5; --card: #FFF;
    --danger: #E2544A; --danger-soft: #FDEEED;
    --warn: #F5A623; --warn-soft: #FEF5E4;
    --info: #4D8DFF; --info-soft: #EBF2FF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { background: #DDE2E9; display: flex; justify-content: center; min-height: 100vh; padding: 12px 0; }
  #phone { width: 100%; max-width: 420px; background: var(--bg); border-radius: 28px; overflow: hidden; position: relative; display: flex; flex-direction: column; height: 92vh; min-height: 640px; box-shadow: 0 20px 60px rgba(15,23,42,.25); }

  .roles { display: flex; gap: 4px; padding: 10px 12px; background: var(--ink); }
  .roles button { flex: 1; padding: 9px 4px; border: none; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; background: transparent; color: #8A94A6; position: relative; }
  .roles button.active { background: var(--brand); color: #fff; }
  .roles .rbadge { position: absolute; top: 2px; right: 6px; background: var(--danger); color: #fff; font-size: 9px; min-width: 15px; height: 15px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 4px; gap: 8px; }
  .logo { font-size: 20px; font-weight: 900; color: var(--ink); }
  .logo span { color: var(--brand); }
  .lang { display: flex; gap: 3px; background: #fff; border-radius: 999px; padding: 3px; box-shadow: 0 4px 12px rgba(15,23,42,.08); }
  .lang button { border: none; background: transparent; font-size: 12px; font-weight: 800; color: var(--faint); padding: 6px 8px; border-radius: 999px; cursor: pointer; }
  .lang button.on { background: var(--brand); color: #fff; }
  .bell { width: 40px; height: 40px; border-radius: 20px; background: #fff; border: none; font-size: 16px; cursor: pointer; position: relative; box-shadow: 0 4px 12px rgba(15,23,42,.08); flex-shrink: 0; }
  .bell .badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #fff; font-size: 9px; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

  #screen { flex: 1; overflow-y: auto; padding: 10px 14px 20px; }
  .card { background: var(--card); border-radius: 20px; padding: 16px; margin-bottom: 10px; box-shadow: 0 6px 24px rgba(15,23,42,.06); }
  h2 { font-size: 18px; color: var(--ink); margin-bottom: 8px; }
  .sub { font-size: 13px; color: var(--sub); }
  .faint { font-size: 11px; color: var(--faint); }
  .row { display: flex; align-items: center; justify-content: space-between; }

  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; background: var(--brand); color: #fff; transition: transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn.sec { background: var(--brand-soft); color: var(--brand); }
  .btn.danger { background: var(--danger); }
  .btn.ghost { background: transparent; color: var(--sub); }
  .btn:disabled { background: var(--line); color: var(--faint); cursor: default; }
  .btn.mt { margin-top: 8px; }

  input, select { width: 100%; padding: 12px 14px; border: 1px solid transparent; border-radius: 12px; background: #F8F9FB; font-size: 14px; color: var(--ink); margin-bottom: 8px; outline: none; }
  input:focus { border-color: var(--brand); }
  label { font-size: 12px; font-weight: 700; color: var(--sub); display: block; margin: 6px 0 4px; }

  .pill { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .pill.brand { background: var(--brand-soft); color: var(--brand); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.danger { background: var(--danger-soft); color: var(--danger); }

  .seg { display: flex; background: #F1F3F7; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; padding: 8px 6px; border: none; border-radius: 999px; font-weight: 700; font-size: 13px; background: transparent; color: var(--faint); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(15,23,42,.12); }

  .vopt { border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .vopt.on { border-color: var(--brand); background: var(--brand-soft); }

  .map { position: relative; height: 170px; border-radius: 16px; background: #F1EFEA; overflow: hidden; margin-bottom: 10px; }
  .blk { position: absolute; background: #E7E3DA; border-radius: 8px; }
  .park { position: absolute; background: #CDE8C9; border-radius: 8px; }
  .river { position: absolute; height: 12px; width: 120%; left: -10%; background: #BADAF2; border-radius: 6px; transform: rotate(-4deg); }
  .street-h { position: absolute; left: 0; right: 0; height: 7px; background: #fff; }
  .street-v { position: absolute; top: 0; bottom: 0; width: 6px; background: #fff; }
  .route { position: absolute; background: var(--brand); border-radius: 3px; opacity: .85; }
  .pin { position: absolute; width: 24px; height: 24px; border-radius: 12px; background: #fff; border: 2px solid var(--brand); display: flex; align-items: center; justify-content: center; font-size: 11px; transform: translate(-50%, -50%); transition: left 1s linear, top 1s linear; }
  .pin.truck { width: 34px; height: 34px; border-radius: 17px; font-size: 15px; z-index: 2; box-shadow: 0 0 0 6px rgba(0,168,118,.15); }
  .radar { position: absolute; left: 50%; top: 45%; width: 60px; height: 60px; border: 3px solid var(--brand); border-radius: 50%; transform: translate(-50%, -50%); animation: radar 1.6s ease-out infinite; }
  @keyframes radar { from { width: 30px; height: 30px; opacity: .8; } to { width: 130px; height: 130px; opacity: 0; } }

  #toast { position: absolute; top: 96px; left: 14px; right: 14px; background: var(--ink); color: #fff; border-radius: 14px; padding: 12px 14px; z-index: 50; transform: translateY(-140px); transition: transform .35s cubic-bezier(.22,1,.36,1); cursor: pointer; box-shadow: 0 10px 30px rgba(15,23,42,.35); }
  #toast.show { transform: translateY(0); }
  #toast b { font-size: 13px; } #toast div { font-size: 12px; color: #C9CFD9; margin-top: 2px; }

  .chatbox { max-height: 260px; overflow-y: auto; margin-bottom: 8px; }
  .msg { max-width: 80%; padding: 10px 12px; border-radius: 14px; margin: 4px 0; font-size: 14px; }
  .msg.mine { background: var(--brand); color: #fff; margin-left: auto; }
  .msg.their { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .msg.sys { background: transparent; color: var(--faint); font-size: 11px; text-align: center; max-width: 100%; }
  .msg .trnote { display: block; font-size: 10px; opacity: .75; margin-top: 3px; }
  .quick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
  .quick button { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 11px; font-size: 12px; color: var(--sub); cursor: pointer; }

  .offer-timer { width: 38px; height: 38px; border-radius: 19px; background: var(--brand-soft); color: var(--brand); font-weight: 900; display: flex; align-items: center; justify-content: center; }
  .offer-timer.low { background: var(--danger-soft); color: var(--danger); }
  .stars button { font-size: 30px; background: none; border: none; cursor: pointer; opacity: .25; }
  .stars button.on { opacity: 1; }
  .code-big { font-size: 34px; font-weight: 900; letter-spacing: 10px; color: var(--warn); text-align: center; }
  .notif-item { border-left: 3px solid var(--brand); }
  .notif-item.unread { background: var(--brand-soft); }
  .switch { position: relative; width: 52px; height: 30px; }
  .switch input { display: none; }
  .switch .tr { position: absolute; inset: 0; background: var(--line); border-radius: 15px; transition: .2s; }
  .switch input:checked + .tr { background: var(--brand); }
  .switch .th { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: .2s; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .switch input:checked + .tr .th { left: 25px; }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
</style>
</head>

<div id="phone">

// Быстрые фразы (q.*) переведены в словаре — мгновенно и офлайн.
// Свободный текст переводится через Claude API; при недоступности сети остаётся оригинал.
async function translateFree(msg) {
  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1000,
        messages: [{ role: 'user', content:
          'Translate this chat message into Polish, Russian and English. Reply ONLY with JSON like {"pl":"...","ru":"...","en":"..."} and nothing else. Message: ' + JSON.stringify(msg.text) }],
      }),
    });
    const data = await resp.json();
    const txt = (data.content || []).map(c => c.text || '').join('');
    const parsed = JSON.parse(txt.replace(/```json|```/g, '').trim());
    msg.tr = { pl: parsed.pl, ru: parsed.ru, en: parsed.en };
  } catch (e) {
    msg.tr = { pl: msg.text, ru: msg.text, en: msg.text }; // фолбэк: оригинал
  }
  msg.pending = false;
  render();
}

function sendChat(from, text) {
  if (!text || !text.trim()) return;
  const msg = { from, text: text.trim(), lang: userLang[from], tr: null, pending: true };
  msg.tr = {}; msg.tr[msg.lang] = msg.text;
  S.msgs.push(msg);
  notify(from === 'customer' ? 'driver' : 'customer', 'n.msg', null, [], msg.text);
  render();
  translateFree(msg);
}
function sendQuick(from, idx) {
  S.msgs.push({ from, key: 'q.' + idx });
  const toRole = from === 'customer' ? 'driver' : 'customer';
  notify(toRole, 'n.msg', 'q.' + idx, []);
  render();
}
function msgText(m, viewerLang) {
  if (m.key) return { text: t(m.key, [], viewerLang), translated: false }; // словарь — всегда на языке зрителя
  if (m.lang === viewerLang) return { text: m.text, translated: false };
  if (m.tr && m.tr[viewerLang]) return { text: m.tr[viewerLang], translated: true };
  return { text: m.text, translated: false, pending: m.pending };
}

function calcPrice(w) {
  const v = VEHICLES[w.vt];
  const km = Math.max(3, Math.min(40, (w.from.length + w.to.length) * 0.4));
  const transport = v.base + (w.vt === 'laweta' && !w.carRunning ? CFG.winchFee : 0);
  const dist = Math.round(km * v.perKm);
  const loaders = w.vt === 'laweta' ? 0 : w.loaders * CFG.loaderPrice;
  const urgent = w.urgent ? CFG.urgentFee : 0;
  const svc = Math.round((transport + dist + loaders + urgent) * CFG.serviceFeePct);
  return { km, transport, dist, loaders, urgent, svc, total: transport + dist + loaders + urgent + svc };
}
function sysMsg(statusKey) { S.msgs.push({ from: 'sys', key: 'st.' + statusKey }); }

const WAIT_FREE_MIN = 10, WAIT_PRICE = 2, WAIT_TICK_MS = 3000; // demo: 1 min = 3 s
function startWait() {
  S.wait = { mins: 0, fee: 0, int: null, notified: false };
  S.wait.int = setInterval(() => {
    S.wait.mins++;
    if (S.wait.mins > WAIT_FREE_MIN) {
      S.wait.fee = (S.wait.mins - WAIT_FREE_MIN) * WAIT_PRICE;
      if (!S.wait.notified) {
        S.wait.notified = true;
        notify('customer', 'n.waitPaid', 'n.waitPaidB', []);
        notify('driver', 'n.waitPaid', 'n.waitPaidB', []);
      }
    }
    render();
  }, WAIT_TICK_MS);
}
function stopWait() {
  if (!S.wait.int) return;
  clearInterval(S.wait.int); S.wait.int = null;
  if (S.wait.fee > 0 && S.order) S.order.price.total += S.wait.fee; // §36: доплата в счёт
}
function setStatus(st) {
  if (!S.order) return;
  if (S.order.status === 'driver_arrived' && st !== 'driver_arrived') stopWait();
  S.order.status = st;
  if (st === 'driver_arrived') startWait();
  sysMsg(st);
  if (I18N.pl['nc.' + st]) notify('customer', 'st.' + st, 'nc.' + st, [CFG.code]);
  render();
}
// §37: запрос изменения цены
function sendPriceReq() {
  const amount = parseInt(document.getElementById('prAmount').value, 10);
  const reason = document.getElementById('prReason').value.trim() || '—';
  if (!amount || amount <= 0) return;
  S.priceReq = { amount, reason, status: 'pending' };
  S.showPrForm = false;
  notify('driver', 'n.prSent', 'n.prSentB', [amount]);
  notify('customer', 'n.pr', 'n.prB', [amount, reason]);
  render();
}
function answerPriceReq(accept) {
  if (!S.priceReq) return;
  if (accept) {
    S.order.price.total = S.priceReq.amount;
    notify('driver', 'n.prAcc', 'n.prAccB', [S.priceReq.amount]);
    notify('customer', 'n.prAcc', 'n.prAccB', [S.priceReq.amount]);
  } else {
    notify('driver', 'n.prDec', 'n.prDecB', [S.order.price.total]);
  }
  S.priceReq = null;
  render();
}
function waitHTML() {
  if (!S.wait.int && !S.wait.fee) return '';
  const paid = S.wait.mins > WAIT_FREE_MIN;
  const txt = paid
    ? t('wait.paid', [S.wait.mins - WAIT_FREE_MIN, S.wait.fee])
    : t('wait.free', [WAIT_FREE_MIN - S.wait.mins]);
  return `<div class="card" style="border:2px solid ${paid ? 'var(--warn)' : 'var(--line)'}">
    <b style="color:${paid ? 'var(--warn)' : 'var(--ink)'}">${txt}</b>

}
function placeOrder() {
  const w = S.wiz;

  S.order = { id: 'Z' + Date.now().toString().slice(-5), ...w, price: calcPrice(w), status: 'searching', driver: null };

  notify('driver', 'n.newOrder', 'n.newOrderB', [w.from, w.to]);

function startOffer() {
  if (!S.order || S.order.status !== 'searching' || S.offerInt) return;
  S.offerTimer = 20;
  S.offerInt = setInterval(() => {
    S.offerTimer--;
    if (S.offerTimer <= 0) stopOffer();
    if (S.role === 'driver') render();
  }, 1000);
}
function stopOffer() { clearInterval(S.offerInt); S.offerInt = null; S.offerTimer = 0; }
function acceptOrder() {
  stopOffer();

}

function confirmCode() {
  const v = document.getElementById('codeInp').value.trim();

function cancelOrder(by) {
  stopOffer(); stopWait(); S.wait = { mins: 0, fee: 0, int: null, notified: false }; S.priceReq = null; S.showPrForm = false;
  setStatus('cancelled');

function finishRating() {
  if (S.tip > 0) { notify('driver', 'n.tip', 'n.tipB', [S.tip]); S.balance += S.tip; S.earnings[0].tip = S.tip; }
  if (S.rating > 0) notify('driver', 'n.rate', 'n.rateB', [S.rating]);

  S.wiz = { step: 1, from: '', to: '', vt: 'small_bus', cargo: '', loaders: 0, carRunning: true, urgent: true };
  S.rating = 0; S.tip = 0; S.wait = { mins: 0, fee: 0, int: null, notified: false }; S.priceReq = null; S.showPrForm = false;
  S.view = 'home'; render();
}

  }).join('');
  return `<div class="card"><h2>${t(me === 'driver' ? 'chatWith' : 'chat')}</h2>
    <div class="chatbox" id="chatbox">${msgs || '<div class="sub">' + t('firstMsg') + '</div>'}</div>
    <div class="quick">${[0,1,2,3,4,5].map(i => `<button onclick="sendQuick('${me}',${i})">${t('q.'+i, [], L)}</button>`).join('')}</div>
    <div style="display:flex;gap:6px">
      <input id="chatInp" placeholder="${t('ph.msg')}" style="margin:0" onkeydown="if(event.key==='Enter'){sendChat('${me}',this.value);this.value=''}">
      <button class="btn" style="width:52px" onclick="const i=document.getElementById('chatInp');sendChat('${me}',i.value);i.value=''">➤</button>
    </div></div>`;
}

function progressOf(st) { const i = FLOW_ORDER.indexOf(st); return i < 0 ? (st === 'completed' ? 1 : 0) : i / (FLOW_ORDER.length - 1); }

function customerHome() {
  const w = S.wiz, p = calcPrice(w);
  if (S.order && S.order.status !== 'cancelled') return customerActive();
  const steps = {
    1: `<h2>${t('step1')}</h2>
        <label>${t('from')}</label><input value="${w.from}" oninput="S.wiz.from=this.value" placeholder="${t('ph.from')}">
        <button class="pill brand" style="border:none;cursor:pointer;margin-bottom:8px" onclick="set({from:'Legnicka 58, Wrocław'})">${t('home')}</button>
        <button class="pill brand" style="border:none;cursor:pointer;margin-bottom:8px" onclick="set({from:'Świdnicka 12, Wrocław'})">${t('work')}</button>
        <label>${t('to')}</label><input value="${w.to}" oninput="S.wiz.to=this.value" placeholder="${t('ph.to')}">
        <button class="btn mt" onclick="set({step:2})">${t('next')}</button>`,
    2: `<h2>${t('step2')}</h2>
        ${Object.entries(VEHICLES).map(([k,v]) => `
          <div class="vopt ${w.vt===k?'on':''}" onclick="set({vt:'${k}'})">
            <div class="row"><b>${v.emoji} ${t('v.'+k)}</b><span class="sub">${t('upto')} ${v.payload} kg</span></div>
            <div class="sub">${t('vd.'+k)}</div>
          </div>`).join('')}
        <label>${t('cargoQ')}</label><input value="${w.cargo}" oninput="S.wiz.cargo=this.value" placeholder="${t('ph.cargo')}">
        ${w.vt === 'laweta'
          ? `<label>${t('carRun')}</label><div class="seg">
              <button class="${w.carRunning?'on':''}" onclick="set({carRunning:true})">${t('yes')}</button>
              <button class="${!w.carRunning?'on':''}" onclick="set({carRunning:false})">${t('no.winch',[CFG.winchFee])}</button></div>`
          : `<label>${t('loaders')}</label><div class="seg">
              ${[0,1,2].map(n => `<button class="${w.loaders===n?'on':''}" onclick="set({loaders:${n}})">${n===0?t('no'):n+' '+t('ppl')}</button>`).join('')}</div>`}
        <button class="btn mt" onclick="set({step:3})">${t('next')}</button>
        <button class="btn ghost mt" onclick="set({step:1})">${t('back')}</button>`,
    3: `<h2>${t('step3')}</h2>
        <div class="row" style="margin:4px 0"><span class="sub">${t('sum.transport')} · ${t('v.'+w.vt)}</span><span class="sub">${p.transport} zł</span></div>
        <div class="row" style="margin:4px 0"><span class="sub">${t('sum.dist')} · ${p.km.toFixed(0)} km</span><span class="sub">${p.dist} zł</span></div>
        ${p.loaders ? `<div class="row" style="margin:4px 0"><span class="sub">${t('sum.loader')}</span><span class="sub">${p.loaders} zł</span></div>` : ''}
        ${p.urgent ? `<div class="row" style="margin:4px 0"><span class="sub">${t('sum.urgent')}</span><span class="sub">${p.urgent} zł</span></div>` : ''}
        <div class="row" style="margin:4px 0"><span class="sub">${t('sum.svc')}</span><span class="sub">${p.svc} zł</span></div>
        <div class="row" style="border-top:1px solid var(--line);padding-top:8px;margin-top:8px">
          <b>${t('total')}</b><b style="font-size:22px">${p.total} zł</b></div>
        <div class="sub" style="margin:8px 0">${t('payNote')}</div>
        <button class="btn" onclick="placeOrder()">${t('payBtn')}</button>
        <button class="btn ghost mt" onclick="set({step:2})">${t('back')}</button>`,
  };
  return `<div class="card fade">${steps[w.step]}</div>` + (S.history.length ? `<div class="card"><h2>${t('history')}</h2>${S.history.map(o => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="sub">${o.from} → ${o.to}</span><span class="pill ${o.status==='completed'?'brand':'danger'}">${o.price.total} zł</span></div>`).join('')}</div>` : '');
}

function customerActive() {
  const o = S.order;
  if (o.status === 'completed') return rateScreen();
  const searching = o.status === 'searching';
  return `<div class="fade">
    ${mapHTML(searching ? null : progressOf(o.status), searching)}
    <div class="card">
      <div class="row"><span class="pill ${searching?'warn':'info'}">${t('st.'+o.status)}</span><b style="font-size:19px">${o.price.total} zł</b></div>
      <div class="sub" style="margin-top:8px">📍 ${o.from}</div>
      <div class="sub">🏁 ${o.to}</div>
      ${o.status === 'awaiting_confirmation' ? `<div style="background:var(--warn-soft);border-radius:12px;padding:12px;margin-top:10px"><div class="sub" style="font-weight:800;color:var(--ink)">${t('codeFor')}</div><div class="code-big">${CFG.code}</div></div>` : ''}
    </div>
    ${waitHTML()}
    ${S.priceReq && S.priceReq.status === 'pending' ? `<div class="card" style="border:2px solid var(--info)">
      <b>${t('pr.title')}</b>
      <div class="row" style="margin:8px 0"><span class="sub">${S.priceReq.reason}</span><b style="font-size:20px;color:var(--info)">${S.priceReq.amount} zł</b></div>
      <div style="display:flex;gap:8px">
        <button class="btn ghost" style="flex:1" onclick="answerPriceReq(false)">${t('pr.decline')}</button>
        <button class="btn" style="flex:2" onclick="answerPriceReq(true)">${t('pr.accept')}</button>
      </div></div>` : ''}
    ${o.driver ? `<div class="card"><div class="row">
      <div><b>👨‍🔧 ${o.driver.name}</b> <span style="color:var(--warn);font-weight:700">★ ${o.driver.rating}</span><div class="sub">${o.driver.car}</div></div>
      <button class="btn sec" style="width:auto;padding:10px 14px" onclick="S.view = S.view==='chat' ? 'active' : 'chat'; render()">💬</button>
    </div></div>` : ''}
    ${S.view === 'chat' ? chatHTML('customer') : ''}
    <button class="btn ${searching?'danger':'ghost'} mt" onclick="cancelOrder('customer')">${t('cancel')}</button>
  </div>`;
}

function rateScreen() {
  return `<div class="card fade" style="text-align:center">
    <div style="font-size:40px">✅</div><h2>${t('delivered')}</h2>
    <div class="sub" style="margin-bottom:12px">${t('rateMarek')}</div>
    <div class="stars">${[1,2,3,4,5].map(n => `<button class="${n<=S.rating?'on':''}" onclick="S.rating=${n};render()">⭐</button>`).join('')}</div>
    <label style="text-align:left">${t('tip')}</label>
    <div class="seg" style="margin-bottom:12px">${[0,5,10,20].map(n => `<button class="${S.tip===n?'on':''}" onclick="S.tip=${n};render()">${n===0?t('noTip'):n+' zł'}</button>`).join('')}</div>
    <button class="btn" ${S.rating===0?'disabled':''} onclick="finishRating()">${t('sendRate')}</button>
  </div>`;
}

function driverHome() {
  const o = S.order;
  const hasOffer = S.driverOnline && o && o.status === 'searching' && S.offerTimer > 0;
  const hasActive = o && o.driver && !['completed','cancelled'].includes(o.status);
  const net = o ? Math.round(o.price.total * (1 - CFG.commission)) : 0;
  return `<div class="fade">
    <div class="card"><div class="row">
      <div><b style="font-size:18px">${S.balance} zł</b><div class="sub">★ 4.9 · 214</div></div>
      <label class="switch"><input type="checkbox" ${S.driverOnline?'checked':''} onchange="toggleOnline(this.checked)"><span class="tr"><span class="th"></span></span></label>
    </div>
    <div class="sub" style="margin-top:6px">${S.driverOnline ? t('online') : t('offline')}</div></div>

    ${hasOffer ? `<div class="card" style="border:2px solid var(--brand)">
      <div class="row"><h2>${t('newOrder')}</h2><div class="offer-timer ${S.offerTimer<=5?'low':''}">${S.offerTimer}</div></div>
      <div class="sub">📍 ${o.from}</div><div class="sub">🏁 ${o.to}</div>
      <div class="sub">📦 ${o.cargo || t('v.'+o.vt)} · ${o.price.km.toFixed(0)} km${o.loaders ? ' · +'+o.loaders+' '+t('ppl') : ''}</div>
      <div class="row" style="margin:10px 0"><span class="sub">${t('yourNet')}</span><b style="color:var(--brand);font-size:20px">${net} zł</b></div>
      <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1" onclick="rejectOrder()">${t('reject')}</button><button class="btn" style="flex:2" onclick="acceptOrder()">${t('accept')}</button></div>
    </div>` : ''}

    ${!hasOffer && S.driverOnline && o && o.status === 'searching' ? `<div class="card"><div class="sub">${t('offerGone')} <button class="pill brand" style="border:none;cursor:pointer" onclick="startOffer();render()">${t('showAgain')}</button></div></div>` : ''}

    ${hasActive ? driverActive() : ''}
    ${!hasActive && !hasOffer ? `<div class="card"><div class="sub">${t('demoHintD')}</div></div>` : ''}

    <div class="card"><h2>${t('earnings')}</h2>
      ${S.earnings.map(e => { const c = Math.round(e.gross * CFG.commission); return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="sub">${t('order')} ${e.id} · ${e.gross} zł − ${c} zł${e.tip?' + '+t('tipW')+' '+e.tip+' zł':''}</span><b style="color:var(--brand)">+${e.gross - c + (e.tip||0)} zł</b></div>`; }).join('')}
      <button class="btn sec mt" onclick="notify('driver','n.payout','n.payoutB',[S.balance])">${t('payout')}</button>
    </div>
  </div>`;
}

function driverActive() {
  const o = S.order;
  const nx = NEXT[o.status];
  return `${mapHTML(progressOf(o.status), false)}
    <div class="card">
      <div class="row"><span class="pill info">${t('st.'+o.status)}</span><b>${o.price.total} zł</b></div>
      <div class="sub" style="margin-top:8px">📍 ${o.from}</div><div class="sub">🏁 ${o.to}</div>
      <div class="sub">📦 ${o.cargo || t('v.'+o.vt)}</div>
    </div>
    ${waitHTML()}
    ${nx ? `<button class="btn" onclick="setStatus('${nx}')">${t('a.'+nx)}</button>` : ''}
    ${S.priceReq && S.priceReq.status === 'pending' ? `<div class="card" style="margin-top:8px"><div class="sub">${t('pr.pending')}</div></div>`
      : S.showPrForm ? `<div class="card" style="margin-top:8px">
          <label>${t('pr.amount')}</label><input id="prAmount" inputmode="numeric" value="${o.price.total + 20}">
          <label>${t('pr.reason')}</label><input id="prReason" placeholder="${t('pr.reason')}">
          <button class="btn" onclick="sendPriceReq()">${t('pr.send')}</button>
        </div>`
      : `<button class="btn sec mt" onclick="S.showPrForm=true;render()">${t('pr.btn')}</button>`}
    ${o.status === 'awaiting_confirmation' ? `<div class="card mt" style="margin-top:8px"><h2>${t('codeFrom')}</h2><input id="codeInp" placeholder="${t('ph.code')}" inputmode="numeric"><button class="btn" onclick="confirmCode()">${t('finish')}</button></div>` : ''}
    <button class="btn sec mt" onclick="S.view = S.view==='chat' ? 'home' : 'chat'; render()">${t('chatWith')}</button>
    ${S.view === 'chat' ? chatHTML('driver') : ''}
    <button class="btn ghost mt" onclick="cancelOrder('driver')">${t('cancel')}</button>`;
}

function toggleOnline(v) {
  S.driverOnline = v;
  if (v) {
    notify('driver', 'n.online', 'n.onlineB', []);
    if (S.order && S.order.status === 'searching') startOffer();
  }
  render();
}

function adminHome() {
  const all = [...(S.order ? [S.order] : []), ...S.history];
  return `<div class="fade">
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      ${[[t('adm.orders'), all.length + 1], [t('adm.online'), S.driverOnline ? 1 : 0], [t('adm.rev'), Math.round(S.earnings.reduce((s,e)=>s+e.gross,0)*CFG.commission) + ' zł'], [t('adm.disputes'), 0]].map(([l,v]) => `<div class="card" style="flex:1;min-width:44%;margin:0"><div class="sub">${l}</div><b style="font-size:22px">${v}</b></div>`).join('')}
    </div>
    <div class="card"><h2>${t('adm.drivers')}</h2><div class="row"><div><b>Marek Kaczmarek</b><div class="sub">Renault Master · DW 4521K</div></div><span class="pill brand">${t('adm.approved')}</span></div></div>
    <div class="card"><h2>${t('adm.orders')}</h2>${all.length ? all.map(o => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="sub">${o.from} → ${o.to}</span><span class="pill ${o.status==='completed'?'brand':o.status==='cancelled'?'danger':'info'}">${t('st.'+o.status)}</span></div>`).join('') : '<div class="sub">' + t('adm.none') + '</div>'}</div>
    <div class="card"><h2>${t('adm.tariffs')}</h2>${[[t('v.small_bus')+' — '+t('adm.base'),'25 zł'],[t('v.big_bus')+' — '+t('adm.base'),'35 zł'],[t('v.laweta')+' — '+t('adm.base'),'80 zł'],[t('adm.comm'),'18%'],[t('adm.helper'),'40 zł'],[t('adm.winch'),'60 zł']].map(([l,v]) => `<div class="row" style="padding:5px 0"><span class="sub">${l}</span><b>${v}</b></div>`).join('')}</div>
  </div>`;
}

function notifsScreen() {
  const items = S.notifs.filter(n => n.role === S.role);
  const html = `<div class="fade">
    <div class="card"><div class="row"><h2>${t('notifs')}</h2><button class="pill brand" style="border:none;cursor:pointer" onclick="S.view='home';render()">${t('close')}</button></div></div>
    ${items.length ? items.map(n => `<div class="card notif-item ${n.read?'':'unread'}"><b style="font-size:14px">${renderNotifTitle(n)}</b><div class="sub">${renderNotifBody(n)}</div><div class="faint" style="margin-top:4px">${n.time}</div></div>`).join('') : '<div class="card"><div class="sub">' + t('noNotifs') + '</div></div>'}
  </div>`;
  items.forEach(n => n.read = true);
  setTimeout(updateBadges, 50);
  return html;
}

function render() {
  document.querySelectorAll('.roles button').forEach(b => b.classList.remove('active'));
  document.getElementById('rb-' + S.role).classList.add('active');
  document.querySelectorAll('[data-r]').forEach(el => {
    // подписи ролей — на языке активной роли
    el.textContent = t(el.getAttribute('data-r'));
  });
  document.getElementById('langSel').innerHTML = LANGS.map(l =>
    `<button class="${userLang[S.role]===l?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('');
  const scr = document.getElementById('screen');
  let html = '';
  if (S.view === 'notifs') html = notifsScreen();
  else if (S.role === 'customer') html = customerHome();
  else if (S.role === 'driver') html = driverHome();
  else html = adminHome();
  scr.innerHTML = html;
  updateBadges();
  const cb = document.getElementById('chatbox');
  if (cb) cb.scrollTop = cb.scrollHeight;
}
render();
</script>
</body>
</html>
