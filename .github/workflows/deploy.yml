name: Deploy site to server

# Обновляет главную страницу bestwayplus.pl на сервере.
# На время переезда сайт держим синхронным на обоих серверах: DNS может
# указывать ещё на старый, а может уже на новый — версия одинаковая.

on:
  push:
    branches:
      - claude/server-access-ajcs5w
      - claude/migrate-bestwayplus-to-lumi-f335sl
    paths: [bestwayplus.html]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: "130.17.12.118"          # старый сервер (Caddy)
            dest: /var/www/bestwayplus/index.html
            reload: "true"
          - host: "89.127.193.91"          # сервер lumi24.pl (nginx)
            dest: /var/www/bestwayplus/index.html
            reload: "nginx -t && systemctl reload nginx"
    steps:
      - name: Pull latest site onto ${{ matrix.host }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ matrix.host }}
          username: root
          password: ${{ matrix.host == '89.127.193.91' && secrets.LUMI24_SERVER_PASSWORD || secrets.SERVER_PASSWORD }}
          script: |
            set -e
            mkdir -p "$(dirname ${{ matrix.dest }})"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/bestwayplus.html" -o ${{ matrix.dest }}
            ${{ matrix.reload }}
            echo "Deployed $(date -u +%FT%TZ), size: $(stat -c%s ${{ matrix.dest }}) bytes"
