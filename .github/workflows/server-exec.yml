name: Server exec

# Runs a shell script on the server over SSH. Triggered manually (workflow_dispatch).
# Used to administer the box (diagnostics, installs) without a local terminal.

on:
  workflow_dispatch:
    inputs:
      script:
        description: Shell script to run on the server
        required: true
        default: "uname -a"
      host:
        description: Server to run on (old bestwayplus box by default)
        required: false
        default: "130.17.12.118"

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Run script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.host }}
          username: root
          # Сервер lumi.pl использует свой пароль (секрет LUMI_SERVER_PASSWORD),
          # старый сервер bestwayplus — SERVER_PASSWORD.
          password: ${{ inputs.host == '51.254.176.170' && secrets.LUMI_SERVER_PASSWORD || secrets.SERVER_PASSWORD }}
          command_timeout: 40m
          script: ${{ inputs.script }}
