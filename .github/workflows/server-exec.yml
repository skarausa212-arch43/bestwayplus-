name: Server exec

# Runs a shell script on one of the project's servers over SSH.
# Triggered manually (workflow_dispatch) to administer a box without a local terminal.
#
# Hosts:
#   130.17.12.118 — старый сервер bestwayplus (Caddy, почта, paymesafe, office)
#   89.127.193.91 — сервер lumi24.pl (nginx), куда переезжает сайт

on:
  workflow_dispatch:
    inputs:
      script:
        description: Shell script to run on the server
        required: true
        default: "uname -a"
      host:
        description: Server to run on
        required: true
        default: "130.17.12.118"
        type: choice
        options:
          - "130.17.12.118"
          - "89.127.193.91"

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Run script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ inputs.host }}
          username: root
          password: ${{ inputs.host == '89.127.193.91' && secrets.LUMI24_SERVER_PASSWORD || secrets.SERVER_PASSWORD }}
          command_timeout: 40m
          script: ${{ inputs.script }}
