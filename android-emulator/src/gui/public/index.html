<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Эмулятор Android-устройств</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #4d9fff;
    --ok: #3ecf8e;
    --warn: #e8b339;
    --bad: #ff5f56;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 340px 1fr 340px; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1200px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card + .card { margin-top: 14px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select, input[type=text] {
    width: 100%; padding: 7px 9px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; font: inherit;
  }
  input[type=text] { font-family: var(--mono); font-size: 12px; }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  button {
    padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 600; }
  button.danger { color: var(--bad); }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .check input { flex: none; }

  dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 12px; }
  dl.kv dt { color: var(--muted); white-space: nowrap; }
  dl.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }

  /* phone */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .bezel {
    background: #05070b; border: 2px solid #2b313d; border-radius: 34px;
    padding: 14px 10px; box-shadow: 0 18px 50px rgba(0,0,0,.55); position: relative;
  }
  .bezel::before {
    content: ""; position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 58px; height: 4px; border-radius: 3px; background: #222834;
  }
  .glass { background: #000; border-radius: 22px; overflow: hidden; display: block; position: relative; }
  .glass img { display: block; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
  .glass .empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 13px; text-align: center; padding: 20px;
  }
  .urlbar { display: flex; gap: 6px; width: 100%; max-width: 520px; }
  .urlbar input { flex: 1; }
  .urlbar button { flex: none; padding: 7px 10px; }
  .devlabel { color: var(--muted); font-size: 12px; font-family: var(--mono); }

  ul.sessions { list-style: none; margin: 0; padding: 0; }
  ul.sessions li {
    display: flex; align-items: center; gap: 8px; padding: 8px;
    border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; font-size: 12px;
  }
  ul.sessions li.active { border-color: var(--accent); }
  ul.sessions .name { flex: 1; cursor: pointer; }
  ul.sessions .name b { display: block; font-weight: 600; font-size: 13px; }
  ul.sessions .name span { color: var(--muted); font-family: var(--mono); }

  .checks { max-height: 340px; overflow: auto; font-size: 12px; }
  .checks div { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid #20242e; }
  .checks .mark { flex: none; width: 34px; font-family: var(--mono); }
  .mark.pass { color: var(--ok); } .mark.warn { color: var(--warn); } .mark.fail { color: var(--bad); }
  .summary { font-family: var(--mono); font-size: 12px; margin-bottom: 8px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .err { color: var(--bad); font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
  .busy { color: var(--accent); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>Эмулятор Android-устройств</h1>
  <span class="sub">панель управления · <span id="platform"></span></span>
</header>

<div class="layout">

  <!-- ─── настройки ─────────────────────────────────────────── -->
  <div>
    <div class="card">
      <h2>Устройство</h2>

      <label for="deviceFilter">Модель</label>
      <input type="text" id="deviceFilter" placeholder="фильтр: pixel, samsung, tablet…">
      <select id="device" size="1" style="margin-top:6px"></select>

      <label for="locale">Локаль</label>
      <select id="locale"></select>

      <label for="timezone">Часовой пояс</label>
      <select id="timezone"></select>

      <label for="orientation">Ориентация</label>
      <select id="orientation">
        <option value="portrait">Портрет</option>
        <option value="landscape">Ландшафт</option>
      </select>

      <label for="seed">Seed сессии</label>
      <div class="row">
        <input type="text" id="seed" value="default-seed" placeholder="любая строка">
        <button id="randomSeed" style="flex:none" title="Случайный seed">🎲</button>
      </div>

      <label for="upstream">Вышестоящий прокси</label>
      <input type="text" id="upstream" placeholder="socks5://user:pass@host:1080">

      <label for="publicIp">Внешний IP (для WebRTC)</label>
      <input type="text" id="publicIp" placeholder="203.0.113.7">

      <label for="fontsDir">Каталог шрифтов Android</label>
      <input type="text" id="fontsDir" placeholder="./android-fonts">

      <label for="geo">Геопозиция (широта, долгота)</label>
      <div class="row">
        <input type="text" id="geoLat" placeholder="55.7558">
        <input type="text" id="geoLon" placeholder="37.6173">
      </div>
      <div class="note" style="margin-top:4px">Пусто — берётся город локали.</div>

      <label for="battery">Батарея: <span id="batteryVal">авто</span></label>
      <div class="row">
        <input type="range" id="battery" min="0" max="100" value="-1" style="padding:0">
        <label style="flex:none;margin:0;display:flex;gap:6px;align-items:center">
          <input type="checkbox" id="charging"> заряжается
        </label>
      </div>

      <label for="startUrl">Открыть при запуске</label>
      <input type="text" id="startUrl" placeholder="https://example.com">

      <div class="check">
        <input type="checkbox" id="headed">
        <label for="headed" style="margin:0">Показывать окно браузера</label>
      </div>

      <div class="row" style="margin-top:14px">
        <button class="primary" id="launch">Запустить</button>
        <button id="tls">JA3 / JA4</button>
      </div>
      <div id="launchState"></div>
    </div>

    <div class="card">
      <h2>Пресеты</h2>
      <select id="presetList"></select>
      <div class="row" style="margin-top:8px">
        <button id="presetLoad">Загрузить</button>
        <button id="presetSave">Сохранить</button>
        <button id="presetDelete" class="danger" style="flex:none">✕</button>
      </div>
      <label for="presetName">Имя для сохранения</label>
      <input type="text" id="presetName" placeholder="например: PL-магазин-1">
      <div class="row" style="margin-top:10px">
        <button id="forget" class="danger">Стереть состояние устройства</button>
      </div>
      <div id="presetState"></div>
    </div>

    <div class="card">
      <h2>Запущенные</h2>
      <ul class="sessions" id="sessions"></ul>
      <div class="note" id="noSessions">Пока ничего не запущено.</div>
    </div>
  </div>

  <!-- ─── экран ─────────────────────────────────────────────── -->
  <div class="stage">
    <div class="urlbar">
      <button id="back" title="Назад">←</button>
      <button id="forward" title="Вперёд">→</button>
      <button id="reload" title="Обновить">⟳</button>
      <input type="text" id="url" placeholder="example.com" disabled>
      <button id="go" disabled>Перейти</button>
      <button id="shot" disabled title="Скриншот">📷</button>
      <button id="reset" disabled title="Очистить cookies и хранилище">🧹</button>
    </div>

    <div class="bezel">
      <div class="glass" id="glass">
        <img id="screen" alt="">
        <div class="empty" id="screenEmpty">Запустите устройство слева —<br>здесь появится его экран</div>
      </div>
    </div>

    <div class="devlabel" id="devLabel"></div>
  </div>

  <!-- ─── личность и проверка ───────────────────────────────── -->
  <div>
    <div class="card">
      <h2>Личность</h2>
      <dl class="kv" id="preview"></dl>
    </div>

    <div class="card">
      <h2>Проверка</h2>
      <button id="verify" disabled>Проверить эмуляцию</button>
      <div id="verifyState"></div>
      <div class="summary" id="verifySummary"></div>
      <div class="checks" id="verifyChecks"></div>
    </div>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { current: null, sse: null, viewport: null, devices: [], locales: [], presets: {} };

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

function config() {
  const lat = $('geoLat').value.trim();
  const lon = $('geoLon').value.trim();
  const batt = Number($('battery').value);
  return {
    deviceId: $('device').value,
    locale: $('locale').value,
    timezone: $('timezone').value || null,
    orientation: $('orientation').value,
    seed: $('seed').value || 'default-seed',
    upstream: $('upstream').value.trim(),
    publicIp: $('publicIp').value.trim() || null,
    fontsDir: $('fontsDir').value.trim() || null,
    // Both coordinates or neither: half a position is not a position.
    geolocation: lat && lon ? { latitude: Number(lat), longitude: Number(lon) } : null,
    // -1 on the slider means "leave it to the device profile".
    battery: batt >= 0 ? { level: batt / 100, charging: $('charging').checked } : null,
    headless: !$('headed').checked,
    url: $('startUrl').value.trim() || null,
  };
}

function applyConfig(c) {
  const set = (id, v) => { if (v !== undefined && v !== null) $(id).value = v; };
  set('device', c.deviceId); set('locale', c.locale); set('orientation', c.orientation);
  set('seed', c.seed); set('upstream', c.upstream); set('publicIp', c.publicIp);
  set('fontsDir', c.fontsDir); set('startUrl', c.url);
  $('timezone').value = c.timezone || '';
  $('geoLat').value = c.geolocation ? c.geolocation.latitude : '';
  $('geoLon').value = c.geolocation ? c.geolocation.longitude : '';
  $('battery').value = c.battery ? Math.round(c.battery.level * 100) : -1;
  $('charging').checked = !!(c.battery && c.battery.charging);
  $('headed').checked = c.headless === false;
  updateBatteryLabel();
  refreshPreview();
}

function kv(target, pairs) {
  target.innerHTML = '';
  for (const [k, v] of pairs) {
    const dt = document.createElement('dt');
    dt.textContent = k;
    const dd = document.createElement('dd');
    dd.textContent = v;
    target.append(dt, dd);
  }
}

// ─── превью личности ───────────────────────────────────────────
let previewTimer;
async function refreshPreview() {
  clearTimeout(previewTimer);
  previewTimer = setTimeout(async () => {
    try {
      const c = config();
      const p = await api('POST', '/api/preview', c);
      kv($('preview'), [
        ['seed id', p.seedId],
        ['ориентация', p.orientation === 'landscape' ? 'ландшафт' : 'портрет'],
        ['UA', p.userAgent],
        ['модель', p.model],
        ['Android', p.platformVersion],
        ['Chrome', p.chrome],
        ['GPU', p.gpu],
        ['экран', p.screen],
        ['ядра / память', `${p.cores} / ${p.memory} ГБ`],
        ['таймзона', p.timezone],
        ['языки', p.languages.join(', ')],
        ['Accept-Language', p.acceptLanguage],
        ['Sec-CH-UA', p.secChUa],
        ['геопозиция', `${p.geolocation.latitude}, ${p.geolocation.longitude} ±${p.geolocation.accuracy}м`],
        ['батарея', `${Math.round(p.battery.level * 100)}%${p.battery.charging ? ', заряжается' : ''}`],
        ['страна выхода', p.country],
        ['TLS-шаблон', p.tlsTemplate],
      ]);
    } catch (err) {
      $('preview').innerHTML = `<dd class="err">${err.message}</dd>`;
    }
  }, 150);
}

// ─── экран ─────────────────────────────────────────────────────
function sizeGlass() {
  const vp = state.viewport;
  const glass = $('glass');
  if (!vp) {
    glass.style.width = '300px';
    glass.style.height = '620px';
    return;
  }
  // Fit the device's own aspect ratio into the space the layout allows.
  const maxH = Math.max(320, window.innerHeight - 260);
  const maxW = 420;
  const scale = Math.min(maxW / vp.width, maxH / vp.height);
  glass.style.width = Math.round(vp.width * scale) + 'px';
  glass.style.height = Math.round(vp.height * scale) + 'px';
}
window.addEventListener('resize', sizeGlass);

function connectScreen(id) {
  if (state.sse) state.sse.close();
  state.sse = new EventSource(`/api/sessions/${id}/screen`);
  state.sse.onmessage = (e) => {
    $('screen').src = 'data:image/jpeg;base64,' + e.data;
    $('screenEmpty').style.display = 'none';
  };
}

/** Screencast frames cover the viewport, so a click maps by proportion. */
function toViewport(ev) {
  const img = $('screen');
  const r = img.getBoundingClientRect();
  const vp = state.viewport;
  return {
    x: Math.round(((ev.clientX - r.left) / r.width) * vp.width),
    y: Math.round(((ev.clientY - r.top) / r.height) * vp.height),
  };
}

$('glass').addEventListener('click', async (ev) => {
  if (!state.current) return;
  const { x, y } = toViewport(ev);
  await act({ type: 'tap', x, y });
});

$('glass').addEventListener('wheel', (ev) => {
  if (!state.current) return;
  ev.preventDefault();
  act({ type: 'scroll', dy: ev.deltaY });
}, { passive: false });

document.addEventListener('keydown', (ev) => {
  if (!state.current) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (ev.key.length === 1) act({ type: 'type', text: ev.key });
  else if (['Enter', 'Backspace', 'Tab', 'Escape'].includes(ev.key)) act({ type: 'key', key: ev.key });
});

async function act(payload) {
  try {
    const r = await api('POST', `/api/sessions/${state.current}/action`, payload);
    if (r.url) $('url').value = r.url;
  } catch (err) { /* the session may have just closed */ }
}

// ─── сессии ────────────────────────────────────────────────────
async function refreshSessions() {
  const list = await api('GET', '/api/sessions');
  const ul = $('sessions');
  ul.innerHTML = '';
  $('noSessions').style.display = list.length ? 'none' : 'block';

  for (const s of list) {
    const li = document.createElement('li');
    if (s.id === state.current) li.className = 'active';

    const name = document.createElement('div');
    name.className = 'name';
    name.innerHTML = `<b></b><span></span>`;
    name.querySelector('b').textContent = s.deviceName;
    name.querySelector('span').textContent = `${s.locale} · ${s.seedId.slice(0, 8)}`;
    name.onclick = () => select(s);

    const close = document.createElement('button');
    close.className = 'danger';
    close.textContent = '✕';
    close.title = 'Закрыть';
    close.onclick = async () => {
      await api('DELETE', `/api/sessions/${s.id}`);
      if (state.current === s.id) clearSelection();
      refreshSessions();
    };

    li.append(name, close);
    ul.append(li);
  }
}

function select(s) {
  state.current = s.id;
  state.viewport = s.viewport;
  sizeGlass();
  connectScreen(s.id);
  for (const b of ['url', 'go', 'verify', 'shot', 'reset']) $(b).disabled = false;
  $('url').value = s.url || '';
  $('devLabel').textContent =
    `${s.deviceName} · ${s.screen} · ${s.gpu}` + (s.upstream ? ` · через прокси` : '');
  if (!s.fontsActive && $('fontsDir').value.trim()) {
    $('devLabel').textContent += ' · шрифты не ограничены';
  }
  refreshSessions();
}

function clearSelection() {
  state.current = null;
  state.viewport = null;
  if (state.sse) { state.sse.close(); state.sse = null; }
  $('screen').removeAttribute('src');
  $('screenEmpty').style.display = 'grid';
  for (const b of ['url', 'go', 'verify', 'shot', 'reset']) $(b).disabled = true;
  $('devLabel').textContent = '';
  sizeGlass();
}

// ─── действия ──────────────────────────────────────────────────
$('launch').onclick = async () => {
  const btn = $('launch');
  btn.disabled = true;
  $('launchState').innerHTML = '<div class="busy">Поднимаю прокси и браузер…</div>';
  try {
    const s = await api('POST', '/api/sessions', config());
    $('launchState').innerHTML = '';
    await refreshSessions();
    select(s);
  } catch (err) {
    $('launchState').innerHTML = `<div class="err">${err.message}</div>`;
  } finally {
    btn.disabled = false;
  }
};

$('tls').onclick = async () => {
  $('launchState').innerHTML = '<div class="busy">Считаю ClientHello…</div>';
  try {
    const r = await api('POST', '/api/tls', config());
    $('launchState').innerHTML =
      `<dl class="kv"><dt>JA3</dt><dd>${r.ja3}</dd><dt>JA4</dt><dd>${r.ja4}</dd></dl>` +
      `<div class="note">JA3 у Chrome меняется от соединения к соединению — он перемешивает
       порядок расширений. Стабилен JA4.</div>`;
  } catch (err) {
    $('launchState').innerHTML = `<div class="err">${err.message}</div>`;
  }
};

$('go').onclick = async () => {
  const r = await api('POST', `/api/sessions/${state.current}/navigate`, { url: $('url').value });
  $('url').value = r.url;
};
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
$('back').onclick = () => act({ type: 'back' });
$('forward').onclick = () => act({ type: 'forward' });
$('reload').onclick = () => act({ type: 'reload' });

$('verify').onclick = async () => {
  $('verifyState').innerHTML = '<div class="busy">Снимаю отпечаток…</div>';
  $('verifyChecks').innerHTML = '';
  try {
    const r = await api('POST', `/api/sessions/${state.current}/verify`);
    $('verifyState').innerHTML = '';
    const s = r.summary;
    $('verifySummary').textContent =
      `${s.pass}/${s.total} пройдено` +
      (s.warn ? `, предупреждений: ${s.warn}` : '') +
      (s.fail ? `, ОШИБОК: ${s.fail}` : '');
    for (const c of r.checks) {
      const row = document.createElement('div');
      const mark = document.createElement('span');
      mark.className = 'mark ' + c.status;
      mark.textContent = c.status === 'pass' ? 'ok' : c.status === 'warn' ? 'warn' : 'FAIL';
      const text = document.createElement('span');
      text.textContent = c.name + (c.status === 'pass' ? '' : ` — ${JSON.stringify(c.actual)}`);
      row.append(mark, text);
      $('verifyChecks').append(row);
    }
  } catch (err) {
    $('verifyState').innerHTML = `<div class="err">${err.message}</div>`;
  }
};

// ─── новые контролы ────────────────────────────────────────────
function updateBatteryLabel() {
  const v = Number($('battery').value);
  $('batteryVal').textContent = v < 0 ? 'авто' : `${v}%`;
}
$('battery').addEventListener('input', () => { updateBatteryLabel(); refreshPreview(); });
$('charging').addEventListener('change', refreshPreview);

$('randomSeed').onclick = () => {
  $('seed').value = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  refreshPreview();
};

// Selecting a locale moves the timezone and the position with it — they are
// one identity, and leaving a stale Moscow fix under a Brazilian locale is the
// contradiction this panel exists to prevent.
$('locale').addEventListener('change', () => {
  const l = state.locales.find((x) => x.tag === $('locale').value);
  if (l) {
    $('timezone').value = l.timezone;
    $('geoLat').value = '';
    $('geoLon').value = '';
  }
  refreshPreview();
});

$('deviceFilter').addEventListener('input', () => {
  const q = $('deviceFilter').value.trim().toLowerCase();
  const sel = $('device');
  const keep = state.devices.filter(
    (d) => !q || `${d.name} ${d.id} ${d.formFactor} ${d.gpu}`.toLowerCase().includes(q)
  );
  const previous = sel.value;
  sel.innerHTML = '';
  for (const d of keep) {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = `${d.name} — ${d.screen}`;
    sel.append(o);
  }
  if (keep.some((d) => d.id === previous)) sel.value = previous;
  refreshPreview();
});

$('shot').onclick = async () => {
  const r = await api('POST', `/api/sessions/${state.current}/screenshot`, {});
  const a = document.createElement('a');
  a.href = 'data:image/png;base64,' + r.png;
  a.download = `screen-${Date.now()}.png`;
  a.click();
};

$('reset').onclick = async () => {
  await api('POST', `/api/sessions/${state.current}/reset`, {});
  $('url').value = 'about:blank';
};

// ─── пресеты ───────────────────────────────────────────────────
async function refreshPresets(selected) {
  const all = await api('GET', '/api/presets');
  state.presets = all;
  const sel = $('presetList');
  sel.innerHTML = '';
  for (const name of Object.keys(all).sort()) {
    const o = document.createElement('option');
    o.value = name;
    o.textContent = name;
    sel.append(o);
  }
  if (selected) sel.value = selected;
}

$('presetSave').onclick = async () => {
  const name = $('presetName').value.trim() || $('presetList').value;
  if (!name) {
    $('presetState').innerHTML = '<div class="err">Укажите имя пресета</div>';
    return;
  }
  await api('POST', '/api/presets', { name, config: config() });
  $('presetName').value = '';
  $('presetState').innerHTML = `<div class="note">Сохранено: ${name}</div>`;
  refreshPresets(name);
};

$('presetLoad').onclick = () => {
  const c = state.presets[$('presetList').value];
  if (c) applyConfig(c);
};

$('presetDelete').onclick = async () => {
  const name = $('presetList').value;
  if (!name) return;
  await api('DELETE', `/api/presets/${encodeURIComponent(name)}`);
  $('presetState').innerHTML = `<div class="note">Удалён: ${name}</div>`;
  refreshPresets();
};

$('forget').onclick = async () => {
  try {
    await api('POST', '/api/state/forget', config());
    $('presetState').innerHTML =
      '<div class="note">Состояние стёрто — cookies и хранилище этого seed удалены.</div>';
  } catch (err) {
    $('presetState').innerHTML = `<div class="err">${err.message}</div>`;
  }
};

for (const id of ['device', 'seed', 'timezone', 'orientation']) {
  $(id).addEventListener('input', refreshPreview);
  $(id).addEventListener('change', refreshPreview);
}

// ─── старт ─────────────────────────────────────────────────────
(async () => {
  const cfg = await api('GET', '/api/config');
  $('platform').textContent = cfg.platform;

  state.devices = cfg.devices;
  state.locales = cfg.locales;

  for (const d of cfg.devices) {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = `${d.name} — ${d.screen}`;
    $('device').append(o);
  }
  for (const l of cfg.locales) {
    const o = document.createElement('option');
    o.value = l.tag;
    o.textContent = `${l.tag} · ${l.country} · ${l.timezone}`;
    $('locale').append(o);
  }

  // Timezones are grouped by region, and the first entry means "whatever the
  // locale implies" so the two cannot silently disagree by default.
  const auto = document.createElement('option');
  auto.value = '';
  auto.textContent = '— по локали —';
  $('timezone').append(auto);
  for (const [group, zones] of Object.entries(cfg.timezones)) {
    const g = document.createElement('optgroup');
    g.label = group;
    for (const z of zones) {
      const o = document.createElement('option');
      o.value = z;
      o.textContent = z;
      g.append(o);
    }
    $('timezone').append(g);
  }

  $('locale').value = 'ru-RU';
  updateBatteryLabel();
  sizeGlass();
  refreshPreview();
  refreshSessions();
  refreshPresets();
  setInterval(refreshSessions, 5000);
})();
</script>
</body>
</html>
